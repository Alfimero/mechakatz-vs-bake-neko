<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechaKatz — CONFIG</title>
<!-- ============================================================
ARCHIVO GENERADO por build_config_editor.js a partir de
mechakatz_vs_kaiju_V9.html (bloques extraidos literalmente).
NO editar a mano: tras cambiar el panel CONFIG del juego, regenerar con
  node build_config_editor.js
La config se comparte con el juego via localStorage (mechakatz_config_v9);
el juego abierto en el mismo navegador aplica los cambios en vivo.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0014;
    --pink:#ff2e88;
    --cyan:#00f0ff;
    --yellow:#ffea00;
    --purple:#9b30ff;
    --green:#00ff7f;
    --red:#ff4040;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--cyan);
    font-family:'VT323',monospace;
  }
  #config-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(3px);
  }
  #config-modal.show{display:flex}
  #config-box{
    position:relative;
    width:min(980px,95vw);
    height:min(700px,92vh);
    display:grid;
    grid-template-rows:auto 1fr auto;
    background:linear-gradient(145deg,#0e0024 0%,#1a0040 100%);
    border:2px solid var(--pink);
    box-shadow:0 0 60px rgba(255,46,136,.55),inset 0 0 0 1px rgba(0,240,255,.12);
  }
  #config-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 22px;
    border-bottom:1px solid rgba(255,46,136,.4);
  }
  #config-head h2{
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:13px;
    text-shadow:2px 2px 0 var(--pink);
  }
  #config-head .sub{
    margin-left:auto;
    margin-right:34px;
    color:var(--cyan);
    opacity:.72;
    font-size:14px;
  }
  #config-body{
    display:grid;
    grid-template-columns:170px 1fr;
    overflow:hidden;
  }
  #config-tabs{
    overflow-y:auto;
    padding:10px 0;
    border-right:1px solid rgba(255,46,136,.3);
    background:rgba(0,0,0,.35);
  }
  #config-tabs button{
    display:block;
    width:100%;
    padding:10px 16px;
    border:none;
    border-left:3px solid transparent;
    background:none;
    color:var(--cyan);
    cursor:pointer;
    text-align:left;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    letter-spacing:.5px;
  }
  #config-tabs button:hover{background:rgba(255,46,136,.15);color:var(--yellow)}
  #config-tabs button.active{background:rgba(255,46,136,.24);color:var(--yellow);border-left-color:var(--pink)}
  #config-content{
    overflow-y:auto;
    padding:18px 24px;
    color:#dcdcff;
    font-size:16px;
  }
  #config-content::-webkit-scrollbar,
  #config-tabs::-webkit-scrollbar{width:8px}
  #config-content::-webkit-scrollbar-track,
  #config-tabs::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
  #config-content::-webkit-scrollbar-thumb,
  #config-tabs::-webkit-scrollbar-thumb{background:var(--pink);border:1px solid #000}
  #config-foot{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:10px;
    padding:12px 22px;
    border-top:1px solid rgba(255,46,136,.4);
    background:rgba(0,0,0,.35);
  }
  #config-foot button{
    padding:8px 14px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
  }
  #config-foot button:hover{background:var(--cyan);color:#000}
  #config-foot .danger{border-color:var(--red);color:var(--red)}
  #config-foot .danger:hover{background:var(--red);color:#000}
  #config-foot .primary{border-color:var(--green);color:var(--green)}
  #config-foot .primary:hover{background:var(--green);color:#000}

  .cfg-section{
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(0,240,255,.18);
  }
  .cfg-section:last-child{border-bottom:none}
  .cfg-section h3{
    margin-bottom:10px;
    color:var(--pink);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .cfg-section h4{
    margin:12px 0 6px;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    text-transform:uppercase;
  }
  .cfg-row{
    display:grid;
    grid-template-columns:200px 1fr 72px;
    gap:10px;
    align-items:center;
    padding:5px 0;
  }
  .cfg-row label{color:#bbe4ff;font-size:14px}
  .cfg-row input[type=range]{width:100%;accent-color:var(--pink)}
  .cfg-row input[type=number],
  .cfg-row input[type=text],
  .cfg-row select{
    width:100%;
    padding:4px 6px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:14px;
  }
  .cfg-row input[type=color]{
    width:44px;
    height:26px;
    padding:0;
    border:1px solid var(--cyan);
    background:#000;
    cursor:pointer;
  }
  .cfg-row .val{text-align:right;color:var(--yellow);font-size:14px}
  .cfg-row.bool{grid-template-columns:200px 1fr}
  .cfg-row.bool input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
  .cfg-row.text{grid-template-columns:200px 1fr}
  .cfg-row.color-row{grid-template-columns:200px auto 1fr}
  .cfg-row.color-row .hex{font-size:13px;color:#9aa1c1}
  .cfg-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
  }
  .cfg-card{
    padding:12px;
    border:1px solid rgba(0,240,255,.2);
    background:rgba(0,0,0,.35);
  }
  .cfg-note{color:#9aa1c1;font-size:14px;line-height:1.2}
  .cfg-button{
    background:rgba(0,240,255,.12);
    color:#00f0ff;
    border:1px solid rgba(0,240,255,.4);
    padding:6px 12px;
    font-family:Consolas,monospace;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.04em;
  }
  .cfg-button:hover{background:rgba(0,240,255,.22)}

  .paint-tool-panel{
    display:grid;
    gap:8px;
    margin:8px 0 12px;
    padding:10px;
    border:1px solid rgba(255,46,136,.35);
    background:rgba(0,0,0,.28);
  }
  .paint-tool-line{
    display:grid;
    grid-template-columns:150px minmax(0,1fr);
    gap:10px;
    align-items:center;
  }
  .paint-tool-label{color:#bbe4ff;font-size:14px}
  .paint-tool-actions,
  .paint-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:center;
  }
  .paint-tool-actions input[type=text],
  .paint-tool-actions select{
    min-width:130px;
    flex:1;
    padding:5px 7px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:15px;
  }
  .paint-tool-btn{
    min-height:28px;
    padding:5px 9px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .paint-tool-btn:hover,
  .paint-tool-btn.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,234,0,.1)}
  .paint-color-swatch{
    position:relative;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid rgba(255,255,255,.5);
    outline:1px solid #000;
    cursor:pointer;
  }
  .paint-color-swatch.active{outline:2px solid var(--yellow);outline-offset:1px}
  .paint-swatch-item{position:relative;display:inline-flex}
  .paint-swatch-remove{
    position:absolute;
    top:-5px;
    right:-5px;
    width:13px;
    height:13px;
    padding:0;
    border:1px solid var(--pink);
    border-radius:50%;
    background:#000;
    color:var(--pink);
    cursor:pointer;
    font:10px/10px Arial,sans-serif;
  }
  .paint-world-count{color:#777d9b;font-size:12px}

  .decor-layer-viewer{
    position:fixed;
    inset:0;
    z-index:60;
    display:grid;
    place-items:center;
    padding:18px;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(4px);
  }
  .decor-layer-viewer-shell{
    width:min(1440px,98vw);
    height:min(900px,96vh);
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr) auto;
    overflow:hidden;
    border:2px solid var(--cyan);
    background:#080014;
    box-shadow:0 0 50px rgba(0,240,255,.32),inset 0 0 0 1px rgba(255,46,136,.25);
  }
  .decor-layer-viewer-head{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
    padding:12px 14px;
    border-bottom:1px solid rgba(0,240,255,.35);
    background:#110026;
  }
  .decor-layer-viewer-head h3{
    min-width:0;
    overflow:hidden;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .decor-layer-viewer-meta{
    margin-left:auto;
    color:#9aa1c1;
    font-size:14px;
    white-space:nowrap;
  }
  .decor-layer-viewer-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    align-items:center;
    padding:9px 12px;
    border-bottom:1px solid rgba(255,46,136,.35);
    background:#0c001d;
  }
  .decor-layer-toolgroup{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .decor-layer-toolgroup>span{
    margin-right:3px;
    color:#9aa1c1;
    font-size:12px;
    text-transform:uppercase;
  }
  .decor-layer-viewer button{
    min-height:30px;
    padding:5px 9px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .decor-layer-viewer button:hover,
  .decor-layer-viewer button.active{
    border-color:var(--yellow);
    color:var(--yellow);
    background:rgba(255,234,0,.1);
  }
  .decor-layer-viewer select{
    max-width:150px;
    min-height:30px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:14px;
  }
  .decor-layer-viewer input[type=color]{
    width:32px;
    height:30px;
    padding:0;
    border:1px solid var(--cyan);
    background:#000;
    cursor:pointer;
  }
  .decor-layer-viewer .paint-color-swatch{
    width:24px;
    height:24px;
    min-height:24px;
    padding:0;
  }
  .decor-paint-readout{min-width:34px;color:var(--yellow);font-size:12px;text-align:center}
  .decor-viewer-palette-swatches{display:flex;gap:4px;align-items:center;max-width:220px;overflow-x:auto;padding:2px}
  .decor-layer-viewer-close{
    width:34px;
    padding:0!important;
    border-color:var(--pink)!important;
    color:var(--pink)!important;
    font-size:15px!important;
  }
  .decor-layer-viewer-viewport{
    position:relative;
    min-height:0;
    overflow:hidden;
    outline:none;
    background-color:#020107;
    background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.055) 1px,transparent 1px);
    background-size:24px 24px;
    cursor:crosshair;
    user-select:none;
  }
  .decor-layer-viewer-viewport[data-mode="move"]{cursor:grab}
  .decor-layer-viewer-viewport.dragging{cursor:grabbing}
  .decor-layer-viewer-canvas{
    position:absolute;
    left:0;
    top:0;
    display:block;
    width:480px;
    height:270px;
    max-width:none;
    border:1px solid rgba(0,240,255,.6);
    outline:1px solid rgba(255,46,136,.25);
    image-rendering:pixelated;
    transform-origin:0 0;
  }
  .decor-layer-viewer-foot{
    display:flex;
    gap:16px;
    align-items:center;
    min-height:38px;
    padding:8px 12px;
    border-top:1px solid rgba(0,240,255,.3);
    background:#0c001d;
    color:#bbe4ff;
    font-size:14px;
  }
  .decor-layer-viewer-foot .shortcuts{margin-left:auto;color:#777d9b;font-size:12px;text-align:right}
  .decor-layer-open{width:100%;margin:0 0 8px;border-color:var(--yellow);color:var(--yellow)}
  .cfg-button-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .decor-layer-controls{margin:4px 0 8px}
  .decor-draw-open{
    width:100%;
    margin:10px 0 6px;
    padding:11px 12px;
    border-color:var(--pink);
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    background:rgba(255,46,136,.14);
  }
  .decor-draw-open:hover{background:rgba(255,46,136,.28)}

  /* ---- MODO DIBUJO (editor de mundo a pantalla completa) ---- */
  .world-editor{padding:8px}
  .world-editor .world-editor-shell{
    width:min(1680px,99vw);
    height:min(1000px,98vh);
    grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  }
  .world-editor-strip{
    overflow-x:auto;
    overflow-y:hidden;
    padding:8px 12px;
    border-bottom:1px solid rgba(0,240,255,.3);
    background:#05000f;
  }
  .world-editor-strip-canvas{
    display:block;
    border:1px solid rgba(0,240,255,.4);
    cursor:pointer;
  }
  .world-editor-main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 350px;
    min-height:0;
  }
  .world-editor-side{
    min-height:0;
    overflow-y:auto;
    padding:8px 10px 14px;
    border-left:1px solid rgba(255,46,136,.35);
    background:#0a0018;
    color:#dcdcff;
    font-size:15px;
  }
  .world-editor-side-title{
    margin:10px 0 6px;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:8px;
    letter-spacing:.5px;
  }
  .world-editor-layer-list{display:grid;gap:3px}
  .world-editor-layer{
    display:grid;
    grid-template-columns:18px minmax(0,1fr) auto auto;
    gap:5px;
    align-items:center;
    padding:3px 5px;
    border:1px solid rgba(0,240,255,.18);
    background:rgba(0,0,0,.35);
    color:#bbe4ff;
    cursor:pointer;
    font-size:15px;
  }
  .world-editor-layer:hover{border-color:rgba(0,240,255,.5)}
  .world-editor-layer.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,234,0,.08)}
  .world-editor-layer.off .world-editor-layer-name{opacity:.45;text-decoration:line-through}
  .world-editor-layer input[type=checkbox]{width:14px;height:14px;accent-color:var(--pink)}
  .world-editor-layer-dot{text-align:center;color:var(--cyan)}
  .world-editor-layer-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .world-editor-layer .zone-tag{color:#ffb347;font-size:13px}
  .world-editor button.world-editor-mini{min-height:22px;padding:3px 6px;font-size:7px}
  .world-editor-add{display:flex;gap:6px;align-items:center;margin:8px 0 4px}
  .world-editor-add select{flex:1;max-width:none}
  .world-editor-actions{margin:4px 0 8px}
  .world-editor-sky-row{
    display:grid;
    grid-template-columns:70px 36px minmax(0,1fr) auto;
    gap:6px;
    align-items:center;
    padding:3px 0;
  }
  .world-editor-sky-row label{color:#bbe4ff;font-size:13px}
  .world-editor-sky-row input[type=range]{width:100%;accent-color:var(--pink)}
  .world-editor-side .cfg-row{grid-template-columns:120px minmax(0,1fr) 42px;gap:6px;padding:3px 0}
  .world-editor-side .cfg-row.bool,
  .world-editor-side .cfg-row.text{grid-template-columns:120px minmax(0,1fr)}
  .world-editor-side .cfg-row.color-row{grid-template-columns:120px auto minmax(0,1fr)}
  .world-editor-side .cfg-row label{font-size:13px}
  .world-editor-side .cfg-row .val{font-size:12px}
  .world-editor-side .cfg-row select{max-width:none}
  .world-editor-transport{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    align-items:center;
    padding:8px 12px;
    border-top:1px solid rgba(0,240,255,.3);
    background:#0c001d;
  }
  .world-editor-transport input[type=range]{flex:1;min-width:180px;accent-color:var(--pink)}
  .world-editor-readout{min-width:260px;color:var(--yellow);font-size:15px}
  @media (max-width:980px){
    .world-editor-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,42%)}
    .world-editor-side{border-left:none;border-top:1px solid rgba(255,46,136,.35)}
  }

  .midi-devices{display:grid;gap:6px;margin-bottom:18px}
  .midi-dev{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border:1px solid rgba(0,240,255,.2);
    background:rgba(0,0,0,.35);
  }
  .midi-dev input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
  .midi-dev .name{flex:1;font-size:15px}
  .midi-dev .dot{width:8px;height:8px;border-radius:50%;background:#444}
  .midi-dev.active .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .midi-mappings{display:grid;gap:4px;margin-top:14px}
  .midi-map-row{
    display:grid;
    grid-template-columns:1fr 70px 60px 70px 60px 80px 60px;
    gap:5px;
    align-items:center;
    padding:5px 8px;
    background:rgba(0,0,0,.25);
    font-size:14px;
  }
  .midi-map-row .ev{color:#bbe4ff}
  .midi-map-row .key-input{
    text-transform:uppercase;
    text-align:center;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    padding:4px 2px;
  }
  .midi-map-row button.key-learn{
    border-color:var(--cyan);
    color:var(--cyan);
  }
  .midi-map-row button.key-learn:hover{background:var(--cyan);color:#000}
  .midi-map-row button.key-learn.listening{background:var(--cyan);border-color:var(--cyan);color:#000;animation:pulse 1s infinite}
  .midi-map-row button{
    padding:3px 6px;
    border:1px solid var(--yellow);
    background:#000;
    color:var(--yellow);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .midi-map-row button:hover{background:var(--yellow);color:#000}
  .midi-map-row button.listening{background:var(--pink);border-color:var(--pink);color:#000;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .preset-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .preset-card{
    padding:14px;
    border:1px solid var(--cyan);
    background:rgba(0,0,0,.4);
    cursor:pointer;
    transition:all .15s;
  }
  .preset-card:hover{
    transform:translate(-2px,-2px);
    border-color:var(--pink);
    background:rgba(255,46,136,.15);
    box-shadow:3px 3px 0 var(--pink);
  }
  .preset-card h4{
    margin-bottom:6px;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
  }
  .preset-card p{color:#bbe4ff;font-size:14px;line-height:1.2}

  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:50;
    padding:10px 18px;
    border:1px solid var(--green);
    background:#000;
    color:var(--green);
    box-shadow:0 0 20px rgba(0,255,127,.45);
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    opacity:0;
    transition:opacity .2s;
  }
  .toast.show{opacity:1}

  /* ---- Overrides de la pagina dedicada ---- */
  #config-box{width:min(1240px,98vw);height:min(920px,96vh)}
  #midi-status{margin-left:16px;font-size:14px;color:#9aa1c1;border:1px solid rgba(0,240,255,.3);padding:3px 8px}
  #midi-status.on{color:var(--green);border-color:var(--green)}
  .sync-note{margin-right:auto;align-self:center;color:#9aa1c1;font-size:13px}

// Categorias para agrupar el selector "Nueva capa" del editor.
const DECOR_CATEGORIES = [
  { id:'cielo', label:'CIELO' },
  { id:'naturaleza', label:'NATURALEZA' },
  { id:'lugares', label:'LUGARES' },
  { id:'ciudad', label:'CIUDAD' },
  { id:'espacio', label:'ESPACIO' },
  { id:'efectos', label:'EFECTOS / CLIMA' },
  { id:'suelo', label:'SUELO' }
];
function decorTypeOptions(){
  const options = [];
  DECOR_CATEGORIES.forEach(cat => {
    Object.keys(DECOR_TYPES).forEach(type => {
      if((DECOR_TYPES[type].cat || 'efectos') === cat.id){
        options.push({ value:type, label:DECOR_TYPES[type].label, group:cat.label });
      }
    });
  });
  return options;
}

function makeDecorLayer(type){
  const def = DECOR_TYPES[type];
  if(!def) return null;
  return deepClone(Object.assign({ type, on:true }, def.defaults));
}
// Capa con overrides (los colores se mezclan con los del tipo, no se pisan).
function decorLayer(type, overrides = {}){
  const layer = makeDecorLayer(type);
  if(!layer) return null;
  const extra = deepClone(overrides);
  const colors = Object.assign({}, layer.colors, extra.colors || {});
  return Object.assign(layer, extra, { colors });
}

// Tipos de enemigo de un nivel: clasicos + monstruos del mundo segun la hora.
function worldLevelRoster(bg, levelIdx){
  const beasts = worldBestiary(bg);
  const roster = ['small', 'big', 'thrower'];
  if(beasts && levelIdx >= 1 && beasts.tarde) roster.push(beasts.tarde);
  if(beasts && levelIdx >= 2 && beasts.noche) roster.push(beasts.noche);
  return roster;
}
// 3 oleadas por nivel. La mañana es la clasica; la tarde presenta al monstruo
// del mundo y la noche suma al segundo y mezcla todo.
function defaultLevelWaves(bg, levelIdx, length){
  const len = Math.max(300, Number(length) || 1200);
  const xs = [0.2, 0.52, 0.84].map(t => Math.round(len * t));
  const beasts = worldBestiary(bg) || {};
  const a = beasts.tarde;
  const b = beasts.noche;
  let recipe;
  if(levelIdx <= 0){
    recipe = [ [['small', 3]], [['small', 2], ['thrower', 1]], [['big', 1], ['small', 2]] ];
  } else if(levelIdx === 1){
    recipe = a
      ? [ [['small', 2], [a, 1]], [[a, 2], ['thrower', 1]], [['big', 1], [a, 2]] ]
      : [ [['small', 3], ['thrower', 1]], [['big', 1], ['small', 2]], [['big', 1], ['thrower', 2]] ];
  } else {
    recipe = a && b
      ? [ [[a, 2], ['small', 2]], [[b, 2], ['thrower', 1]], [[b, 1], [a, 1], ['big', 1]] ]

}
function defaultStageLevel(stage, levelIdx){
  const bg = stage && stage.bg ? stage.bg : 'desert';
  const time = LEVEL_TIMES[clamp(levelIdx, 0, 2)];
  const names = WORLD_LEVEL_NAMES[bg] || WORLD_LEVEL_NAMES.blank;
  return Object.assign({
    time,
    name:names[levelIdx] || LEVEL_TIME_LABELS[time],
    tone:1,
    waves:defaultLevelWaves(bg, levelIdx, stage && stage.length)
  }, deepClone(LEVEL_TIME_SCALE[time]));
}
// Sanea EN SITIO (los editores del panel guardan referencias a cada oleada y
// a cada nivel: reemplazar los objetos haria que el siguiente cambio se pierda).
function sanitizeLevelWavesInPlace(list){
  for(let i = list.length - 1; i >= 0; i--){
    if(!isObject(list[i])) list.splice(i, 1);
  }
  if(list.length > 12) list.length = 12;
  list.forEach(wave => {
    wave.x = Math.max(0, Math.round(Number(wave.x) || 0));
    if(!Array.isArray(wave.enemies)) wave.enemies = [];
    for(let k = wave.enemies.length - 1; k >= 0; k--){
      const entry = wave.enemies[k];
      if(!Array.isArray(entry) || typeof entry[0] !== 'string' || !CONFIG.enemies[entry[0]]) wave.enemies.splice(k, 1);
      else entry[1] = clamp(Math.round(Number(entry[1]) || 0), 0, 12);
    }
    if(wave.enemies.length > 8) wave.enemies.length = 8;
  });
}
// Garantiza exactamente 3 niveles validos. Los que falten se generan desde el
// mundo (bg); un config viejo sin levels recibe los 3 completos.
function sanitizeStageLevels(stage){
  if(!stage) return;
  if(!Array.isArray(stage.levels)) stage.levels = [];
  const levels = stage.levels;
  if(levels.length > 3) levels.length = 3;
  for(let idx = 0; idx < 3; idx++){
    const level = levels[idx];
    if(!isObject(level)){
      levels[idx] = defaultStageLevel(stage, idx);
      continue;
    }
    const fallbackTime = LEVEL_TIMES[idx];
    if(!LEVEL_TIMES.includes(level.time)) level.time = fallbackTime;
    const scale = LEVEL_TIME_SCALE[level.time];
    const names = WORLD_LEVEL_NAMES[stage.bg] || WORLD_LEVEL_NAMES.blank;
    level.name = String(level.name ?? '').trim().slice(0, 28) || names[idx] || LEVEL_TIME_LABELS[level.time];
    const tone = Number(level.tone);
    level.tone = clamp(Number.isFinite(tone) ? tone : 1, 0, 1.5);
    const hp = Number(level.hpMul);
    const atk = Number(level.atkMul);
    const spd = Number(level.spdMul);
    level.hpMul = clamp(Number.isFinite(hp) && hp > 0 ? hp : scale.hpMul, 0.25, 4);
    level.atkMul = clamp(Number.isFinite(atk) && atk > 0 ? atk : scale.atkMul, 0.25, 4);
    level.spdMul = clamp(Number.isFinite(spd) && spd > 0 ? spd : scale.spdMul, 0.5, 2);
    if(Array.isArray(level.waves)) sanitizeLevelWavesInPlace(level.waves);
    else level.waves = defaultLevelWaves(stage.bg, idx, stage.length);
    if(Array.isArray(level.sky) && level.sky.length){
      if(level.sky.length > 6) level.sky.length = 6;
      level.sky.forEach((stop, k) => {
        if(!isObject(stop)){ level.sky[k] = { p:0, c:'#000000' }; return; }
        stop.p = clamp(Number(stop.p) || 0, 0, 1);
        stop.c = safeHexColor(stop.c, '#000000');
      });
    } else {
      delete level.sky;
    }
  }
}
// ---- Gradacion de color por momento del dia ----
// Claves de color que emiten luz propia: no se oscurecen de noche.
const DECOR_EMISSIVE = {
  sun:['core', 'lines'], moon:['core'], stars:['a', 'b', 'c'], shooting_stars:['head', 'tail'],
  towers:['win1', 'win2', 'win3'], houses:['knob', 'win1', 'win2', 'win3'], streetlights:['bulb'],
  skyscrapers:['beacon', 'win1', 'win2', 'win3'], billboards:['c1', 'c2', 'c3', 'c4', 'c5'],
  neon:['stripeNeon', 'stripeMid', 'doorGlow', 'win1', 'win2', 'win3'], ground_neon:['line', 'dashA'],
  fireflies:['a', 'b'], ruins:['glow'], cabins:['window'], rockets:['window', 'flame'],
  station:['window', 'light'], domes:['glow'], antennas:['beacon'], pipes:['glow'], ground_metal:['light']
};
function hexToRgb(hex){
  const clean = safeHexColor(hex, '#000000').replace('#', '');
  const full = clean.length <= 4 ? clean.slice(0, 3).split('').map(ch => ch + ch).join('') : clean.slice(0, 6);
  const value = parseInt(full, 16) || 0;
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}
// sky: paradas del cielo del momento; la bruma de las capas lejanas toma el
// color del cielo cerca del horizonte (perspectiva aerea).
function makeTimeGrade(spec, tone = 1, sky = null){
  if(!spec || tone <= 0) return null;
  const strength = clamp(tone, 0, 1.5);
  let hazeColor = spec.tint || '#000000';
  if(Array.isArray(sky) && sky.length){
    let best = sky[0];
    for(const stop of sky) if(Math.abs((Number(stop.p) || 0) - 0.8) < Math.abs((Number(best.p) || 0) - 0.8)) best = stop;
    hazeColor = safeHexColor(best && best.c, hazeColor);
  }
  const haze = clamp(Number(spec.haze) || 0, 0, 1);
  return {
    mul:hexToRgb(spec.mul || '#ffffff').map(v => v / 255),
    tint:hexToRgb(spec.tint || '#000000'),
    mix:clamp(Number(spec.mix) || 0, 0, 1),
    ground:clamp(Number(spec.ground ?? 1), 0, 1),
    haze,
    hazeRgb:hexToRgb(hazeColor),
    strength,
    key:`${spec.mul}|${spec.tint}|${spec.mix}|${spec.ground}|${haze}|${hazeColor}|${strength}`
  };
}
const GRADE_HEX_CACHE = new Map();
// far (0..1): cuan lejana es la capa; suma bruma hacia el horizonte.
function gradeHexColor(hex, grade, factor = 1, far = 0){
  if(!grade) return hex;
  const cacheKey = `${hex}|${grade.key}|${factor}|${far}`;
  let out = GRADE_HEX_CACHE.get(cacheKey);
  if(out) return out;
  const k = clamp(grade.strength * factor, 0, 1.5);
  const rgb = hexToRgb(hex);
  const mix = clamp(grade.mix * k, 0, 1);
  const hazeMix = clamp((grade.haze || 0) * far * Math.min(1, grade.strength), 0, 0.85);
  const channels = rgb.map((value, idx) => {
    const mul = 1 + (grade.mul[idx] - 1) * k;
    const graded = value * mul * (1 - mix) + grade.tint[idx] * mix;
    return clamp(Math.round(graded * (1 - hazeMix) + grade.hazeRgb[idx] * hazeMix), 0, 255);
  });
  out = `#${channels.map(v => v.toString(16).padStart(2, '0')).join('')}`;
  if(GRADE_HEX_CACHE.size > 4000) GRADE_HEX_CACHE.clear();
  GRADE_HEX_CACHE.set(cacheKey, out);
  return out;
}
const DECOR_GRADE_CACHE = new Map();
function gradeDecorColors(type, colors, grade, far = 0){
  let key = `${type}|${grade.key}|${far}`;
  for(const name in colors) key += `|${colors[name]}`;
  let out = DECOR_GRADE_CACHE.get(key);
  if(out) return out;
  out = {};
  const emissive = DECOR_EMISSIVE[type] || [];
  const def = DECOR_TYPES[type];
  const factor = def && def.ground ? grade.ground : 1;
  for(const name in colors){
    out[name] = emissive.includes(name) ? colors[name] : gradeHexColor(colors[name], grade, factor, far);
  }
  if(DECOR_GRADE_CACHE.size > 800) DECOR_GRADE_CACHE.clear();
  DECOR_GRADE_CACHE.set(key, out);
  return out;
}
// Look resuelto de un momento para un mundo (sin los ajustes del nivel).
// Las capas extra se sanean una vez y se reutilizan.
const WORLD_LOOK_CACHE = new Map();
function worldTimeLook(bg, time){
  const cacheKey = `${bg}|${time}`;
  if(WORLD_LOOK_CACHE.has(cacheKey)) return WORLD_LOOK_CACHE.get(cacheKey);
  const world = WORLD_TIME_LOOKS[bg] || WORLD_TIME_LOOKS.blank;
  let look = null;
  if(time !== world.base && TIME_LOOK_PRESETS[time]){
    const spec = Object.assign({}, TIME_LOOK_PRESETS[time], world[time] || {});
    const extras = (spec.extras || []).map(([type, overrides]) => decorLayer(type, overrides)).filter(Boolean);
    const holder = { bg, scenery:{ sky:spec.sky, layers:extras } };
    sanitizeStageScenery(holder);
    look = {
      sky:spec.sky,
      gradeSpec:spec.grade || null,
      hide:new Set(spec.hide || []),
      tweaks:spec.tweaks || {},
      extras:holder.scenery.layers
    };
  }
  WORLD_LOOK_CACHE.set(cacheKey, look);
  return look;
}
// Look final de un nivel: momento del mundo + tono y cielo propios del nivel.
// null = escena base tal cual se pinto (sin costo extra de render).
const LEVEL_LOOK_CACHE = new Map();
function stageLevelLook(stage, levelIdx){
  if(!stage || !Number.isInteger(levelIdx) || levelIdx < 0) return null;
  const level = Array.isArray(stage.levels) ? stage.levels[clamp(levelIdx, 0, 2)] : null;
  if(!level) return null;
  const bg = stage.bg || 'desert';
  const base = worldTimeLook(bg, level.time);
  const tone = clamp(Number(level.tone ?? 1), 0, 1.5);
  let skySig = '';
  if(Array.isArray(level.sky)) for(const stop of level.sky) skySig += `${stop.p}${stop.c}`;
  if(!base && !skySig) return null;
  const cacheKey = `${bg}|${level.time}|${tone}|${skySig}`;
  let look = LEVEL_LOOK_CACHE.get(cacheKey);
  if(look) return look;
  look = {
    sky:skySig ? level.sky : (base ? base.sky : null),
    grade:base ? makeTimeGrade(base.gradeSpec, tone, skySig ? level.sky : base.sky) : null,
    hide:base ? base.hide : new Set(),
    tweaks:base ? base.tweaks : {},
    extras:base ? base.extras : []
  };
  if(LEVEL_LOOK_CACHE.size > 200) LEVEL_LOOK_CACHE.clear();
  LEVEL_LOOK_CACHE.set(cacheKey, look);
  return look;
}
// Copia de la capa con los ajustes y colores del momento (la capa original no
// se toca; la clave de la cache de sprites incluye los colores ya graduados).
function lookDecorLayer(layer, look){
  const tweak = look.tweaks[layer.type];
  if(!look.grade && !tweak) return layer;
  const copy = Object.assign({}, layer, tweak || {});
  const baseColors = tweak && tweak.colors ? Object.assign({}, layer.colors, tweak.colors) : layer.colors;
  copy.colors = look.grade ? gradeDecorColors(layer.type, baseColors || {}, look.grade, decorLayerFarness(layer)) : baseColors;
  copy.gradeRef = look.grade;
  copy.gradeFar = decorLayerFarness(layer);
  return copy;
}
// 0 = capa cercana, 1 = muy lejana (parallax bajo). Redondeado para la cache.
function decorLayerFarness(layer){
  const def = DECOR_TYPES[layer && layer.type];
  if(!def || !def.scroll || def.ground) return 0;
  const px = Number.isFinite(Number(layer.px)) ? Number(layer.px) : 0.5;
  return Math.round(clamp((0.4 - px) / 0.4, 0, 1) * 10) / 10;
}

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function isObject(value){ return value && typeof value === 'object' && !Array.isArray(value); }
function deepMerge(base, patch){
  if(Array.isArray(base) && Array.isArray(patch)){
    return patch.map((item, index) => {
      if(index < base.length) return deepMerge(base[index], item);
      return deepClone(item);
    });
  }
  if(isObject(base) && isObject(patch)){
    const out = deepClone(base);
    Object.keys(patch).forEach(key => {
      if(key in out) out[key] = deepMerge(out[key], patch[key]);
      else out[key] = deepClone(patch[key]);
    });
    return out;
  }
  return deepClone(patch);
}
function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function sign(value){ return value < 0 ? -1 : value > 0 ? 1 : 0; }
function rand(min, max){ return min + Math.random() * (max - min); }
function dist(ax, az, bx, bz){ return Math.hypot(ax - bx, az - bz); }

let CONFIG = deepClone(DEFAULT_CONFIG);

// ============================================================
// PERSISTENCIA DE CONFIG
// El juego se abre normalmente como archivo local (file://), donde fetch()
// suele estar bloqueado. Para que el tuneo del show sobreviva a un refresh
// usamos localStorage como almacen principal. Si ademas se sirve por HTTP,
// se intenta sembrar desde ./MECHAKATZ.json la primera vez (ver abajo).
// ============================================================
const CONFIG_STORAGE_KEY = 'mechakatz_config_v9';
let configPersistReady = false; // evita guardar durante el arranque inicial
// Ultimo JSON crudo escrito/aplicado por ESTA ventana. Sirve para que la
// sincronizacion con el editor externo (mechakatz_config.html) distinga
// escrituras propias de las ajenas y no re-aplique en bucle.
let lastSyncedConfigRaw = '';
function saveConfigToStorage(){
  if(!configPersistReady) return;
  try {
    const raw = JSON.stringify(CONFIG);
    localStorage.setItem(CONFIG_STORAGE_KEY, raw);
    lastSyncedConfigRaw = raw;
  }
  catch(error){ /* sin localStorage o cuota llena: ignorar */ }
}
// deepMerge conserva los valores guardados y el largo de los arreglos, asi que
// los cambios de fabrica que deben llegar a un show ya tuneado se aplican aqui,
// una vez, segun la revision con la que se guardo (saved.tuningRev).
function migrateSavedConfig(config, saved){
  const rev = saved && Number.isFinite(Number(saved.tuningRev)) ? Number(saved.tuningRev) : 0;
  if(rev < 1){
    // Rev 1: mechas, enemigos +0.3 de tamaño; mechas 20% mas veloces; los 8
    // gatos nuevos se suman a una lista guardada de personajes mas corta.
    const general = saved && isObject(saved.general) ? saved.general : {};
    ['playerSizeMul', 'enemySizeMul'].forEach(key => {
      if(Number.isFinite(Number(general[key]))) config.general[key] = Number(general[key]) + 0.3;
    });
    const physics = saved && isObject(saved.physics) ? saved.physics : {};
    if(Number.isFinite(Number(physics.moveSpeedMul))) config.physics.moveSpeedMul = Number(physics.moveSpeedMul) * 1.2;
    if(Array.isArray(config.players)){
      for(let i = config.players.length; i < DEFAULT_CONFIG.players.length; i++){
        config.players.push(deepClone(DEFAULT_CONFIG.players[i]));
      }
    }
  }
  config.tuningRev = DEFAULT_CONFIG.tuningRev;
  return config;
}
// Toda config que viene de afuera (localStorage, JSON, editor) entra por aqui.
function configFromSaved(saved){
  return migrateSavedConfig(deepMerge(DEFAULT_CONFIG, saved), saved);
}
function loadConfigFromStorage(){
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if(!raw) return false;
    CONFIG = configFromSaved(JSON.parse(raw));
    lastSyncedConfigRaw = raw;
    return true;
  } catch(error){ return false; }
}
// Aplica en caliente una config escrita por otra ventana (el editor dedicado).
// No re-guarda (configPersistReady off durante el apply) para no provocar un
// eco de eventos storage entre ventanas.
function applyExternalConfigRaw(raw){
  if(!raw || raw === lastSyncedConfigRaw) return;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(error){ return; }
  lastSyncedConfigRaw = raw;
  CONFIG = configFromSaved(parsed);
  const persistWas = configPersistReady;
  configPersistReady = false;
  applyConfigToLiveGame();
  configPersistReady = persistWas;
  if(isConfigOpen()){
    renderConfigTabs();
    refreshConfigContent();
  }
  showToast('Config actualizada desde el editor');
}

function normalizeRunName(value){
  return String(value ?? '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 15)
    .toUpperCase() || 'PARTIDA';
}
function normalizeHotkeyName(value){
  const original = String(value ?? '');
  if(original === ' ') return 'space';
  const raw = original.trim().toLowerCase();
  if(!raw) return '';
  if(raw === 'spacebar' || raw === 'space') return 'space';
  return raw.slice(0, 16);
}
function normalizeScoreEntry(entry){
  const safe = entry && typeof entry === 'object' ? entry : {};
  const players = Array.isArray(safe.players) ? safe.players : [];
  return {
    name: normalizeRunName(safe.name),
    total: Math.max(0, Math.round(Number(safe.total) || 0)),
    result: safe.result === 'victory' ? 'victory' : 'gameover',
    stage: clamp(Math.round(Number(safe.stage) || 1), 1, Math.max(3, CONFIG.stages ? CONFIG.stages.length : 3)),
    players: players.slice(0, MAX_PLAYERS).map(player => ({
      slot: String(player.slot || '').slice(0, 4) || 'P?',
      pilot: String(player.pilot || 'MECHA').slice(0, 16),
      score: Math.max(0, Math.round(Number(player.score) || 0))
    })),
    ts: typeof safe.ts === 'string' ? safe.ts : new Date().toISOString()
  };
}
function sanitizeScoreboardConfig(){
  if(!CONFIG.scoreboard || typeof CONFIG.scoreboard !== 'object'){
    CONFIG.scoreboard = deepClone(DEFAULT_CONFIG.scoreboard);
  }
  CONFIG.scoreboard.currentRunName = normalizeRunName(CONFIG.scoreboard.currentRunName);
  const sourceEntries = Array.isArray(CONFIG.scoreboard.entries) ? CONFIG.scoreboard.entries : [];
  CONFIG.scoreboard.entries = sourceEntries
    .map(normalizeScoreEntry)
    .sort((a, b) => b.total - a.total || String(b.ts).localeCompare(String(a.ts)))
    .slice(0, MAX_SCORE_ENTRIES);
}

function runStageCount(){
  if(game.stageOrder && game.stageOrder.length) return game.stageOrder.length;
  return CONFIG.stages.length;
}
function poolStageIndex(runIdx = game.stage){
  const poolLen = Math.max(1, CONFIG.stages.length);
  if(game.stageOrder && game.stageOrder.length){
    const pos = clamp(runIdx, 0, game.stageOrder.length - 1);
    return clamp(Math.round(game.stageOrder[pos] ?? 0), 0, poolLen - 1);
  }
  // Titulo y seleccion: el fondo es un mundo al azar del pool, elegido una
  // vez por pantalla de titulo (createGame lo resetea al volver al titulo).
  if(game.state === 'title' || game.state === 'select') return titleStageIndex();
  return clamp(runIdx, 0, poolLen - 1);
}
// Niveles que entran en las partidas al azar (stage.rotation !== false). Si
// todos quedaron fuera, se usa el pool completo para no dejar la partida vacia.
function rotationStageIndices(){
  const all = CONFIG.stages.map((stage, idx) => idx);
  const eligible = all.filter(idx => CONFIG.stages[idx] && CONFIG.stages[idx].rotation !== false);
  return eligible.length ? eligible : all;
}
function shuffledCopy(list){
  const copy = list.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
// Se elige de forma perezosa (la primera vez que se dibuja el titulo), asi
// ya cuenta con la config guardada y los mundos sembrados al arrancar; si el
// pool cambia mientras se esta en el titulo, se vuelve a sortear.
function titleStageIndex(){
  const poolLen = Math.max(1, CONFIG.stages.length);
  if(!Number.isInteger(game.titleStage) || game.titleStage >= poolLen || game.titlePoolLen !== CONFIG.stages.length){
    const options = rotationStageIndices();
    game.titleStage = options.length ? options[Math.floor(Math.random() * options.length)] : 0;
    game.titlePoolLen = CONFIG.stages.length;
  }
  return clamp(game.titleStage, 0, poolLen - 1);
}
// Momento del dia del fondo del titulo: tambien al azar (mañana/tarde/noche).
function titleLevelIndex(){
  if(!Number.isInteger(game.titleLevel)) game.titleLevel = Math.floor(Math.random() * 3);
  return clamp(game.titleLevel, 0, 2);
}
// Nivel (0..2) del mundo que se esta jugando: coincide con la posicion en la
// partida. En titulo/seleccion es el momento sorteado para el fondo.
function runLevelIndex(){
  if(game.stageOrder && game.stageOrder.length) return clamp(Math.round(game.stage) || 0, 0, 2);
  if(game.state === 'title' || game.state === 'select') return titleLevelIndex();
  return clamp(Math.round(game.stage) || 0, 0, 2);
}
function stageLevelAt(stage, levelIdx){
  return stage && Array.isArray(stage.levels) ? stage.levels[clamp(levelIdx, 0, 2)] || null : null;
}
function currentStageLevel(){
  return stageLevelAt(CONFIG.stages[poolStageIndex()], runLevelIndex());
}
// Nivel que se dibuja: la vista previa del editor elige uno (-1 = escena base).
function renderLevelIndex(){
  if(decorPreviewStage){
    const level = Math.round(Number(DECOR_PREVIEW_OPTS.level));
    return Number.isFinite(level) ? clamp(level, -1, 2) : -1;
  }
  return runLevelIndex();
}
let lastStageGroupIdx = -1;
let lastRandomRunKey = '';
let lastWorldRunIdx = -1;
// Elige los 3 niveles de la partida. Modo 'pool' (por defecto): 3 mundos
// distintos al azar entre los que estan en rotacion. Modo 'sets': un set al
// azar de CONFIG.stageGroups.groups. forcedGroup >= 0 fuerza un set (ensayo).
// En todos los casos el jefe aparece en el 3er nivel.
function pickStageGroup(){
  const sg = CONFIG.stageGroups || {};
  const groups = Array.isArray(sg.groups) && sg.groups.length
    ? sg.groups
    : [{ name:'SET A', stages:[0,1,2] }];
  const forced = Math.round(sg.forcedGroup ?? -1);
  const poolLen = Math.max(1, CONFIG.stages.length);
  if(!(forced >= 0 && forced < groups.length) && sg.mode === 'world'){
    // Un mundo completo: sus 3 niveles en orden (mañana, tarde y noche + jefe).
    const eligible = rotationStageIndices();
    let pick = eligible[Math.floor(Math.random() * eligible.length)] ?? 0;
    if(eligible.length > 1 && pick === lastWorldRunIdx){
      const others = eligible.filter(idx => idx !== lastWorldRunIdx);
      pick = others[Math.floor(Math.random() * others.length)];
    }
    lastWorldRunIdx = pick;
    const idx = clamp(pick, 0, poolLen - 1);
    return { name:'MUNDO COMPLETO', order:[idx, idx, idx], mode:'world' };
  }
  if(!(forced >= 0 && forced < groups.length) && sg.mode !== 'sets'){
    const eligible = rotationStageIndices();
    let order = shuffledCopy(eligible).slice(0, 3);
    // Con pocos mundos se completan los 3 niveles repitiendo alguno.
    while(order.length < 3) order.push(eligible[Math.floor(Math.random() * eligible.length)] ?? 0);
    // Evitar repetir exactamente la misma partida dos veces seguidas.
    if(eligible.length > 3 && order.join(',') === lastRandomRunKey){
      order = shuffledCopy(eligible).slice(0, 3);
    }
    lastRandomRunKey = order.join(',');
    return { name:'AL AZAR', order:order.map(idx => clamp(idx, 0, poolLen - 1)), mode:'pool' };
  }
  let idx;
  if(forced >= 0 && forced < groups.length){
    idx = forced;
  } else {
    idx = Math.floor(Math.random() * groups.length);
    // Con 2+ grupos, evitar repetir el mismo set dos partidas seguidas
    if(groups.length > 1 && idx === lastStageGroupIdx){
      idx = (idx + 1 + Math.floor(Math.random() * (groups.length - 1))) % groups.length;
    }
  }
  lastStageGroupIdx = idx;
  const group = groups[idx];
  const stages = Array.isArray(group.stages) ? group.stages : [0,1,2];
  const order = [0,1,2].map(k => clamp(Math.round(Number(stages[k]) || 0), 0, poolLen - 1));
  return { name: String(group.name || `SET ${idx + 1}`), order, mode:'sets' };
}
// Tag visible del nivel. En partidas al azar el orden cambia, asi que el
// "STAGE n" guardado en cada nivel se reescribe con la posicion real y el
// 3er nivel se marca FINAL (ahi espera el jefe). En modo sets se respeta el tag.
function runStageTag(){
  const stage = stageCfg();
  const raw = String(stage && stage.tag || '');
  const level = game.stageOrder ? currentStageLevel() : null;
  const timeLabel = level ? ` - ${LEVEL_TIME_LABELS[level.time] || ''}` : '';
  if((game.runMode !== 'pool' && game.runMode !== 'world') || !game.stageOrder) return `${raw}${timeLabel}`.slice(0, 44);
  let rest = raw.replace(/^\s*STAGE\s*\d+\s*[-:]?\s*/i, '').replace(/\s*[-:]?\s*FINAL\s*$/i, '').trim();
  if(!rest || /^FINAL$/i.test(rest)) rest = String(stage.name || '').trim();
  const isFinal = game.stage === runStageCount() - 1;
  return `STAGE ${game.stage + 1}${isFinal ? ' FINAL' : ''} - ${rest}${timeLabel}`.slice(0, 44);
}

// Las oleadas viven dentro de cada nivel del mundo (stage.levels[n].waves):
// el mundo que cae en la posicion N de la partida juega las oleadas de su
// nivel N. stageWaves() es la unica via de acceso; stage.waves queda como
// respaldo legado para un nivel sin levels. El indice recibido es la
// posicion de la partida (0..2) y se resuelve al mundo real del pool.
function stageWaves(stageIndex = game.stage){
  const stage = CONFIG.stages[poolStageIndex(stageIndex)];
  if(!stage) return [];
  const level = stageLevelAt(stage, clamp(Math.round(stageIndex) || 0, 0, 2));
  if(level && Array.isArray(level.waves)) return level.waves;
  return Array.isArray(stage.waves) ? stage.waves : [];
}

let decorPreviewStage = null;
function stageCfg(){
  if(decorPreviewStage) return decorPreviewStage;
  return CONFIG.stages[poolStageIndex()];
}
// Recorrido efectivo del stage: stage.length escalado por el multiplicador
// general. Las posiciones wave.x se escalan igual (waveTriggerX), asi las
// oleadas conservan su reparto relativo a lo largo del recorrido y el clamp
// anti-softlock (que compara wave.x contra stage.length en crudo) sigue valido.
function stageRunLength(){
  return Math.round(stageCfg().length * (CONFIG.general.stageLengthMul ?? 1));
}
function waveTriggerX(wave){
  return wave.x * (CONFIG.general.stageLengthMul ?? 1);
}
function laneMinZ(){
  const stage = stageCfg();
  return clamp(stage.laneMinZ ?? 8, LANE_EDIT_MIN, LANE_EDIT_MAX - LANE_MIN_SPAN);
}
function laneMaxZ(){
  const stage = stageCfg();
  return clamp(stage.laneMaxZ ?? 56, laneMinZ() + LANE_MIN_SPAN, LANE_EDIT_MAX);
}
function playerScaleForChar(char){
  return clamp(char && Number.isFinite(char.sizeScale) ? char.sizeScale : 1, PLAYER_SCALE_MIN, PLAYER_SCALE_MAX);
}
function applyPlayerSize(player){
  if(!player || !player.char) return;
  player.scale = playerScaleForChar(player.char);
  player.width = PLAYER_BASE_WIDTH * player.scale;
  player.height = PLAYER_BASE_HEIGHT * player.scale;
}
// Tamaño en pantalla (CONFIG.general.playerSizeMul / enemySizeMul): width y
// height de mechas y enemigos siguen en unidades del sprite a 1x (los
// dibujantes las usan); las pruebas de golpe pasan por bodyHalfWidth y
// bodyHeight, que las escalan igual que el dibujo.
function playerSizeMul(){
  return CONFIG.general.playerSizeMul || 1;
}
function enemySizeMul(){
  return CONFIG.general.enemySizeMul || 1;
}
// Los jefes escalan su dibujo y sus distancias de contacto (golpes, embestida,
// proyectiles contra su cuerpo); las areas de ataque (rayo, pisoton, ondas)
// son del escenario y conservan su medida.
function bossSizeMul(){
  return CONFIG.general.bossSizeMul || 1;
}
function entitySizeMul(entity){
  if(!entity) return 1;
  if(entity.type === 'player') return playerSizeMul();
  if(entity.type === 'enemy') return enemySizeMul();
  return 1;
}
function bodyHalfWidth(entity){
  return entity.width * 0.5 * entitySizeMul(entity);
}
function bodyHeight(entity){
  return entity.height * entitySizeMul(entity);
}
// Alcance cuerpo a cuerpo del enemigo: crece con su tamaño para que no se
// encime al mecha; los de distancia conservan su rango.
function enemyMeleeReach(enemy){
  return enemy.ranged ? enemy.atkRange : enemy.atkRange * enemySizeMul();
}
// Donde sostiene un mecha lo que carga (delante y a la altura del pecho).
function carryOffset(){
  return Math.round(12 * playerSizeMul());
}
function carryLift(){
  return Math.round(18 * playerSizeMul());
}
function laneMidZ(){
  return (laneMinZ() + laneMaxZ()) * 0.5;
}
function groundY(){
  return Math.round(H * (1 - stageCfg().groundRatio));
}
function projY(z, y = 0){
  return groundY() - z * 0.55 - y;
}

// que el mensaje llego (util para probar mapeos con el controlador real).
function triggerMidiEvent(name){

function setupMIDI(){
  if(!navigator.requestMIDIAccess){
    updateMidiStatus();
    return;
  }
  navigator.requestMIDIAccess().then(access => {
    midiAccess = access;
    refreshMidiDevices();
    access.onstatechange = refreshMidiDevices;
  }).catch(() => updateMidiStatus());
}
function refreshMidiDevices(){
  if(!midiAccess){
    updateMidiStatus();
    return;
  }
  midiDevices.forEach(input => { input.onmidimessage = null; });
  midiDevices.clear();
  for(const input of midiAccess.inputs.values()) midiDevices.set(input.id, input);
  CONFIG.midi.enabledDevices = CONFIG.midi.enabledDevices.filter(id => midiDevices.has(id)).slice(0, CONFIG.midi.maxDevices);
  if(CONFIG.midi.enabledDevices.length === 0 && midiDevices.size > 0){
    CONFIG.midi.enabledDevices.push(midiDevices.keys().next().value);
  }
  CONFIG.midi.enabledDevices.forEach(id => {
    const input = midiDevices.get(id);
    if(input) input.onmidimessage = msg => onMidiMessage(msg, id);
  });
  updateMidiStatus();
  if(currentConfigTab === 'midi') refreshConfigContent();
}
function updateMidiStatus(){
  if(!midiStatus) return;
  const enabled = CONFIG.midi.enabledDevices.length;
  const netOn = NET_MIDI_STATE.connected;
  if(enabled > 0 && netOn){
    midiStatus.textContent = `MIDI ${enabled}/${CONFIG.midi.maxDevices} + NET`;
    midiStatus.classList.add('on');
  } else if(enabled > 0){
    midiStatus.textContent = `MIDI ON ${enabled}/${CONFIG.midi.maxDevices}`;
    midiStatus.classList.add('on');
  } else if(netOn){
    midiStatus.textContent = `MIDI NET ${NET_MIDI_STATE.clients || 1}`;
    midiStatus.classList.add('on');
  } else if(midiDevices.size > 0){
    midiStatus.textContent = `MIDI DISP ${midiDevices.size}`;
    midiStatus.classList.remove('on');
  } else {
    midiStatus.textContent = 'MIDI ESPERANDO';
    midiStatus.classList.remove('on');
  }
  midiStatus.title = [
    enabled > 0 ? `Local: ${enabled}/${CONFIG.midi.maxDevices}` : 'Local: sin entrada activa',
    CONFIG.midi.network.enabled ? (netOn ? `Net: ${NET_MIDI_STATE.url || CONFIG.midi.network.wsUrl} · sala ${NET_MIDI_STATE.room || CONFIG.midi.network.room}` : `Net: esperando ${CONFIG.midi.network.wsUrl}`) : 'Net: off',
    NET_MIDI_STATE.lastMessage ? `Ultimo: ${NET_MIDI_STATE.lastMessage}` : ''
  ].filter(Boolean).join('\n');
}
function onMidiMessage(message){
  const [status, data1, data2] = message.data;
  const cmd = status & 0xf0;
  const ch = status & 0x0f;
  let type = null;
  if(cmd === 0x90 && data2 > 0) type = 'noteon';
  else if(cmd === 0xb0) type = 'cc';
  else if(cmd === 0xc0) type = 'pc';
  if(!type) return;

  if(midiLearnTarget){
    const learned = midiLearnTarget;
    CONFIG.midi.mappings[learned] = { type, note:data1, ch };
    midiLearnTarget = null;
    applyConfigToLiveGame();
    if(currentConfigTab === 'midi') refreshConfigContent();
    showToast(`Mapped: ${MIDI_EVENT_LABELS[learned] || learned}`);
    return;
  }

  for(const eventName of Object.keys(CONFIG.midi.mappings)){
    const map = CONFIG.midi.mappings[eventName];
    if(map.type === type && map.note === data1 && (map.ch === ch || map.ch === 16)){
      triggerMidiEvent(eventName, data2);
      return;
    }
  }
}
function closeNetMidiConnection(){
  clearTimeout(NET_MIDI_STATE.retryTimer);
  NET_MIDI_STATE.retryTimer = 0;
  if(NET_MIDI_STATE.ws){
    NET_MIDI_STATE.ws.onopen = null;
    NET_MIDI_STATE.ws.onmessage = null;
    NET_MIDI_STATE.ws.onerror = null;
    NET_MIDI_STATE.ws.onclose = null;
    try { NET_MIDI_STATE.ws.close(); } catch(error){}
  }
  NET_MIDI_STATE.ws = null;
  NET_MIDI_STATE.connected = false;
  NET_MIDI_STATE.clients = 0;
  updateMidiStatus();
}
function handleNetMidiMessage(raw){
  let payload = null;
  try {
    payload = JSON.parse(raw);
  } catch(error){
    return;
  }
  if(!payload || !payload.type) return;
  if(payload.type === 'joined'){
    NET_MIDI_STATE.room = payload.room || CONFIG.midi.network.room;
    NET_MIDI_STATE.clients = payload.clients || 0;
    updateMidiStatus();
    if(currentConfigTab === 'midi') refreshConfigContent();
    return;
  }
  if(payload.type === 'midi' && Array.isArray(payload.data)){
    NET_MIDI_STATE.lastMessage = payload.data.map(byte => `0x${Number(byte).toString(16).toUpperCase().padStart(2,'0')}`).join(' ');
    onMidiMessage({ data: payload.data });
    updateMidiStatus();
  }
}
function connectNetMidi(){
  if(!CONFIG.midi.network.enabled || !window.WebSocket){
    closeNetMidiConnection();
    return;
  }
  const url = (CONFIG.midi.network.wsUrl || '').trim();
  const room = (CONFIG.midi.network.room || 'midivj').trim() || 'midivj';
  if(
    NET_MIDI_STATE.ws &&
    (NET_MIDI_STATE.ws.readyState === WebSocket.OPEN || NET_MIDI_STATE.ws.readyState === WebSocket.CONNECTING)
  ){
    if(NET_MIDI_STATE.url === url && NET_MIDI_STATE.room === room) return;
    closeNetMidiConnection();
  }
  if(!url){
    updateMidiStatus();
    return;
  }
  clearTimeout(NET_MIDI_STATE.retryTimer);
  try {
    const ws = new WebSocket(url);
    NET_MIDI_STATE.ws = ws;
    NET_MIDI_STATE.url = url;
    ws.onopen = () => {
      NET_MIDI_STATE.connected = true;
      NET_MIDI_STATE.failCount = 0;
      NET_MIDI_STATE.room = room;
      NET_MIDI_STATE.lastMessage = '';
      ws.send(JSON.stringify({ type:'join', room }));
      updateMidiStatus();
      if(currentConfigTab === 'midi') refreshConfigContent();
      showToast('Net MIDI conectado');
    };
    ws.onmessage = event => handleNetMidiMessage(event.data);
    ws.onerror = () => {
      NET_MIDI_STATE.connected = false;
      updateMidiStatus();
    };
    ws.onclose = () => {
      NET_MIDI_STATE.ws = null;
      NET_MIDI_STATE.connected = false;
      NET_MIDI_STATE.clients = 0;
      updateMidiStatus();
      if(currentConfigTab === 'midi') refreshConfigContent();
      scheduleNetMidiRetry();
    };
  } catch(error){
    NET_MIDI_STATE.connected = false;
    updateMidiStatus();
    scheduleNetMidiRetry();
  }
}
// Backoff exponencial (tope 30s): sin relay corriendo, cada intento fallido
// imprime un error de consola imposible de suprimir desde JS; espaciar los
// reintentos corta el spam. onopen resetea el conteo, y el boton de reconexion
// manual del panel sigue intentando al instante.
function scheduleNetMidiRetry(){
  clearTimeout(NET_MIDI_STATE.retryTimer);
  if(!CONFIG.midi.network.enabled) return;
  NET_MIDI_STATE.failCount = Math.min((NET_MIDI_STATE.failCount || 0) + 1, 6);
  const base = Math.max(300, CONFIG.midi.network.retryMs || 1200);
  NET_MIDI_STATE.retryTimer = setTimeout(connectNetMidi, Math.min(base * Math.pow(2, NET_MIDI_STATE.failCount - 1), 30000));
}

let spriteSnap = null;
// Caja de lo dibujado dentro de drawEntityHD, en pixeles de su lienzo, para
// que el pase HD procese solo esa zona (ver hdTrackRect).
let hdTrack = null;
function withSpriteScale(ax, ay, scale, draw){
  if(!(scale > 0) || scale === 1){
    draw();
    return;
  }
  const outer = spriteSnap;
  let devX, devY, localX, localY;
  if(outer){
    devX = outer.dx + Math.round((ax - outer.ax) * outer.s);
    devY = outer.dy + Math.round((ay - outer.ay) * outer.s);
    localX = outer.ax + (devX - outer.dx) / outer.s;
    localY = outer.ay + (devY - outer.dy) / outer.s;
  } else {
    devX = localX = Math.round(ax);
    devY = localY = Math.round(ay);
  }
  ctx.save();
  ctx.translate(localX, localY);
  ctx.scale(scale, scale);
  ctx.translate(-localX, -localY);
  spriteSnap = { ax:localX, ay:localY, dx:devX, dy:devY, s:(outer ? outer.s : 1) * scale };
  try {
    draw();
  } finally {
    spriteSnap = outer;
    ctx.restore();
  }
}
// Escala del sprite que se esta dibujando (1 fuera de withSpriteScale). Los
// efectos que marcan distancias reales del juego (anillos de aviso, lenguas,
// vendas) la dividen para conservar su alcance verdadero en pantalla.
function spriteDrawScale(){
  return spriteSnap ? spriteSnap.s : 1;
}
function hdTrackRect(x0, y0, x1, y1){
  const track = hdTrack;
  const left = Math.min(x0, x1) + track.ox;
  const right = Math.max(x0, x1) + track.ox;
  const top = Math.min(y0, y1) + track.oy;
  const bottom = Math.max(y0, y1) + track.oy;
  if(left < track.minX) track.minX = left;
  if(top < track.minY) track.minY = top;
  if(right > track.maxX) track.maxX = right;
  if(bottom > track.maxY) track.maxY = bottom;
}
function fillPixels(x, y, w, h){
  if(!spriteSnap){
    ctx.fillRect(x, y, w, h);
    if(hdTrack) hdTrackRect(x, y, x + w, y + h);
    return;
  }
  const { ax, ay, dx, dy, s } = spriteSnap;
  const x0 = Math.round((x - ax) * s);
  const x1 = Math.round((x + w - ax) * s);
  const y0 = Math.round((y - ay) * s);
  const y1 = Math.round((y + h - ay) * s);
  ctx.fillRect(ax + x0 / s, ay + y0 / s, (x1 - x0) / s, (y1 - y0) / s);
  if(hdTrack) hdTrackRect(dx + x0, dy + y0, dx + x1, dy + y1);
}
function px(x, y, color, w = 1, h = 1){
  ctx.fillStyle = color;
  fillPixels(Math.round(x), Math.round(y), w, h);
}
function rect(x, y, w, h, color){
  ctx.fillStyle = color;
  fillPixels(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// ============================================================
// PASE HD (definicion estilo Metal Slug sobre el pixel-art)
// hdEnhanceSprite: contorno oscuro de 1px teñido del color vecino, luz de
// 1px en el borde superior de cada region de color y sombra de 1px en el
// inferior (mas suaves en los costados). Solo toca pixeles opacos: sombras,
// auras y destellos translucidos quedan intactos y los detalles de 1px de
// alto no se recolorean.
// hdEnhanceScenery: igual pero sin contorno y mas suave, con grano en el
// interior de cada region y una oclusion tramada (Bayer 4x4) hacia la base.
// Trabajan sobre ImageData (Uint32 0xAABBGGRR) y no dependen del juego.
// ============================================================
const HD_BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function hdLift(c, t){
  const r = c & 255;
  const g = (c >>> 8) & 255;
  const b = (c >>> 16) & 255;
  return (c & 0xff000000) | (Math.round(b + (255 - b) * t) << 16) | (Math.round(g + (255 - g) * t) << 8) | Math.round(r + (255 - r) * t);
}
function hdDim(c, mul){
  return (c & 0xff000000) | (Math.round(((c >>> 16) & 255) * mul) << 16) | (Math.round(((c >>> 8) & 255) * mul) << 8) | Math.round((c & 255) * mul);
}
function hdOutlineOf(c){
  const r = Math.round((c & 255) * 0.26 + 8);
  const g = Math.round(((c >>> 8) & 255) * 0.26 + 6);
  const b = Math.round(((c >>> 16) & 255) * 0.26 + 18);
  return 0xff000000 | (b << 16) | (g << 8) | r;
}
function hdHash(x, y, seed){
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed | 0, 1103515245)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hdEnhanceSprite(image, options = {}){
  const w = image.width;
  const h = image.height;
  const out = new Uint32Array(image.data.buffer, image.data.byteOffset, w * h);
  const src = out.slice();
  const light = options.light ?? 0.26;
  const shade = options.shade ?? 0.68;
  const sideLight = options.sideLight ?? 0.1;
  const sideShade = options.sideShade ?? 0.86;
  const outline = options.outline !== false;
  for(let y = 0; y < h; y++){
    const row = y * w;
    for(let x = 0; x < w; x++){
      const i = row + x;
      const c = src[i];
      const a = c >>> 24;
      if(a >= 200){
        const rgb = c & 0xffffff;
        const up = y > 0 ? src[i - w] : 0;
        const dn = y < h - 1 ? src[i + w] : 0;
        const lf = x > 0 ? src[i - 1] : 0;
        const rt = x < w - 1 ? src[i + 1] : 0;
        const sameUp = (up >>> 24) >= 200 && (up & 0xffffff) === rgb;
        const sameDown = (dn >>> 24) >= 200 && (dn & 0xffffff) === rgb;
        const sameLeft = (lf >>> 24) >= 200 && (lf & 0xffffff) === rgb;
        const sameRight = (rt >>> 24) >= 200 && (rt & 0xffffff) === rgb;
        if(!sameUp && sameDown) out[i] = hdLift(c, light);
        else if(!sameDown && sameUp) out[i] = hdDim(c, shade);
        else if(!sameLeft && sameRight) out[i] = hdLift(c, sideLight);
        else if(!sameRight && sameLeft) out[i] = hdDim(c, sideShade);
      } else if(outline && a < 128){
        let n = 0;
        if(y < h - 1 && (src[i + w] >>> 24) >= 200) n = src[i + w];
        else if(y > 0 && (src[i - w] >>> 24) >= 200) n = src[i - w];
        else if(x > 0 && (src[i - 1] >>> 24) >= 200) n = src[i - 1];
        else if(x < w - 1 && (src[i + 1] >>> 24) >= 200) n = src[i + 1];
        if(n) out[i] = hdOutlineOf(n);
      }
    }
  }
}
function hdEnhanceScenery(image, seed = 0){
  const w = image.width;
  const h = image.height;
  const out = new Uint32Array(image.data.buffer, image.data.byteOffset, w * h);
  const src = out.slice();
  let minY = -1;
  let maxY = -1;
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      if((src[y * w + x] >>> 24) >= 200){
        if(minY < 0) minY = y;
        maxY = y;
        break;
      }
    }
  }
  if(minY < 0) return;
  const span = Math.max(1, maxY - minY);
  for(let y = minY; y <= maxY; y++){
    const row = y * w;
    const t = (y - minY) / span;
    const occlusion = t > 0.68 ? (t - 0.68) / 0.32 * 10 : -1;
    for(let x = 0; x < w; x++){
      const i = row + x;
      const c = src[i];
      if((c >>> 24) < 200) continue;
      const rgb = c & 0xffffff;
      const up = y > 0 ? src[i - w] : 0;
      const dn = y < h - 1 ? src[i + w] : 0;
      const lf = x > 0 ? src[i - 1] : 0;
      const rt = x < w - 1 ? src[i + 1] : 0;
      const sameUp = (up >>> 24) >= 200 && (up & 0xffffff) === rgb;
      const sameDown = (dn >>> 24) >= 200 && (dn & 0xffffff) === rgb;
      const sameLeft = (lf >>> 24) >= 200 && (lf & 0xffffff) === rgb;
      const sameRight = (rt >>> 24) >= 200 && (rt & 0xffffff) === rgb;
      let next = c;
      if(!sameUp && sameDown) next = hdLift(c, 0.16);
      else if(!sameDown && sameUp) next = hdDim(c, 0.8);
      else if(!sameLeft && sameRight) next = hdLift(c, 0.06);
      else if(!sameRight && sameLeft) next = hdDim(c, 0.9);
      else if(sameUp && sameDown && sameLeft && sameRight){
        const n = hdHash(x, y, seed);
        if(n < 0.07) next = hdDim(c, 0.88);
        else if(n > 0.955) next = hdLift(c, 0.08);
      }
      if(occlusion >= 0 && HD_BAYER4[(y & 3) * 4 + (x & 3)] < occlusion) next = hdDim(next, 0.86);
      out[i] = next;
    }
  }
}

// ==== ARTE HD DE LOS MECHAKATZ (inicio) ====
// Dibujados a resolucion nativa: 1 px del arte = 1 px de pantalla cuando el
// mecha se ve a MECHA_HD_SCALE (≈52 px de alto con orejas). Hay vista lateral
// (mirando a la DERECHA, (0,0) = pies; mechaPainter espeja), frontal y
// trasera (giro 360° del escaner del celular) y derribado. El pelaje (coat)
// pinta el patron de gato en cabeza, torso, patas y cola.
// Este bloque se copia tal cual al mando del celular y al editor
// (build_config_editor.js): no puede usar game ni CONFIG.
const MECHA_HD_SCALE = 1.8;
const MECHA_COATS = [
  { value:'solid', label:'Liso' },
  { value:'tabby', label:'Atigrado' },
  { value:'spots', label:'Manchas (bengali)' },
  { value:'points', label:'Puntas (siames)' },
  { value:'tuxedo', label:'Esmoquin' },
  { value:'calico', label:'Calico (tricolor)' },
  { value:'tortie', label:'Carey (moteado)' }
];
const MECHA_EARS = [
  { value:'normal', label:'Normales' },
  { value:'big', label:'Grandes' },
  { value:'fold', label:'Plegadas (fold)' },
  { value:'tuft', label:'Con penacho (lince)' }

const MECHA_FX = [
  { value:'wave', label:'Anillos de onda' },
  { value:'pound', label:'Golpe al suelo' },
  { value:'bolts', label:'Rayos' },

const MECHA_FX_ORDER = ['wave', 'pound', 'bolts', 'slash'];
// Opciones de hdEnhanceSprite para los mechas: ya traen luz y sombra

const MECHA_HD_PASS = { light:0.14, shade:0.8, sideLight:0.05, sideShade:0.9 };
function mechaMix(a, b, t){
  const pa = parseInt(shadeHex(a, 1).slice(1), 16);
  const pb = parseInt(shadeHex(b, 1).slice(1), 16);
  const channel = shift => {
    const from = (pa >> shift) & 255;
    return clamp(Math.round(from + (((pb >> shift) & 255) - from) * t), 0, 255);
  };
  return `#${[channel(16), channel(8), channel(0)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}
// Completa y valida el look de gato de un personaje (configs viejas incluidas).
function sanitizeMechaLook(char, idx = 0){
  const valid = (list, value, fallback) => list.some(opt => opt.value === value) ? value : fallback;
  char.coat = valid(MECHA_COATS, char.coat, 'solid');
  char.ears = valid(MECHA_EARS, char.ears, 'normal');
  char.fx = valid(MECHA_FX, char.fx, MECHA_FX_ORDER[idx % MECHA_FX_ORDER.length]);
  const body = safeHexColor(char.body, '#00f0ff');
  char.coatColor = safeHexColor(char.coatColor, shadeHex(body, 0.6));
  char.coatColor2 = safeHexColor(char.coatColor2, shadeHex(body, 0.35));

function mechaFxKind(char, idx = 0){
  return MECHA_FX_ORDER.includes(char && char.fx) ? char.fx : MECHA_FX_ORDER[idx % MECHA_FX_ORDER.length];
}
function mechaCoatLabel(coat){

  return found ? found.label : 'Liso';
}
function mechaEarsLabel(ears){

const MECHA_PALETTE_CACHE = new Map();
// Paleta con luces y sombras de cada color. far = miembros del lado lejano.
function mechaPalette(char, far = false){
  const key = `${char.body}|${char.accent}|${char.visor}|${char.coatColor}|${char.coatColor2}|${char.belly}|${far ? 1 : 0}`;
  let pal = MECHA_PALETTE_CACHE.get(key);
  if(pal) return pal;
  const body = shadeHex(safeHexColor(char.body, '#00f0ff'), 1);
  const accent = shadeHex(safeHexColor(char.accent, shadeHex(body, 0.5)), 1);
  const visor = shadeHex(safeHexColor(char.visor, '#ffffff'), 1);
  const coat = shadeHex(safeHexColor(char.coatColor, shadeHex(body, 0.6)), 1);
  const coat2 = shadeHex(safeHexColor(char.coatColor2, shadeHex(body, 0.35)), 1);
  const belly = shadeHex(safeHexColor(char.belly, mechaMix(body, '#ffffff', 0.55)), 1);
  pal = {
    body, bodyHi:mechaMix(body, '#ffffff', 0.3), bodyLo:shadeHex(body, 0.72), bodyDk:shadeHex(body, 0.5),
    accent, accentHi:mechaMix(accent, '#ffffff', 0.32), accentLo:shadeHex(accent, 0.66),
    visor, visorHi:mechaMix(visor, '#ffffff', 0.6), visorLo:shadeHex(visor, 0.6),
    coat, coatHi:mechaMix(coat, '#ffffff', 0.22), coatLo:shadeHex(coat, 0.72),
    coat2, coat2Hi:mechaMix(coat2, '#ffffff', 0.22), coat2Lo:shadeHex(coat2, 0.72),
    belly, bellyHi:mechaMix(belly, '#ffffff', 0.45), bellyLo:shadeHex(belly, 0.8),
    metal:'#8c96aa', metalHi:'#d6dce8', metalLo:'#4c5468',
    glass:'#121828', glassHi:'#34466a',
    earIn:'#f39ab4', nose:'#ff7896', noseHi:'#ffc4d2', claw:'#eef4ff'
  };
  if(far){
    for(const name of Object.keys(pal)) pal[name] = shadeHex(pal[name], 0.66);
  }
  if(MECHA_PALETTE_CACHE.size > 160) MECHA_PALETTE_CACHE.clear();
  MECHA_PALETTE_CACHE.set(key, pal);
  return pal;
}
// Tono con brillo de un color de la paleta (bordes superiores).
function mechaLit(pal, color){
  if(color === pal.body) return pal.bodyHi;
  if(color === pal.coat) return pal.coatHi;
  if(color === pal.coat2) return pal.coat2Hi;
  if(color === pal.belly) return pal.bellyHi;
  if(color === pal.accent) return pal.accentHi;
  return color;
}
// Color de cada zona segun el pelaje (patas, cola, orejas, hocico).
function mechaZoneColor(pal, coat, zone){
  if(coat === 'points' && (zone === 'paw' || zone === 'tail' || zone === 'ear' || zone === 'mask')) return pal.coat;
  if(coat === 'tuxedo' && (zone === 'paw' || zone === 'mask')) return pal.belly;
  if(coat === 'calico' && zone === 'tail') return pal.coat2;
  if(zone === 'mask') return pal.belly;
  return pal.body;
}
// Pintor local del arte (x hacia adelante). dir < 0 lo espeja.
function mechaPainter(ox, oy, dir){
  const X = Math.round(ox);
  const Y = Math.round(oy);
  const R = (lx, ly, w, h, color) => {
    if(w <= 0 || h <= 0) return;
    rect(dir < 0 ? X - lx - w : X + lx, Y + ly, w, h, color);
  };
  const P = (lx, ly, color) => R(lx, ly, 1, 1, color);
  const D = (lx, ly, r, color, squash = 1) => pixelDisc(dir < 0 ? X - lx - 1 : X + lx, Y + ly, r, color, squash);
  // Miembro grueso de (x0,y0) a (x1,y1): cuadrados de t px por paso.
  const L = (x0, y0, x1, y1, color, t = 3) => {
    const steps = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    const half = Math.floor(t / 2);
    for(let k = 0; k <= steps; k++){
      R(Math.round(x0 + (x1 - x0) * k / steps) - half, Math.round(y0 + (y1 - y0) * k / steps) - half, t, t, color);
    }
  };
  return { R, P, D, L };
}
function drawMechaAura(x, y, char, scale = 1, intensity = 1){
  const bodyAura = char.body || '#00f0ff';
  const visorAura = char.visor || '#ffffff';
  const glowBlur = Math.max(2, 5 * scale * intensity);
  ctx.save();
  ctx.globalAlpha = 0.16 * intensity;
  ctx.filter = `blur(${glowBlur}px)`;
  ctx.fillStyle = visorAura;
  ctx.beginPath();
  ctx.ellipse(x, y - 15 * scale, 10 * scale, 14 * scale, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 0.1 * intensity;
  ctx.fillStyle = bodyAura;
  ctx.beginPath();
  ctx.ellipse(x, y - 14 * scale, 15 * scale, 19 * scale, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

// Filas de la oreja: [desplazamiento, ancho] desde la base hacia la punta.
const MECHA_EAR_ROWS = {
  normal:{ rows:[[0, 6], [0, 6], [1, 5], [1, 4], [2, 3], [2, 2], [3, 1]], inner:[[2, 2], [2, 2], [3, 1], [3, 1]] },
  big:{ rows:[[0, 7], [0, 7], [1, 6], [1, 5], [2, 4], [2, 4], [3, 3], [3, 2], [4, 1]], inner:[[2, 3], [2, 3], [3, 2], [3, 2], [4, 1]] }
};
// Oreja de perfil con base en (baseX, baseY) (fila inferior). mirror voltea
// la inclinacion (vista frontal/trasera del lado derecho).
function mechaEar(R, P, pal, char, baseX, baseY, options = {}){
  const earColor = options.color || mechaZoneColor(pal, char.coat, 'ear');
  const inner = options.back ? null : pal.earIn;
  const mirror = !!options.mirror;
  if(char.ears === 'fold'){
    // Plegada: un casquete bajo con la punta doblada hacia el frente.
    R(baseX, baseY - 2, 6, 3, earColor);
    R(baseX + 1, baseY - 3, 4, 1, earColor);
    R(baseX + 1, baseY - 3, 3, 1, mechaLit(pal, earColor));
    R(mirror ? baseX : baseX + 4, baseY - 1, 2, 2, pal.bodyLo);
    return;
  }
  const spec = MECHA_EAR_ROWS[char.ears === 'big' ? 'big' : 'normal'];
  const total = spec.rows[0][1];
  spec.rows.forEach(([off, w], row) => {
    const left = mirror ? baseX + total - off - w : baseX + off;
    R(left, baseY - row, w, 1, earColor);
  });
  // Borde con luz del lado de adelante.
  spec.rows.forEach(([off, w], row) => {
    if(row < 2) return;
    const edge = mirror ? baseX + total - off - 1 : baseX + off;
    P(edge, baseY - row, mechaLit(pal, earColor));
  });
  if(inner){
    spec.inner.forEach(([off, w], k) => {
      const left = mirror ? baseX + total - off - w : baseX + off;
      R(left, baseY - 1 - k, w, 1, inner);
    });
  }
  if(char.ears === 'tuft'){
    const tip = spec.rows[spec.rows.length - 1][0];
    const tipX = mirror ? baseX + total - tip - 1 : baseX + tip;
    const tuft = char.coat === 'solid' ? pal.bodyDk : pal.coat;
    P(tipX, baseY - spec.rows.length, tuft);
    P(tipX + (mirror ? -1 : 1), baseY - spec.rows.length - 1, tuft);
  }

function mechaTailSide(R, P, D, pal, coat, u, anim, swing = 0){
  const pts = [[-9, -17], [-11, -18], [-13, -20], [-14, -23], [-15, -26], [-15, -29], [-14, -32], [-12, -34]];

  let tipY = 0;

    const wx = -9 - k * 2.4;
    const wy = -17 - k * 0.6;
    const sx = Math.round(tx + (wx - tx) * whip) + (k >= 3 ? Math.round(sway * (k - 2) * 0.6 * (1 - whip)) : 0);
    const sy = Math.round(ty + (wy - ty) * whip) + u;
    let color = base;
    if(coat === 'tabby' && k % 2 === 1) color = pal.coat;
    if(coat === 'spots' && k % 3 === 1) color = pal.coat;
    if(coat === 'tortie') color = k % 3 === 0 ? pal.coat : (k % 3 === 1 ? pal.coat2 : pal.body);
    if(coat === 'tuxedo' && k === pts.length - 1) color = pal.belly;
    R(sx - 1, sy - 1, 3, 3, color);
    P(sx - 1, sy - 1, mechaLit(pal, color));
    if(coat === 'solid' && k % 2 === 0) P(sx + 1, sy + 1, pal.accent);
    tipX = sx;
    tipY = sy;
  });
  R(tipX - 1, tipY - 3, 3, 2, pal.visor);
  P(tipX, tipY - 3, pal.visorHi);
