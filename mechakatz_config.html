    const va = pick(key, a);
    const vb = pick(key, b);
    if(Array.isArray(va)) pose[key] = [va[0] + (vb[0] - va[0]) * f, va[1] + (vb[1] - va[1]) * f];
    else if(typeof va === 'number') pose[key] = va + (vb - va) * f;
    else pose[key] = f < 0.5 ? va : vb;
  }
  return pose;
}
// Brazo por hombro, codo y puño, con garras que salen en la direccion del
// antebrazo.
function mechaArmPose(R, P, L, D, pal, coat, sx, sy, ex, ey, fx, fy, fist, claw, shoulder){
  if(shoulder){
    D(sx, sy, 2, pal.accent);
    P(sx - 1, sy - 1, pal.accentHi);
  }
  L(sx, sy + 1, ex, ey, pal.body, 3);
  R(ex - 1, ey - 1, 2, 2, pal.metal);
  L(ex, ey, fx, fy, pal.accent, 3);
  const paw = mechaZoneColor(pal, coat, 'paw');
  const size = Math.max(3, Math.round(fist));
  const half = Math.floor(size / 2);
  R(fx - half, fy - half, size, size, paw);
  R(fx - half, fy - half, size, 1, mechaLit(pal, paw));
  if(claw > 0.5){
    const dx = fx - ex;
    const dy = fy - ey;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    const bx = fx + ux * (half + 1);
    const by = fy + uy * (half + 1);
    for(let k = -1; k <= 1; k++){
      const ox = -uy * k * 1.7;
      const oy = ux * k * 1.7;
      L(bx + ox, by + oy, bx + ox + ux * claw, by + oy + uy * claw, pal.claw, 1);
    }
  }
}
// Banda de pixeles en arco (estela de un golpe): de a0 a a1 (radianes), mas
// gruesa y blanca en el borde delantero. Translucida para que el pase HD no
// la contornee.
function mechaSmearArc(R, cx, cy, radius, a0, a1, thick, color, alpha){
  if(alpha <= 0.02) return;
  const lead = new Set();
  const body = new Set();
  const steps = Math.max(6, Math.ceil(Math.abs(a1 - a0) * (radius + thick)));
  for(let s = 0; s <= steps; s++){
    const k = s / steps;
    const a = a0 + (a1 - a0) * k;
    const band = 1 + Math.round((thick - 1) * k);
    for(let r = 0; r < band; r++){
      const key = `${Math.round(cx + Math.cos(a) * (radius + r))},${Math.round(cy + Math.sin(a) * (radius + r))}`;
      if(k > 0.78) lead.add(key); else body.add(key);
    }
  }
  const oldAlpha = ctx.globalAlpha;
  ctx.globalAlpha = oldAlpha * Math.min(0.72, alpha * 0.55);
  body.forEach(key => { if(!lead.has(key)){ const [x, y] = key.split(',').map(Number); R(x, y, 1, 1, color); } });
  ctx.globalAlpha = oldAlpha * Math.min(0.72, alpha);
  lead.forEach(key => { const [x, y] = key.split(',').map(Number); R(x, y, 1, 1, '#ffffff'); });
  ctx.globalAlpha = oldAlpha;
}
// Lineas de velocidad detras de un puño.
function mechaSpeedLines(R, fromX, toX, y, color, alpha){
  if(alpha <= 0.02 || toX <= fromX) return;
  const oldAlpha = ctx.globalAlpha;
  ctx.globalAlpha = oldAlpha * Math.min(0.7, alpha);
  const span = toX - fromX;
  R(Math.round(fromX + span * 0.2), Math.round(y) - 2, Math.round(span * 0.7), 1, color);
  R(Math.round(fromX), Math.round(y), Math.round(span), 1, '#ffffff');
  R(Math.round(fromX + span * 0.35), Math.round(y) + 2, Math.round(span * 0.55), 1, color);
  ctx.globalAlpha = oldAlpha;
}
function mechaFade(t, start, peak, end){
  if(t <= start || t >= end) return 0;
  return t < peak ? (t - start) / Math.max(0.001, peak - start) : 1 - (t - peak) / Math.max(0.001, end - peak);
}
// Estelas de cada movimiento en coordenadas del cuerpo (bx/u ya sumados).
function mechaMoveSmears(R, move, t, pose, pal, bullet){
  const glowColor = bullet || pal.visorHi;
  if(move === 'jab'){
    mechaSpeedLines(R, 3, pose.nf[0] - 3, pose.nf[1], glowColor, mechaFade(t, 0.2, 0.34, 0.55));
  } else if(move === 'cross'){
    const a = mechaFade(t, 0.22, 0.36, 0.62);
    for(let k = 0; k < 3; k++) mechaSmearArc(R, pose.ff[0] - 7, pose.ff[1] + 3, 9 + k * 3, -2.0, 0.5 * Math.min(1, (t - 0.2) / 0.14) - 0.3, 1, glowColor, a);
  } else if(move === 'upper'){
    mechaSmearArc(R, 3, -27, 13, 1.1, 1.1 - 2.6 * Math.min(1, Math.max(0, (t - 0.2) / 0.14)), 4, glowColor, mechaFade(t, 0.2, 0.34, 0.6));
  } else if(move === 'haymaker'){
    const sweep = Math.min(1, Math.max(0, (t - 0.3) / 0.14));
    mechaSmearArc(R, 5, -20, 14, 3.6, 3.6 + 2.2 * sweep, 5, glowColor, mechaFade(t, 0.3, 0.45, 0.7));
    mechaSpeedLines(R, -6, pose.nf[0] - 4, pose.nf[1], glowColor, mechaFade(t, 0.38, 0.46, 0.66));
  } else if(move === 'finisher'){
    const spin = mechaFade(t, 0.18, 0.4, 0.6);
    if(spin > 0){
      const rot = t * 40;
      mechaSmearArc(R, 0, -22, 15, rot, rot + 2.2, 2, glowColor, spin);
      mechaSmearArc(R, 0, -34, 12, rot + Math.PI, rot + Math.PI + 2.2, 2, glowColor, spin);
    }
    const x = mechaFade(t, 0.66, 0.72, 0.92);
    mechaSmearArc(R, 14, -26, 12, -2.3, -0.2, 4, glowColor, x);
    mechaSmearArc(R, 14, -26, 12, 2.3, 0.2, 4, glowColor, x);
  } else if(move === 'special_slash'){
    const sweep = Math.min(1, Math.max(0, (t - 0.47) / 0.08));
    mechaSmearArc(R, 4, -24, 20, 2.3, 2.3 - 3.6 * sweep, 6, glowColor, mechaFade(t, 0.46, 0.52, 0.85));
  } else if(move === 'special_pound'){
    const a = mechaFade(t, 0.44, 0.5, 0.62);
    mechaSpeedLines(R, -2, 14, -30, glowColor, a);
  }
}
// Mecha de perfil. state/frame como en el juego (attack, heavy, shield,
// special, victory, carry, dive, repair, walk/run, idle). En los ataques,
// frame es el stateTimer (cuenta hacia atras) y move el golpe del combo
// ('jab' | 'cross' | 'upper' | 'finisher'); 'shoot' anima el disparo en vuelo.
function drawMechaHD(x, y, char, facing, anim, state, frame, move){
  const dir = facing < 0 ? -1 : 1;
  const pal = mechaPalette(char);
  const far = mechaPalette(char, true);
  const coat = char.coat || 'solid';
  // Dentro del pase HD (lienzo de CPU) el aura difuminada sale cara: quien
  // usa el pase la dibuja antes en pantalla (hdMechaAura del juego).
  if(!hdTrack && !char.noAura) drawMechaAura(x, y, char, MECHA_HD_SCALE, state === 'victory' ? 1.15 : 1);
  const combatMove = mechaMoveFor(state, move, char);
  if(combatMove){
    drawMechaCombat(x, y, char, dir, anim, combatMove, 1 - clamp(frame, 0, mechaMoveFrames(combatMove)) / mechaMoveFrames(combatMove), pal, far, coat);
    return;
  }
  const { R, P, D, L } = mechaPainter(x, y, dir);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(x, y, 15, 4.5, 0, 0, TAU);
  ctx.fill();
  const walking = state === 'walk' || state === 'run';
  const phase = walking ? Math.sin(anim * 0.4) : 0;
  let u = walking ? -Math.round(Math.abs(phase)) : 0;
  if(state === 'victory') u = Math.round(Math.sin(anim * 0.28) * 2);
  mechaTailSide(R, P, D, pal, coat, u, anim);
  mechaArmsSide(R, P, L, D, pal, far, coat, u, state, frame, phase, anim, 'far');
  if(state === 'dive'){
    // Patada en picada: pierna cercana estirada al frente, la otra recogida.
    L(-3, -14, -1, -9, far.body, 4);
    R(-3, -9, 5, 3, mechaZoneColor(far, coat, 'paw'));
    L(2, -14, 9, -6, pal.body, 4);
    R(8, -8, 6, 4, mechaZoneColor(pal, coat, 'paw'));
    R(14, -8, 2, 1, pal.claw);
    R(14, -6, 2, 1, pal.claw);
  } else {
    const stride = Math.round(phase * 3);
    mechaLegSide(R, P, L, far, coat, -3, -stride, phase < -0.4 ? 1 : 0, false);
    mechaLegSide(R, P, L, pal, coat, 2, stride, phase > 0.4 ? 1 : 0, true);
  }
  mechaTorsoSide(R, P, pal, coat, u, Math.floor(anim / 20) % 2 === 0);
  mechaHeadSide(R, P, L, pal, far, char, u, anim);
  mechaArmsSide(R, P, L, D, pal, far, coat, u, state, frame, phase, anim, 'near');
}
// Mecha en pose de combate (t = avance 0..1 del movimiento).
function drawMechaCombat(x, y, char, dir, anim, move, t, pal, far, coat){
  const pose = mechaMovePose(move, t);
  const lift = Math.min(0, pose.u);
  const crouch = Math.max(0, pose.u);
  const bx = Math.round(pose.bx);
  // Sombra en el piso: se achica cuando el mecha despega.
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(8, 15 + lift * 0.6), Math.max(2.5, 4.5 + lift * 0.15), 0, 0, TAU);
  ctx.fill();
  const liftY = y + Math.round(lift);
  // Giro del remate: vistas de espalda / frente / perfil opuesto.
  if(pose.view === 'back' || pose.view === 'front'){
    if(pose.view === 'back') drawMechaHDBack(x, liftY, char, anim);
    else drawMechaHDFront(x, liftY, char, anim);
    const spin = mechaPainter(x, liftY, dir);
    mechaMoveSmears(spin.R, move, t, pose, pal, char.bullet);
    return;
  }
  const viewDir = pose.view === 'side-flip' ? -dir : dir;
  const legs = mechaPainter(x, liftY, viewDir);
  const body = mechaPainter(x + viewDir * bx, liftY, viewDir);
  const head = mechaPainter(x + viewDir * (bx + Math.round(pose.hx)), liftY, viewDir);
  const c = Math.round(crouch);
  const u = c;
  mechaTailSide(body.R, body.P, body.D, pal, coat, u, anim, pose.tail);
  const farPal = pose.farFront ? pal : far;
  const drawFarArm = () => mechaArmPose(body.R, body.P, body.L, body.D, farPal, coat,
    -3, -27 + u, Math.round(pose.fe[0]), Math.round(pose.fe[1]) + u, Math.round(pose.ff[0]), Math.round(pose.ff[1]) + u,
    pose.fistF, pose.clawF, false);
  if(!pose.farFront) drawFarArm();
  const stepF = Math.round(pose.stepF);
  const stepB = Math.round(pose.stepB);
  mechaLegSide(legs.R, legs.P, legs.L, far, coat, -3 + bx, stepB - bx, 0, false, c);
  mechaLegSide(legs.R, legs.P, legs.L, pal, coat, 2 + bx, stepF - bx, 0, true, c);
  mechaTorsoSide(body.R, body.P, pal, coat, u, pose.glow > 0.3 || Math.floor(anim / 20) % 2 === 0);
  if(pose.glow > 0.05){
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * Math.min(0.7, 0.2 + pose.glow * 0.5);
    body.D(-2, -25 + u, Math.round(2 + pose.glow * 3), pal.visorHi);
    ctx.globalAlpha = oldAlpha;
  }
  mechaHeadSide(head.R, head.P, head.L, pal, far, char, u + Math.round(pose.hy), anim);
  if(pose.eye > 0.1){
    // Destello de los ojos: estela que sale hacia atras del visor.
    const len = Math.round(3 + pose.eye * 7);
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * Math.min(0.7, pose.eye * 0.7);
    head.R(4 - len, -41 + u + Math.round(pose.hy), len, 1, pal.visorHi);
    head.R(1 - len, -40 + u + Math.round(pose.hy), len - 2, 1, pal.visor);
    ctx.globalAlpha = oldAlpha;
  }
  if(pose.farFront) drawFarArm();
  mechaArmPose(body.R, body.P, body.L, body.D, pal, coat,
    1, -28 + u, Math.round(pose.ne[0]), Math.round(pose.ne[1]) + u, Math.round(pose.nf[0]), Math.round(pose.nf[1]) + u,
    pose.fistN, pose.clawN, true);
  const shifted = Object.assign({}, pose, {
    nf:[pose.nf[0], pose.nf[1] + u], ff:[pose.ff[0], pose.ff[1] + u]
  });
  mechaMoveSmears(body.R, move, t, shifted, pal, char.bullet);
}
// ---- Vistas frontal y trasera (giro del escaner) ----
function mechaSymPainter(x, y){
  const paint = mechaPainter(x, y, 1);
  const RS = (lx, ly, w, h, color) => {
    paint.R(lx, ly, w, h, color);
    paint.R(-lx - w, ly, w, h, color);
  };
  const PS = (lx, ly, color) => RS(lx, ly, 1, 1, color);
  return Object.assign(paint, { RS, PS });
}
function mechaLegsFront(RS, PS, R, pal, coat, back){
  RS(-7, -15, 5, 6, pal.body);
  RS(-7, -15, 5, 1, pal.bodyHi);
  if(coat === 'tabby'){ RS(-7, -13, 5, 1, pal.coat); RS(-6, -11, 4, 1, pal.coat); }
  if(coat === 'spots'){ RS(-6, -13, 2, 2, pal.coat); }
  if(coat === 'calico'){ R(-7, -15, 4, 3, pal.coat); R(3, -14, 3, 3, pal.coat2); }
  if(coat === 'tortie'){ PS(-6, -13, pal.coat); PS(-4, -11, pal.coat2); }
  RS(-6, -10, 3, 3, pal.metal);
  PS(-6, -10, pal.metalHi);
  RS(-6, -8, 3, 5, pal.accent);
  const paw = mechaZoneColor(pal, coat, 'paw');
  RS(-8, -3, 6, 3, paw);
  RS(-8, -3, 6, 1, mechaLit(pal, paw));
  if(back){
    RS(-6, -2, 2, 1, pal.glass);
  } else {
    PS(-7, -1, pal.glass);
    PS(-5, -1, pal.glass);
    PS(-3, -1, pal.claw);
  }
}
function mechaTailFront(R, P, pal, coat, anim, back){
  // De frente asoma por un costado; de espaldas sube por el centro.
  const sway = Math.round(Math.sin(anim * 0.12) * 2);
  const pts = back
    ? [[0, -17], [2, -19], [4, -22], [6, -25], [7, -29], [7, -33], [6, -36], [4 + sway, -38]]
    : [[9, -18], [11, -20], [12, -23], [13, -27], [12 + sway, -31], [11 + sway, -34]];
  const base = mechaZoneColor(pal, coat, 'tail');
  let tip = pts[pts.length - 1];
  pts.forEach(([tx, ty], k) => {
    let color = base;
    if(coat === 'tabby' && k % 2 === 1) color = pal.coat;
    if(coat === 'tortie') color = k % 3 === 0 ? pal.coat : (k % 3 === 1 ? pal.coat2 : pal.body);
    if(coat === 'tuxedo' && k === pts.length - 1) color = pal.belly;
    R(tx - 1, ty - 1, 3, 3, color);
    P(tx - 1, ty - 1, mechaLit(pal, color));
  });
  R(tip[0] - 1, tip[1] - 3, 3, 2, pal.visor);
  P(tip[0], tip[1] - 3, pal.visorHi);
}
function mechaHeadFrontShape(R, RS, pal){

function drawMechaHDBack(x, y, char, anim){

function enemyColorsFor(enemy){

  const tone = (color, k) => pick ? color : (k > 1 ? mechaMix(color, '#ffffff', k - 1) : shadeHex(color, k));
  const body = c.body;
  return {
    body, hi:tone(body, 1.3), lo:tone(body, 0.72), dk:tone(body, 0.5),
    belly:c.belly || tone(body, 1.35), bellyLo:tone(c.belly || tone(body, 1.35), 0.82),

    teeth:c.teeth || '#ffffff', spikes:c.spikes || '#ffffff', spikesLo:tone(c.spikes || '#ffffff', 0.7),
    metal:c.metal || '#888888', metalHi:tone(c.metal || '#888888', 1.4), metalDark:c.metalDark || '#444444',
    orbCore:c.orbCore || '#ffffff', orb1:c.orb1 || '#ff7aff', orb2:c.orb2 || '#5ad2ff'
  };
}

  R(hx + 1, hy + h, w - 2, 1, pal.lo);
  R(hx + 1, hy, w - 4, 1, pal.hi);
  R(hx, hy + 1, 1, h - 2, pal.lo);
  const ex = hx + Math.round(w * 0.42);
  const ey = hy + Math.round(h * 0.28);
  R(ex - 1, ey - 1, 8, 1, pal.line);
  R(ex, ey, 4, 4, pal.eyes);
  R(ex + 5, ey, 2, 4, pal.eyes);
  R(ex + 2, ey + 1, 2, 2, pal.pupils);
  P(ex + 5, ey + 1, pal.pupils);
  P(ex, ey, '#ffffff');
  const my = hy + h - 4;
  R(ex - 1, my, 8, 2, pal.line);
  P(ex, my, pal.teeth);

  P(ex + 6, my, pal.teeth);

function drawClassicEnemyHD(enemy, x, y){
  const ox = Math.floor(x);

    : (walking ? -Math.round(Math.abs(Math.sin(enemy.anim * 0.25))) : 0);

    drawEmergeGround(ox, oy, width, emergeP);
  } else if(!enemy.noShadow){
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(ox, oy + 1, width / 2 + 2, 5, 0, 0, TAU);
    ctx.fill();
  }
  const paint = mechaPainter(ox, yy, mx);
  if(enemy.knockedDown > 0){
    drawClassicDownHD(paint.R, paint.P, pal, enemy.sprite);
    return;
  }
  if(emerging){
    // Recorta todo lo que quede por debajo del suelo para simular el brote.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, oy + 3);
    ctx.clip();
  }
  const pose = {
    step:walking ? Math.round(Math.sin(enemy.anim * 0.25) * 2) : 0,
    attack:enemy.state === 'attack',
    frame:enemy.stateTimer || 0
  };
  const drawBody = palette => {
    const { R, P, L } = paint;
    if(enemy.sprite === 'big') drawClassicBigHD(R, P, L, palette, pose);
    else if(enemy.sprite === 'thrower') drawClassicThrowerHD(R, P, L, palette, pose);
    else drawClassicSmallHD(R, P, L, palette, pose);
    if(celebrate){
      // Festejo: brazos arriba que se agitan.
      const wave = Math.round(Math.sin(enemy.anim * 0.35 + (enemy.celebratePhase || 0)) * 2);
      const top = -height - 4;
      R(-width / 2 - 2, top + wave, 3, 12, palette.body);
      R(width / 2 - 1, top - wave, 3, 12, palette.body);
      P(-width / 2 - 1, top - 1 + wave, '#ffffff');
      P(width / 2, top - 1 - wave, '#ffffff');
    }
  };
  drawBody(pal);
  if(enemy.flash > 0){
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * clamp(enemy.flash / 8, 0, 1);
    drawBody(classicWhitePalette(pal));
    ctx.globalAlpha = oldAlpha;
  }
  if(emerging) ctx.restore();
}
// ============================================================
// ARTE DEL BESTIARIO POR MUNDO
// Cada monstruo se diseña en coordenadas locales mirando a la DERECHA con
// (0,0) en los pies; enemyPainter lo espeja cuando mira a la izquierda.
// Los dibujantes reciben la paleta c (editable en la pestaña ENEMIES) y
// flashPass=true cuando se redibujan como silueta blanca al recibir golpe
// (en ese pase se omiten efectos como sombras, miras o lenguas).
// ============================================================
function enemyPainter(ox, oy, mx){
  const R = (lx, ly, w, h, color) => {
    const ww = Math.round(w);
    const hh = Math.round(h);
    if(ww <= 0 || hh <= 0) return;
    const lxr = Math.round(lx);
    rect(mx > 0 ? ox + lxr : ox - lxr - ww, oy + Math.round(ly), ww, hh, color);
  };
  const P = (lx, ly, color) => R(lx, ly, 1, 1, color);
  const D = (lx, ly, r, color, squash = 1) => pixelDisc(mx > 0 ? ox + Math.round(lx) : ox - Math.round(lx) - 1, oy + Math.round(ly), r, color, squash);
  return { R, P, D };
}
function drawEnemyDizzy(x, y){
  for(let k = 0; k < 3; k++){
    const a = game.time * 0.2 + k * TAU / 3;
    px(x + Math.round(Math.cos(a) * 6), y + Math.round(Math.sin(a) * 2), k === 0 ? '#ffffff' : '#ffea00');
  }
}
function drawBestiaryEnemy(enemy, x, y, scale = 1){
  const ox = Math.floor(x);
  const oy = Math.floor(y);
  const mx = enemy.facing < 0 ? -1 : 1;
  const c = enemy.colorMap || enemyColorsFor(enemy);
  const lift = Math.round(enemy.y || 0);
  const groundY = oy + lift;
  const celebrate = enemy.state === 'celebrate';
  const bob = celebrate ? -Math.floor(Math.abs(Math.sin(enemy.anim * .35 + (enemy.celebratePhase || 0))) * 2.5) : 0;
  const emerging = enemy.state === 'emerge';
  const emergeP = emerging ? clamp(1 - enemy.emergeTimer / Math.max(1, enemy.emergeDur), 0, 1) : 1;
  const digging = enemy.abil === 'dig';
  const digP = digging ? clamp(1 - enemy.abilT / 18, 0, 1) : 0;
  const sink = emerging ? Math.round((1 - emergeP) * (enemy.height + 6)) : digging ? Math.round(digP * (enemy.height + 6)) : 0;
  const knocked = enemy.knockedDown > 0 && enemy.hp > 0;
  const yy = oy + bob + sink + (knocked ? 1 : 0);
  const buried = enemy.abil === 'under' || enemy.abil === 'warn';
  const dead = enemy.hp <= 0 && enemy.deadTimer > 0;
  // Suelo y sombra se escalan desde el piso (groundY) y el cuerpo desde sus
  // pies (oy): un dron que flota conserva su altura real sobre la sombra.
  if(emerging || digging){
    withSpriteScale(ox, groundY, scale, () => drawEmergeGround(ox, groundY, enemy.width, emerging ? emergeP : 1 - digP));
  } else if(!enemy.noShadow && !buried){
    const shrink = clamp(lift * 0.08, 0, 4);
    ctx.fillStyle = lift > 2 ? 'rgba(0,0,0,.26)' : 'rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(ox, groundY + 1, Math.max(3, enemy.width / 2 + 1 - shrink) * scale, Math.max(1.5, 3 - shrink * 0.4) * scale, 0, 0, TAU);
    ctx.fill();
  }
  const oldAlpha = ctx.globalAlpha;
  if(dead) ctx.globalAlpha = oldAlpha * (enemy.deadTimer % 4 < 2 ? 0.35 : 0.85);
  const clipGround = emerging || digging;
  if(clipGround){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, groundY + 2);
    ctx.clip();
  }
  const drawer = ENEMY_DRAWERS[enemy.sprite];
  withSpriteScale(ox, oy, scale, () => {
    drawer(enemy, ox, yy, mx, c, false);
    if(enemy.flash > 0 && !buried){
      const white = {};
      for(const key in c) white[key] = '#ffffff';
      ctx.globalAlpha = oldAlpha * clamp(enemy.flash / 8, 0, 1);
      drawer(enemy, ox, yy, mx, white, true);
    }
  });
  if(clipGround) ctx.restore();
  ctx.globalAlpha = oldAlpha;
  if(knocked && enemy.knockedDown > 14){
    withSpriteScale(ox, oy, scale, () => drawEnemyDizzy(ox, yy - enemy.height - 3));
  }
}
// Montículo de arena del ESCORPIX enterrado: el aguijon asoma como aleta y,
// antes de brotar, un anillo parpadeante marca la zona de impacto.
function drawBurrowMound(enemy, ox, yy, c){
  const sandLight = '#e6c690';
  const sand = '#c8a068';
  const sandDark = '#a8804a';
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(ox, yy + 1, 8, 2.5, 0, 0, TAU);
  ctx.fill();
  if(enemy.abil === 'warn'){
    // Mismo radio que el golpe real (abilityBurrow), aunque el sprite crezca.
    const r = (15 + (enemy.tier || 1) * 2) / spriteDrawScale();
    const hot = Math.floor(game.time / 4) % 2 === 0;
    for(let k = 0; k < 28; k++){
      const a = k / 28 * TAU;
      px(ox + Math.round(Math.cos(a) * r), yy + Math.round(Math.sin(a) * r * 0.5), hot ? '#ff3a2a' : '#ffea00');
    }
    const shake = game.time % 2;
    rect(ox - 7, yy - 2 - shake, 14, 2, sandDark);
    rect(ox - 5, yy - 4 - shake, 10, 2, sand);
    rect(ox - 3, yy - 6 - shake, 6, 2, sandLight);
    px(ox - 6, yy - 5 - shake, sand);
    px(ox + 5, yy - 3 - shake, sandLight);
    return;
  }
  rect(ox - 6, yy - 2, 12, 2, sandDark);
  rect(ox - 4, yy - 3, 8, 1, sand);
  rect(ox - 2, yy - 4, 4, 1, sandLight);
  const wob = Math.round(Math.sin(enemy.anim * 0.5));
  const back = -(enemy.facing < 0 ? -1 : 1);
  rect(ox - 1 + wob, yy - 8, 2, 4, c.tail);
  rect(ox + wob, yy - 10, 2, 2, c.sting);
  px(ox + wob, yy - 10, '#ffffff');
  for(let k = 1; k <= 3; k++) px(ox + back * (6 + k * 3), yy - 1 - ((game.time + k) % 2), k % 2 ? sand : sandDark);
}
function drawScorpionEnemy(enemy, ox, yy, mx, c, flashPass){
  if(enemy.abil === 'under' || enemy.abil === 'warn'){
    if(!flashPass) drawBurrowMound(enemy, ox, yy, c);
    return;
  }
  const { R, P } = enemyPainter(ox, yy, mx);
  const moving = enemy.state === 'walk' || enemy.state === 'celebrate';
  const step = moving ? Math.floor(enemy.anim * 0.3) % 2 : 0;
  const strike = enemy.state === 'attack' && enemy.stateTimer <= 12;
  // Patas: las lejanas mas oscuras, alternando al caminar.
  [-7, -3, 1].forEach((lx, i) => {
    const up = (i + step + 1) % 2;
    R(lx + 1, -5 - up, 1, 2, c.dark);
    R(lx + 2, -3 - up, 1, 3, c.dark);
  });
  // Cuerpo segmentado.
  R(-9, -9, 14, 5, c.body);
  R(-8, -10, 11, 1, c.body);
  R(-9, -5, 14, 1, c.dark);
  R(-7, -10, 7, 1, shadeHex(c.body, 1.18));
  for(let k = 0; k < 3; k++) R(-7 + k * 4, -9, 1, 4, c.dark);
  // Cabeza, ojos y pinzas.
  R(4, -9, 5, 4, c.body);
  R(5, -10, 3, 1, c.body);
  P(7, -9, c.eyes);
  P(8, -8, c.eyes);
  const pinch = strike || Math.floor(enemy.anim * 0.1) % 7 === 0;
  R(8, -7, 3, 1, c.legs);
  R(10, -9, 4, 2, c.body);
  R(10, -6, 4, 2, c.body);
  R(10, -9, 1, 5, c.body);
  if(pinch) R(13, -7, 1, 1, c.body);
  P(13, -9, c.dark);
  P(13, -5, c.dark);
  [-8, -4, 0].forEach((lx, i) => {
    const up = (i + step) % 2;
    R(lx, -5 - up, 1, 2, c.legs);
    R(lx - 1, -3 - up, 1, 3, c.legs);
  });
  // Cola arqueada sobre el lomo; al atacar descarga el aguijon hacia delante.
  const tail = strike
    ? [[-11, -9], [-12, -12], [-10, -15], [-6, -17], [-2, -16], [2, -14]]
    : [[-11, -9], [-13, -12], [-12, -15], [-10, -18], [-7, -19], [-4, -18]];
  tail.forEach(([tx, ty]) => {
    R(tx, ty, 3, 3, c.tail);
    P(tx, ty + 2, c.dark);
  });
  const [sx, sy] = tail[tail.length - 1];
  R(sx + 3, sy + 1, 2, 2, c.sting);
  P(sx + 5, sy + 3, c.sting);
  if(!flashPass && Math.floor(game.time / 6) % 2) P(sx + 3, sy + 1, '#ffffff');
}
function drawMummyEnemy(enemy, ox, yy, mx, c, flashPass){
  const { R, P } = enemyPainter(ox, yy, mx);
  const moving = enemy.state === 'walk' || enemy.state === 'celebrate';
  const step = moving ? Math.floor(enemy.anim * 0.16) % 2 : 0;
  const windup = enemy.abil === 'windup';
  const lashing = enemy.abil === 'lash';
  // Piernas rigidas que arrastran los pies.
  R(-4, -7 + step, 3, 7 - step, c.body);
  R(1, -7 + (1 - step), 3, 7 - (1 - step), c.body);
  R(-4, -4, 3, 1, c.shade);
  R(1, -3, 3, 1, c.shade);
  // Brazo trasero.
  R(-7, -15, 2, 7, c.shade);
  // Torso vendado.
  R(-5, -16, 10, 9, c.body);
  R(-5, -15, 10, 1, c.shade);
  R(-5, -12, 10, 1, c.shade);
  R(-5, -9, 10, 1, c.shade);
  P(-3, -13, c.gap);
  P(2, -10, c.gap);
  P(0, -14, c.metal);
  P(-2, -8, c.metal);
  // Brazo delantero: estirado al frente, echado atras al cargar el latigazo.
  if(windup){
    R(-4, -21, 2, 6, c.body);
    P(-4, -22, c.metal);
  } else {
    R(4, -15, 7, 2, c.body);
    R(4, -14, 7, 1, c.shade);
    R(11, -15, 2, 2, c.metal);
  }
  // Cabeza con vendas, rendija y ojo brillante.
  R(-4, -23, 8, 7, c.body);
  R(-4, -21, 8, 1, c.shade);
  R(-4, -18, 8, 1, c.shade);
  R(-2, -20, 6, 1, c.gap);
  R(2, -20, 2, 1, windup && !flashPass ? '#ffffff' : c.eye);
  P(-3, -24, c.shade);
  // Tira suelta que ondea.
  const flap = Math.round(Math.sin(enemy.anim * 0.2) * 1.5);
  R(-6, -22, 2, 1, c.body);
  R(-8, -21 + flap, 2, 1, c.body);
  R(-10, -20 + flap, 2, 1, c.shade);
  if(lashing && enemy.abilLen > 0 && !flashPass){
    // La venda mide su alcance real aunque el sprite este escalado.
    const len = Math.round(enemy.abilLen / spriteDrawScale());
    for(let k = 0; k < len; k += 2){
      const wave = Math.round(Math.sin(k * 0.3 + enemy.anim * 0.6));
      R(13 + k, -15 + wave, 2, 1, k % 4 === 0 ? c.body : c.shade);
    }
    R(13 + len, -16, 3, 3, c.body);
    P(14 + len, -15, c.shade);
  }
}
function drawGnomeEnemy(enemy, ox, yy, mx, c, flashPass){
  const fused = enemy.abil === 'fuse';
  const shake = fused ? (game.time % 2 ? 1 : -1) : 0;

  const step = moving ? Math.floor(enemy.anim * 0.35) % 2 : 0;
  let blink = false;
  if(fused){
    const t = Math.max(0, enemy.abilT);
    const rate = Math.max(2, Math.round(t / 6));
    blink = Math.floor(t / rate) % 2 === 0;
  }
  const suit = blink && !flashPass ? '#ff3a2a' : c.body;
  const hat = blink && !flashPass ? '#ffffff' : c.hat;
  // Botas y cuerpo.
  R(-4, -2 - step, 3, 2, c.boots);
  R(1, -2 - (1 - step), 3, 2, c.boots);

  R(-4, -5, 8, 1, c.boots);
  P(0, -5, flashPass ? c.boots : '#ffd84a');
  R(-6, -8, 2, 4, suit);
  R(4, -8, 2, 4, suit);
  P(-6, -4, c.skin);
  P(5, -4, c.skin);

  P(-1, -7, c.beard);

  P(0, -14, flashPass ? c.skin : '#1a1a1a');
  P(2, -14, flashPass ? c.skin : '#1a1a1a');

  R(-3, -17, 6, 2, hat);

  R(-1, -21, 3, 2, hat);

  if(fused || Math.floor(enemy.anim * 0.2) % 6 === 0){

      P(5, -25, c.spark);
    }

function drawMowerEnemy(enemy, ox, yy, mx, c, flashPass){
  const revving = enemy.abil === 'rev';
  const dashing = enemy.abil === 'dash';
  const stalled = enemy.abil === 'stall';
  const jitter = revving ? game.time % 2 : 0;
  const { R, P, D } = enemyPainter(ox, yy - jitter, mx);
  const spin = Math.floor(game.time * (dashing || revving ? 1 : 0.35)) % 4;
  // Cono de luz del faro al acelerar (detras del chasis).
  if((revving || dashing) && !flashPass){
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * 0.28;
    for(let r = 0; r < 5; r++) R(11 + r * 3, -9 - r, 3, 2 + r * 2, c.light);
    ctx.globalAlpha = oldAlpha;
  }
  // Plataforma de corte y cuchillas girando.
  R(-10, -4, 21, 2, c.dark);
  for(let k = 0; k < 5; k++) R(-9 + ((k * 4 + spin) % 20), -2, 2, 1, c.blade);
  // Ruedas con rayos.
  D(-6, -4, 4, c.wheel);
  P(-6, -4, flashPass ? c.wheel : '#9a9a9a');
  P(-6 + [1, 0, -1, 0][spin], -4 + [0, 1, 0, -1][spin], flashPass ? c.wheel : '#5a5a5a');
  D(7, -3, 3, c.wheel);
  P(7, -3, flashPass ? c.wheel : '#9a9a9a');
  // Chasis con franja cromada y morro inclinado.
  R(-9, -10, 17, 6, c.body);
  R(-9, -10, 17, 1, shadeHex(c.body, 1.3));
  R(-9, -5, 17, 1, c.dark);
  R(-8, -8, 13, 1, c.blade);
  R(8, -9, 2, 5, c.body);
  R(8, -9, 2, 1, shadeHex(c.body, 1.3));
  // Paragolpes dentado.
  R(10, -6, 1, 3, c.dark);
  P(11, -6, c.blade);
  P(11, -4, c.blade);
  // Faro como ojo, con ceja enojada.
  R(7, -8, 2, 2, c.light);
  R(6, -9, 4, 1, c.dark);
  if(!flashPass && (revving || dashing)) P(8, -8, '#ffffff');
  // Cabina: respaldo, cojin y manubrio.
  R(-8, -17, 2, 7, c.seat);
  R(-8, -18, 2, 1, shadeHex(c.seat, 2));
  R(-6, -11, 5, 1, c.seat);
  R(-1, -15, 1, 5, c.dark);
  R(-2, -16, 3, 1, c.dark);
  P(-2, -16, c.blade);
  // Escape con humo.
  R(-4, -14, 2, 4, c.exhaust);
  P(-4, -15, shadeHex(c.exhaust, 1.3));
  if(!flashPass && (revving || stalled || dashing || game.time % 40 < 6)){
    const k = (game.time % 12) / 12;
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * (0.6 - k * 0.5);
    D(-4 - Math.round(k * 4), -17 - Math.round(k * 6), 1 + Math.round(k * 2), stalled ? '#4a4a4a' : '#b8b8b8');
    ctx.globalAlpha = oldAlpha;
  }
  if(stalled && !flashPass && game.time % 6 < 3){
    P(11, -11, '#ffea00');
    P(-10, -6, '#ffffff');
  }
}
function drawDroneEnemy(enemy, ox, yy, mx, c, flashPass){

function drawNinjaEnemy(enemy, ox, yy, mx, c, flashPass){

    R(4, -13, 2, 2, c.body);

      for(let k = 0; k < 7; k++){
        const a = -1.1 + k * 0.32;

// ---- Helpers del catalogo de jefes (BOSS_TYPES) ----
function bossTypeDef(boss){
  return BOSS_TYPES[boss && boss.kind] || BOSS_TYPES.bakeneko;
}
// Resuelve un parametro [fase1, fase2] segun la fase actual del jefe.
function bossPhaseValue(boss, value, fallback){
  if(Array.isArray(value)) return value[boss && boss.head2Active ? 1 : 0] ?? value[0] ?? fallback;
  return value ?? fallback;
}
function bossAttackDef(boss, id = boss && boss.currentAttack){
  if(!boss || !id) return null;
  return bossTypeDef(boss).attacks.find(attack => attack.id === id) || null;
}
function bossSlotDamage(boss, attack){
  const slot = Math.max(0, bossTypeDef(boss).attacks.indexOf(attack));
  return [CONFIG.boss.laserDamage, CONFIG.boss.fireDamage, CONFIG.boss.slamDamage][slot] ?? CONFIG.boss.fireDamage;
}
function bossColorsFor(kind){
  const def = BOSS_TYPES[kind];
  if(!def || !def.colors){
    return { head1:CONFIG.boss.headColorL, head2:CONFIG.boss.headColorR, body:CONFIG.boss.bodyColor, eye:CONFIG.boss.eyeColor };
  }
  const custom = CONFIG.boss && CONFIG.boss.colors && CONFIG.boss.colors[kind];
  return Object.assign({}, def.colors, custom || {});
}
// Color de chispas / rafagas del jefe en cada fase.
function bossAccent(boss){
  const c = bossColorsFor(boss && boss.kind);
  const phase2 = !!(boss && boss.head2Active);
  switch(boss && boss.kind){
    case 'onigani': return phase2 ? c.core : c.eye;
    case 'tengu': return phase2 ? c.glow : c.mask;
    case 'golem': return phase2 ? c.magma : c.rune;
    default: return phase2 ? CONFIG.boss.headColorR : CONFIG.boss.eyeColor;
  }
}
function bossDisplayName(boss){
  return bossTypeDef(boss).name;
}
function bossPhaseLabel(boss){
  const def = bossTypeDef(boss);
  return `${def.name} ${def.phases[boss && boss.head2Active ? 1 : 0]}`;
}
// Sorteo del jefe de la partida: forzado por CONFIG.boss.pick o al azar entre
// los habilitados, sin repetir el anterior cuando hay 2 o mas.
let lastBossKind = '';
function pickBossKind(){
  const pick = CONFIG.boss && CONFIG.boss.pick;
  if(pick && pick !== 'random' && BOSS_TYPES[pick]) return pick;
  const roster = (CONFIG.boss && CONFIG.boss.roster) || {};
  let options = Object.keys(BOSS_TYPES).filter(kind => roster[kind] !== false);
  if(!options.length) options = ['bakeneko'];
  let kind = options[Math.floor(Math.random() * options.length)];
  if(options.length > 1 && kind === lastBossKind){
    const others = options.filter(option => option !== lastBossKind);
    kind = others[Math.floor(Math.random() * others.length)];
  }
  lastBossKind = kind;
  return kind;
}

function drawBakeNekoBoss(boss, x, y){

    drawBossHead(ox + 14, oy - 50, {
      alive: true,
      hp: Math.max(0, boss.hp2),
      maxHp: boss.maxHp,
      alert: celebrating || (!!boss.currentAttack && boss.attackFrame < 24),
      color: boss.flash > 0 ? '#fff' : CONFIG.boss.headColorR
    }, 'right');
  } else {
    rect(ox + 10, oy - 47, 8, 4, '#1a0033');
    rect(ox + 10, oy - 50, 8, 3, '#5a0a0a');
    px(ox + 12, oy - 49, '#ff3030');
    px(ox + 15, oy - 49, '#ff3030');
  }

  rect(ox - 4, oy - 32, 8, 8, '#000');
  rect(ox - 3, oy - 31, 6, 6, boss.flash > 0 ? '#fff' : CONFIG.boss.eyeColor);
  rect(ox - 2, oy - 30, 4, 4, '#fff');
  if(celebrating){
    rect(ox - 6, oy - 35, 12, 2, '#fff');
    rect(ox - 4, oy - 33, 8, 2, CONFIG.boss.eyeColor);
  }

  const laserOriginX = boss.head2Active && dir > 0 ? ox + 18 : ox - 18;
  const laserOriginY = oy - 49;
  if(boss.currentAttack === 'laser' && boss.attackFrame < 24){
    rect(laserOriginX - 4, laserOriginY - 2, 8, 6, '#fff');
    rect(laserOriginX - 3, laserOriginY - 1, 6, 4, boss.head2Active && dir > 0 ? CONFIG.boss.headColorR : CONFIG.boss.headColorL);
  }
  if(boss.currentAttack === 'laser' && boss.attackFrame >= 24 && boss.attackFrame <= 56){
    const beamX = dir < 0 ? 0 : laserOriginX + 4;
    const beamW = dir < 0 ? Math.max(0, laserOriginX - 4) : Math.max(0, W - beamX);
    rect(laserOriginX - 4, laserOriginY - 3, 10, 8, '#fff');
    rect(laserOriginX - 3, laserOriginY - 2, 8, 6, boss.head2Active && dir > 0 ? CONFIG.boss.headColorR : CONFIG.boss.headColorL);
    rect(beamX, laserOriginY - 1, beamW, 5, '#fff');
    rect(beamX, laserOriginY, beamW, 3, boss.head2Active && dir > 0 ? CONFIG.boss.headColorR : CONFIG.boss.headColorL);
  }
  if(boss.currentAttack === 'slam' && boss.attackFrame < 28){
    rect(ox - 50, oy + 1, 100, 2, 'rgba(255,234,0,.6)');
  }
  if(boss.currentAttack === 'fire' && boss.attackFrame < 18){
    const fireDir = boss.fireAimDir || dir;
    const fireOriginX = ox + fireDir * 24;
    const fireOriginY = oy - 47;
    rect(fireOriginX - 5, fireOriginY - 4, 10, 8, '#ff7e1a');
    rect(fireOriginX - 3, fireOriginY - 2, 6, 4, '#ffea00');
    rect(fireOriginX - fireDir * 8, fireOriginY - 1, 4, 3, '#ff2e88');
  }
  if(boss.y > 6){
    rect(ox - 26, oy + 2, 6, 8, '#ff7e1a');
    rect(ox + 20, oy + 2, 6, 8, '#ff7e1a');
    rect(ox - 25, oy + 8, 4, 8, '#ffea00');
    rect(ox + 21, oy + 8, 4, 8, '#ffea00');
  }

  if(boss.flash > 0){
    ctx.globalAlpha = boss.flash / 12;
    rect(ox - 32, oy - 58, 70, 60, '#fff');
    ctx.globalAlpha = 1;
  }
}
// ============================================================
// DIBUJO DE JEFES
// drawBoss despacha por boss.kind. Los jefes nuevos se disenan en
// coordenadas locales mirando a la IZQUIERDA (hacia los jugadores); el pintor
// los espeja cuando miran a la derecha. (0,0) es el pie del jefe.
// ============================================================
function shadeHex(hex, factor){
  const clean = safeHexColor(hex, '#808080').replace('#', '');
  const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean.slice(0, 6);
  const value = parseInt(full, 16) || 0;
  const channel = shift => clamp(Math.round(((value >> shift) & 255) * factor), 0, 255);
  return `#${[channel(16), channel(8), channel(0)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}
function bossPainter(ox, oy, dir){
  const R = (lx, ly, w, h, color) => {
    const ww = Math.round(w);
    const hh = Math.round(h);
    if(ww <= 0 || hh <= 0) return;
    const lxr = Math.round(lx);
    rect(dir < 0 ? ox + lxr : ox - lxr - ww, oy + Math.round(ly), ww, hh, color);
  };
  const L = (x0, y0, x1, y1, color, t = 2) => {
    const steps = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for(let s = 0; s <= steps; s++){
      R(x0 + (x1 - x0) * s / steps - t * 0.5, y0 + (y1 - y0) * s / steps - t * 0.5, t, t, color);
    }
  };
  const D = (lx, ly, r, color, squash = 1) => pixelDisc(dir < 0 ? ox + lx : ox - lx, oy + ly, r, color, squash);
  return { R, L, D };
}
// Paleta del jefe con blanco al recibir golpe y tonos apagados al morir.
function bossPaint(kind, pose){
  const base = bossColorsFor(kind);
  return key => {
    const color = base[key] || '#ff00ff';
    if(pose.dead) return shadeHex(color, 0.42);
    if(pose.flash && key !== 'eye') return '#ffffff';
    return color;
  };
}
// scale = tamaño en pantalla (bossSizeMul en el juego; la vista previa del
// editor dibuja a 1x).
function drawBoss(boss, x, y, scale = 1){
  if(scale !== 1){
    withSpriteScale(Math.floor(x), Math.floor(y), scale, () => drawBoss(boss, x, y, 1));
    return;
  }
  const kind = boss.kind && BOSS_TYPES[boss.kind] ? boss.kind : 'bakeneko';
  if(kind === 'bakeneko'){
    drawBakeNekoBoss(boss, x, y);
    return;
  }
  const ox = Math.floor(x);
  const oy = Math.floor(y);
  const lift = Math.max(0, boss.y || 0);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath();
  ctx.ellipse(ox, oy + (lift + 2) / spriteDrawScale(), Math.max(18, 40 - lift * 0.3), Math.max(3, 7 - lift * 0.04), 0, 0, TAU);
  ctx.fill();
  const pose = {
    dir:boss.facing >= 0 ? 1 : -1,
    dead:!!boss.dead,
    flash:boss.flash > 0,
    celebrating:boss.state === 'victory',
    phase2:!!boss.head2Active,
    attack:boss.dead ? null : bossAttackDef(boss),
    frame:boss.attackFrame || 0,
    t:game.time,
    anim:boss.hoverPhase || 0,
    chargeState:boss.chargeState || ''
  };
  if(kind === 'onigani') drawOniGaniBody(ox, oy, pose);
  else if(kind === 'tengu') drawTenguBody(ox, oy, pose);
  else if(kind === 'golem') drawGolemBody(ox, oy, pose);
  if(!boss.dead) drawBossAttackFx(boss, ox, oy, pose);
}
// Avisos y efectos genericos de ataque (rayo, golpe, embestida, onda).
function drawBossAttackFx(boss, ox, oy, pose){
  const attack = pose.attack;
  if(!attack) return;
  const f = pose.frame;
  const dir = pose.dir;
  const pal = bossColorsFor(boss.kind);
  if(attack.kind === 'beam'){
    const windup = attack.windup ?? 24;
    const activeEnd = attack.activeEnd ?? 56;
    const color = pal[attack.color] || '#ffffff';
    const bx = dir < 0 ? ox + (attack.originX ?? -20) : ox - (attack.originX ?? -20);
    const by = oy + (attack.originY ?? -40);
    if(f < windup){
      const grow = 2 + Math.round((f / windup) * 5);
      pixelDisc(bx, by, grow, color);
      pixelDisc(bx, by, Math.max(1, grow - 2), '#ffffff');
    } else if(f <= activeEnd){
      const beamX = dir < 0 ? 0 : bx;
      const beamW = dir < 0 ? Math.max(0, bx) : Math.max(0, W - bx);
      const wobble = (game.time % 4) < 2 ? 1 : 0;
      pixelDisc(bx, by, 5, color);
      rect(beamX, by - 3 - wobble, beamW, 7 + wobble * 2, '#ffffff');
      rect(beamX, by - 2, beamW, 5, color);
      rect(beamX, by - 1, beamW, 2, '#ffffff');
    }
  } else if(attack.kind === 'slam' && f < 28){
    // Marca del area real del pisoton: medidas del escenario, no del sprite.
    const k = spriteDrawScale();
    const radiusX = bossPhaseValue(boss, attack.radiusX, 110) / k;
    const groundSy = oy + ((boss.y || 0) + 1) / k;
    rect(ox - radiusX, groundSy, radiusX * 2, 2 / k, 'rgba(255,234,0,.6)');
  } else if(attack.kind === 'charge'){
    if(pose.chargeState === 'windup' && Math.floor(game.time / 5) % 2 === 0){
      rect(ox - 2, oy - 96, 4, 10, '#ffea00');
      rect(ox - 2, oy - 84, 4, 4, '#ffea00');
    }
    if(pose.chargeState === 'dash'){
      for(let k = 0; k < 4; k++){
        const sx = dir < 0 ? ox + 34 + k * 12 : ox - 34 - k * 12 - 16;
        rect(sx, oy - 40 + k * 9, 16, 1, 'rgba(255,255,255,.7)');
      }
    }
  } else if(attack.kind === 'wave' && f < (attack.windup ?? 22)){
    const k = spriteDrawScale();
    const groundSy = oy + (boss.y || 0) / k;
    const reach = (f / (attack.windup ?? 22)) * 60 / k;
    const start = 22 * bossSizeMul() / k;
    const sx = dir < 0 ? ox - start - reach : ox + start;
    rect(sx, groundSy, reach, 2 / k, 'rgba(255,255,255,.55)');
  }
}
function drawOniGaniBody(ox, oy, pose){
  const C = bossPaint('onigani', pose);
  const { R, L, D } = bossPainter(ox, oy, pose.dir);
  const p2 = pose.phase2;
  const attack = pose.attack;
  const cheer = pose.celebrating ? Math.round(Math.abs(Math.sin(pose.t * 0.2)) * 5) : 0;
  const by = pose.dead ? 8 : -cheer - Math.round(Math.abs(Math.sin(pose.anim * (p2 ? 7 : 5))) * 1.5);
  // Patas: tres por lado, con paso alternado.
  for(let i = 0; i < 3; i++){
    const step = pose.dead ? 0 : Math.round(Math.sin(pose.anim * (p2 ? 7 : 5) + i * 2.1) * 2);
    for(const side of [-1, 1]){
      const ax = side * (22 + i * 6);
      const kx = side * (34 + i * 6);
      const fx = side * (41 + i * 4);
      const ky = (pose.dead ? -8 : -27) + by - step;
      const fy = pose.dead ? -6 : 0;
      L(ax, -18 + by, kx, ky, C('shellDark'), 3);
      L(kx, ky, fx, fy, C('shellDark'), 2);
      R(fx - 1, fy - 1, 3, 1, C('claw'));
    }
  }
  // Caparazon en cupula con espinas.
  const top = -46 + by;
  for(let i = 0; i < 32; i++){
    const t = (i + 1) / 32;
    const half = Math.round(38 * Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t))));
    R(-half, top + i, half * 2, 1, i > 25 ? C('shellDark') : C('shell'));
  }
  R(-24, top + 5, 16, 2, C('claw'));
  R(-28, top + 9, 6, 2, C('claw'));
  for(let k = -3; k <= 3; k++){
    const edge = top + k * k;
    R(k * 9 - 1, edge - 3, 3, 3, C('shellDark'));
    R(k * 9, edge - 5, 1, 2, C('shellDark'));
  }
  R(-30, -18 + by, 60, 4, C('belly'));
  R(-26, -14 + by, 52, 2, C('shellDark'));
  // Boca: espuma en las burbujas, brillo del chorro al cargar.
  R(-22, -25 + by, 10, 3, '#2a0a06');
  R(-21, -25 + by, 1, 1, '#ffffff');
  R(-15, -25 + by, 1, 1, '#ffffff');
  if(attack && attack.kind === 'beam') R(-22, -25 + by, 10, 3, C('jet'));
  if(attack && attack.kind === 'volley'){
    D(-26, -30 + by + (pose.t % 12 < 6 ? 0 : -2), 2, C('jet'));
    D(-20, -33 + by, 1, '#ffffff');
  }
  // Fase 2: caparazon agrietado y nucleo latiendo.
  if(p2 && !pose.dead){
    L(-24, top + 6, -12, top + 16, C('shellDark'), 1);
    L(-12, top + 16, -16, top + 26, C('shellDark'), 1);
    L(10, top + 4, 18, top + 14, C('shellDark'), 1);
    L(18, top + 14, 12, top + 24, C('shellDark'), 1);
    const oldAlpha = ctx.globalAlpha;
    ctx.globalAlpha = oldAlpha * (0.55 + 0.45 * Math.sin(pose.t * 0.2));
    D(-2, top + 17, 8, C('core'));
    ctx.globalAlpha = oldAlpha;
    D(-2, top + 17, 3, '#ffffff');
  }
  // Ojos en pedunculos.
  const stalk = pose.dead ? 3 : 10 + (attack ? 2 : 0);
  for(const ex of [-12, 2]){
    R(ex + 1, top - stalk, 2, stalk, C('shellDark'));
    R(ex, top - stalk - 5, 5, 5, C('eye'));
    if(pose.dead){
      R(ex + 1, top - stalk - 4, 1, 1, '#000000');
      R(ex + 3, top - stalk - 2, 1, 1, '#000000');
    } else {
      R(ex, top - stalk - 3, 2, 2, '#000000');
    }
  }
  // Pinzas: la grande al frente. Suben al cargar la embestida y al festejar.
  const raise = pose.celebrating
    ? -10 + Math.round(Math.sin(pose.t * 0.25) * 4)
    : (attack && attack.kind === 'charge' && pose.chargeState === 'windup' ? -9 : 0);
  const open = pose.dead ? 0 : (attack ? 4 : Math.round((Math.sin(pose.t * 0.15) + 1) * 1.5));
  // Pinza = brazo + palma redonda + dos mandibulas curvas en "C".
  const pincer = (px0, py0, size, jawOpen, armFromX, armFromY, armWidth) => {
    L(armFromX, armFromY, px0 + size * 0.6, py0, C('shell'), armWidth);
    D(px0, py0, Math.round(size * 0.55), C('claw'));
    D(px0 + 1, py0 + 2, Math.round(size * 0.35), C('shellDark'));
    L(px0 - size * 0.3, py0 - size * 0.3, px0 - size * 1.1, py0 - size * 0.55 - jawOpen, C('claw'), Math.max(2, Math.round(size * 0.35)));
    L(px0 - size * 1.1, py0 - size * 0.55 - jawOpen, px0 - size * 1.45, py0 - size * 0.1 - jawOpen, C('claw'), 2);
    L(px0 - size * 0.3, py0 + size * 0.35, px0 - size * 1.0, py0 + size * 0.45 + jawOpen, C('shellDark'), Math.max(2, Math.round(size * 0.28)));
    R(px0 - size * 1.45, py0 - size * 0.1 - jawOpen, 2, 1, '#ffffff');
    R(px0 - size * 0.8, py0 - size * 0.25 - jawOpen, 1, 1, '#ffffff');
  };
  pincer(-52, -40 + by + raise, 12, open, -30, -28 + by, 4);
  pincer(46, -40 + by + raise, 7, Math.round(open * 0.5), 30, -28 + by, 3);
}
function drawTenguBody(ox, oy, pose){
  const C = bossPaint('tengu', pose);
  const { R, L, D } = bossPainter(ox, oy, pose.dir);
  if(pose.dead){
    R(-34, -12, 58, 10, C('plumage'));
    R(-30, -15, 22, 4, C('plumageLight'));
    R(-46, -15, 14, 12, C('plumage'));
    R(-48, -11, 10, 6, C('mask'));
    R(-56, -10, 8, 3, C('beak'));
    R(18, -8, 14, 6, C('metal'));
    L(4, -12, 30, -4, C('plumageLight'), 3);
    return;
  }
  const p2 = pose.phase2;
  const attack = pose.attack;
  const f = pose.frame;
  const flap = Math.sin(pose.anim * (p2 ? 6 : 3));
  const hop = !p2 && !pose.celebrating ? Math.round(Math.abs(Math.sin(pose.anim * 4)) * 1.5) : 0;
  const cheer = pose.celebrating ? Math.round(Math.abs(Math.sin(pose.t * 0.2)) * 5) : 0;
  const by = -hop - cheer;
  const wingRaise = attack && attack.kind === 'rain' ? -12 : 0;
  // Patas / propulsores.
  if(p2){
    R(-8, -16 + by, 3, 8, C('metal'));
    R(5, -16 + by, 3, 8, C('metal'));
    const jet = 4 + Math.round(Math.abs(Math.sin(pose.t * 0.5)) * 5);
    R(-9, -8 + by, 5, jet, C('glow'));
    R(4, -8 + by, 5, jet, C('glow'));
    R(-8, -8 + by, 3, Math.max(1, jet - 3), '#ffffff');
    R(5, -8 + by, 3, Math.max(1, jet - 3), '#ffffff');
  } else {
    R(-8, -16 + by, 3, 16 - by, C('metal'));
    R(6, -16 + by, 3, 16 - by, C('metal'));
    R(-13, -2, 9, 2, C('metal'));
    R(3, -2, 9, 2, C('metal'));
    R(-14, -1, 1, 1, C('beak'));
    R(2, -1, 1, 1, C('beak'));
  }
  // Alas: plegadas en tierra, desplegadas en vuelo o al festejar.
  if(p2 || pose.celebrating){
    // Ala abierta: borde de ataque claro (con brillo) y plumas primarias
    // escalonadas colgando de el; el aleteo sube y baja la punta.
    for(const side of [-1, 1]){
      const baseX = side * 12;
      const baseY = -46 + Math.round(wingRaise * 0.3);
      const tipX = side * 66;
      const tipY = -68 + Math.round(flap * 8) + wingRaise;
      for(let k = 6; k >= 0; k--){
        const t = k / 6;
        const ax = baseX + (tipX - baseX) * t;
        const ay = baseY + (tipY - baseY) * t;
        const len = 30 - k * 3;
        L(ax, ay + by, ax + side * 5, ay + by + len, k % 2 ? C('plumageLight') : C('plumage'), 6);
        R(ax + side * 5 - 1, ay + by + len, 3, 2, C('metal'));
      }
      L(baseX, baseY + by, tipX, tipY + by, C('plumageLight'), 3);
      L(baseX, baseY + by - 2, tipX, tipY + by - 2, C('glow'), 1);
    }
  } else {
    const thrust = attack && attack.kind === 'wave' ? (f < (attack.windup ?? 22) ? 6 : -14) : 0;
    const reach = attack && attack.kind === 'volley' ? -16 : 0;
    R(12, -50 + by + wingRaise, 11, 36, C('plumageLight'));
    for(let k = 0; k < 4; k++) R(13 + k * 2, -14 + by + wingRaise + k, 2, 3, C('plumage'));
    const wingX = -25 + thrust + reach;
    const wingW = 11 - reach;
    const wingH = 34 + (reach ? -18 : 0);
    const wingTop = -48 + by + wingRaise;
    R(wingX, wingTop, wingW, wingH, C('plumage'));
    R(wingX + 1, wingTop + 4, 1, wingH - 8, C('plumageLight'));
    // Borde aserrado de plumas.
    for(let k = 0; k * 4 < wingW; k++) R(wingX + k * 4, wingTop + wingH, 3, 2 + (k % 2) * 2, C('plumage'));
    if(reach){
      for(let k = 0; k < 4; k++) R(-40 + k * 3, -46 + by + k * 3, 3, 1, C('glow'));
    }
  }
  // Torso con coraza.
  R(-14, -48 + by, 28, 32, C('plumage'));
  R(-10, -42 + by, 20, 14, C('metal'));
  R(-8, -36 + by, 16, 1, C('glow'));
  R(-14, -18 + by, 28, 3, C('plumageLight'));
  // Cabeza: capucha, mascara roja, pico dorado y tokin.
  const angry = !!attack || pose.celebrating;
  R(-10, -64 + by, 20, 16, C('plumage'));
  R(-14, -60 + by, 14, 10, C('mask'));
  R(-11, -58 + by, 4, 2, angry ? C('glow') : C('eye'));
  R(-13, -60 + by, 6, 1, '#000000');
  R(-22, -55 + by, 9, 3, C('beak'));
  R(-26, -54 + by, 4, 2, C('beak'));
  R(-4, -70 + by, 8, 6, C('metal'));
  R(-2, -72 + by, 4, 2, C('metal'));
}
function drawGolemBody(ox, oy, pose){
  const C = bossPaint('golem', pose);
  const { R, L, D } = bossPainter(ox, oy, pose.dir);
  if(pose.dead){
    R(-42, -12, 30, 12, C('stoneDark'));
    R(-14, -20, 28, 20, C('stone'));
    R(12, -10, 30, 10, C('stoneDark'));
    R(-32, -22, 14, 10, C('stone'));
    R(-6, -26, 12, 6, C('stoneDark'));
    R(-2, -16, 6, 3, '#2a1a10');
    R(20, -14, 8, 4, C('moss'));
    return;
  }
  const p2 = pose.phase2;
  const attack = pose.attack;
  const f = pose.frame;
  const stepL = Math.round(Math.max(0, Math.sin(pose.anim * 5)) * 2);
  const stepR = Math.round(Math.max(0, -Math.sin(pose.anim * 5)) * 2);
  const cheer = pose.celebrating ? Math.round(Math.abs(Math.sin(pose.t * 0.15)) * 4) : 0;
  const by = -cheer;
  // Piernas-pilar y pies.
  R(-20, -26 + by, 14, 26 - stepL - by, C('stoneDark'));
  R(8, -26 + by, 14, 26 - stepR - by, C('stoneDark'));
  R(-24, -4 - stepL, 20, 4, C('stone'));
  R(4, -4 - stepR, 20, 4, C('stone'));
  // Brazos: colgando, en alto (lluvia / carga del golpe) o golpeando el suelo.
  const slam = attack && attack.kind === 'slam';
  const armsUp = (attack && attack.kind === 'rain') || (slam && f < 24) || pose.celebrating;
  const armsDown = slam && f >= 24 && f < 38;
  if(armsUp){
    const pump = pose.celebrating ? Math.round(Math.sin(pose.t * 0.3) * 4) : 0;
    R(-40, -94 + by + pump, 10, 34, C('stone'));
    R(-44, -104 + by + pump, 16, 12, C('stoneDark'));
    R(28, -92 + by - pump, 9, 32, C('stoneDark'));
    R(26, -102 + by - pump, 14, 11, C('stoneDark'));
  } else if(armsDown){
    L(-32, -56 + by, -54, -14, C('stone'), 8);
    R(-66, -12, 18, 12, C('stoneDark'));
    L(30, -56 + by, 48, -14, C('stoneDark'), 7);
    R(44, -12, 16, 12, C('stoneDark'));
  } else {
    const swing = Math.round(Math.sin(pose.anim * 5) * 2);
    R(-40, -58 + by, 10, 34, C('stone'));
    R(-44 + swing, -26 + by, 16, 12, C('stoneDark'));
    R(-42 + swing, -24 + by, 2, 2, C('stone'));
    R(28, -56 + by, 9, 32, C('stoneDark'));
    R(26 - swing, -26 + by, 14, 11, C('stoneDark'));
  }
  // Torso de bloques con musgo, runas (fase 1) o grietas de magma (fase 2).
  R(-26, -66 + by, 52, 42, C('stone'));
  R(14, -66 + by, 12, 42, C('stoneDark'));
  // Juntas de sillería: hileras de bloques desfasadas.
  for(let row = 0; row < 3; row++){
    const jy = -56 + row * 10 + by;
    R(-26, jy, 40, 1, C('stoneDark'));
    for(let col = 0; col < 3; col++) R(-22 + col * 14 + (row % 2) * 7, jy + 1, 1, 9, C('stoneDark'));
  }
  R(-26, -28 + by, 52, 4, C('stoneDark'));
  R(-24, -66 + by, 16, 3, C('moss'));

function drawBossGroundFx(){

function drawRoadLaneMarks(scroll, y, color, dashWidth, dashGap, thickness = 2){
  const step = dashWidth + dashGap;
  const offset = ((scroll % step) + step) % step;
  const startX = -offset - dashWidth;

    rect(Math.round(xx), Math.round(y), dashWidth, thickness, color);
  }

function hash01(seed){

  return value - Math.floor(value);

function drawCityStarField(gy, tints = ['#ffffff','#e6f7ff','#ffe8b8'], seedBase = 9000){
  const skyHeight = Math.max(26, Math.min(gy - 18, 96));
  const layers = [
    { factor:0.06, cell:74, tint:tints[0] },
    { factor:0.12, cell:56, tint:tints[1] },
    { factor:0.18, cell:44, tint:tints[2] }
  ];
  layers.forEach((layer, layerIdx) => {
    const parallax = game.cameraX * layer.factor;
    const startCell = Math.floor(parallax / layer.cell) - 3;
    const endCell = startCell + Math.ceil((W + layer.cell * 6) / layer.cell);
    for(let cell = startCell; cell <= endCell; cell++){
      const seed = seedBase + layerIdx * 997 + cell * 131;
      const sx = Math.floor(cell * layer.cell - parallax + hash01(seed) * layer.cell);
      const sy = 6 + Math.floor(hash01(seed + 19) * skyHeight);
      const size = 1 + Math.floor(hash01(seed + 37) * 3);
      const tintRoll = hash01(seed + 53);
      const color = tintRoll < 0.16 ? tints[2] : tintRoll < 0.32 ? tints[1] : layer.tint;
      rect(sx, sy, size, size, color);
      const twinkle = hash01(seed + (Math.floor(game.time / 10) % 23) * 17);
      if(size >= 2 && twinkle > 0.56){
        px(sx - 1, sy + Math.floor(size * 0.5), color);
        px(sx + size, sy + Math.floor(size * 0.5), color);
      }
      if(size >= 3 && twinkle > 0.72){
        px(sx + 1, sy - 1, color);
        px(sx + 1, sy + size, color);
      }
    }

function drawPixelFlame(x, y, scale = 1, hot = '#ffea00', warm = '#ff7e1a', core = '#fff'){

  const flicker = Math.sin(game.time * 0.24 + x * 0.03 + y * 0.05);
  const lift = Math.round(Math.max(0, flicker) * s);
  const flare = Math.round(Math.abs(Math.sin(game.time * 0.18 + x * 0.05)) * s);
  rect(x - 3 * s, y - 1 * s - lift, 6 * s + flare, 4 * s + lift, warm);
  rect(x - 2 * s, y - 4 * s - lift, 4 * s, 4 * s + lift, hot);
  rect(x - 1 * s, y - 7 * s - lift, 2 * s, 3 * s + flare, core);
  px(x, y - 8 * s - lift, core, s, s);

function drawMonsterShadow(x, y, phase = 0, color = '#120018', scale = 1){

  const bob = Math.sin(phase) * (1.5 * s);
  rect(x - 10 * s, y - 18 * s + bob, 20 * s, 16 * s, color);
  rect(x - 7 * s, y - 24 * s + bob, 14 * s, 8 * s, color);
  rect(x - 9 * s, y - 28 * s + bob, 4 * s, 4 * s, color);
  rect(x + 5 * s, y - 28 * s + bob, 4 * s, 4 * s, color);
  rect(x - 6 * s, y - 20 * s + bob, 3 * s, 2 * s, '#ff3030');

function drawWindowGrid(x, y, w, h, cols, rows, seedBase, colors = ['#ffea00','#00f0ff','#fff'], darkChance = 0.42){
  const insetX = 3;
  const insetY = 4;
  const stepX = Math.max(5, Math.floor((w - insetX * 2) / Math.max(1, cols)));
  const stepY = Math.max(6, Math.floor((h - insetY * 2) / Math.max(1, rows)));
  for(let row = 0; row < rows; row++){
    for(let col = 0; col < cols; col++){
      const seed = seedBase + row * 37 + col * 59;
      if(hash01(seed) < darkChance) continue;
      const ww = 2 + Math.floor(hash01(seed + 7) * 3);
      const hh = 3 + Math.floor(hash01(seed + 13) * 2);
      const wx = x + insetX + col * stepX + Math.floor(hash01(seed + 19) * 2);
      const wy = y + insetY + row * stepY + Math.floor(hash01(seed + 23) * 2);
      const tintRoll = hash01(seed + 29);
      const tint = tintRoll < 0.18 ? colors[2] : tintRoll < 0.48 ? colors[1] : colors[0];
      rect(wx, wy, ww, hh, tint);
      if(ww >= 3 && hh >= 4 && tintRoll > 0.72){
        rect(wx + 1, wy + 1, Math.max(1, ww - 2), Math.max(1, hh - 2), '#fff');
      }
    }
  }
}
function drawAttackAccent(x, y, seedBase, scale = 1){
  const phase = game.time * 0.055 + seedBase * 0.3;
  const flameShift = Math.sin(game.time * 0.12 + seedBase) * (1.5 * scale);
  const flameScale = scale * (0.9 + Math.abs(Math.sin(game.time * 0.19 + seedBase * 0.2)) * 0.45);
  if(hash01(seedBase + 1) > 0.28){
    drawPixelFlame(Math.round(x + flameShift), Math.round(y), flameScale, '#ffea00', '#ff6f1f', '#fff');
    if(hash01(seedBase + 2) > 0.64){
      drawPixelFlame(Math.round(x + 4 * scale - flameShift * 0.5), Math.round(y + 1), Math.max(1, flameScale - 1), '#ffea00', '#ff8a2a', '#fff');
    }
  }
  if(hash01(seedBase + 3) > 0.54){
    drawMonsterShadow(Math.round(x + Math.sin(phase) * (4 + scale * 3)), Math.round(y + 1), phase, '#14001f', 0.5);
  }
}

  // Stage sin scenery propio (config viejo / nivel importado): usar la
  // plantilla de su bg, cacheada para no generar objetos cada frame.
  if(!FALLBACK_SCENERY) FALLBACK_SCENERY = {};
  const key = stage && stage.bg ? stage.bg : 'desert';

    if(!color) return;

  const fallbackColors = ['#ff2e88','#00f0ff','#ffea00','#9b30ff','#00ff7f','#ffffff','#000000'];
  const source = isObject(CONFIG.paintTools) ? CONFIG.paintTools : {};
  const palettes = [];
  const seenIds = new Set();
  (Array.isArray(source.palettes) ? source.palettes : []).slice(0, 12).forEach((palette, idx) => {
    if(!isObject(palette)) return;
    let id = String(palette.id || `palette_${idx + 1}`).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 32) || `palette_${idx + 1}`;
    while(seenIds.has(id)) id = `${id}_${idx + 1}`.slice(0, 32);
    seenIds.add(id);
    palettes.push({
      id,
      name:String(palette.name || `PALETA ${idx + 1}`).trim().slice(0, 24) || `PALETA ${idx + 1}`,
      colors:sanitizeHexColorList(palette.colors, 32)
    });
  });
  if(!palettes.length){
    palettes.push({ id:'neon_base', name:'NEON BASE', colors:fallbackColors });
  }
  const activePaletteId = palettes.some(palette => palette.id === source.activePaletteId)
    ? source.activePaletteId
    : palettes[0].id;
  CONFIG.paintTools = {
    activeTool:source.activeTool === 'eyedropper' ? 'eyedropper' : 'brush',
    brushSize:clamp(Math.round(Number(source.brushSize) || 3), 1, 16),

function sanitizeDecorBrushStrokes(value){
  if(!Array.isArray(value)) return [];

    if(!stroke || !Array.isArray(stroke.points)) return null;
    const points = [];
    const limit = Math.min(stroke.points.length - (stroke.points.length % 2), 40000);
    for(let i = 0; i < limit; i += 2){
      const x = Math.round(Number(stroke.points[i]));
      const y = Math.round(Number(stroke.points[i + 1]));
      if(!Number.isFinite(x) || !Number.isFinite(y)) continue;
      // Y local de la capa: con yOff puede quedar fuera de 0..H-1 y seguir visible.
      points.push(clamp(x, -100000, 100000), clamp(y, -H, H * 2));
    }
    if(!points.length) return null;
    return { color:safeHexColor(stroke.color, '#ff2e88'), points };
  }).filter(Boolean);
}
// Sanea stage.scenery: tipos desconocidos fuera, numeros dentro de rango y
// colores hex validos (un JSON importado a mano no puede romper el render).
function sanitizeStageScenery(stage){
  if(!stage || !isObject(stage.scenery)) return;
  const sc = stage.scenery;
  if(!Array.isArray(sc.sky) || !sc.sky.length){
    sc.sky = defaultSceneryFor(stage.bg).sky;
  }
  sc.sky = sc.sky.slice(0, 6).map(stop => ({
    p: clamp(Number(stop && stop.p) || 0, 0, 1),
    c: safeHexColor(stop && stop.c, '#000000')

  sc.brushStrokes = sanitizeDecorBrushStrokes(sc.brushStrokes);
  sc.savedColors = sanitizeHexColorList(sc.savedColors, 48);
  // Migracion transparente: las configs anteriores guardaban luna y sombra
  // dentro de una sola capa. Al detectar ese formato, se crean dos capas
  // independientes conservando exactamente la posicion y forma clasicas.
  const migratedLayers = [];
  (Array.isArray(sc.layers) ? sc.layers : []).forEach(layer => {
    if(layer && layer.type === 'moon' && isObject(layer.colors) && layer.colors.shadow){
      const core = deepClone(layer);
      const radius = Math.max(2, Number(core.r) || 18);
      const shadowColor = core.colors.shadow;
      delete core.colors.shadow;
      migratedLayers.push(core);
      migratedLayers.push({
        type:'moon_shadow',
        on:core.on !== false,
        x:clamp((Number(core.x) || 0.85) - (radius * 0.8 / W), 0, 1),
        y:clamp((Number(core.y) || 36) - radius * 0.22, 0, 220),
        r:clamp(radius * 0.78, 4, 80),
        colors:{ shadow:shadowColor }

      return;
    }
    migratedLayers.push(layer);

    layer.yOff = def.ground ? 0 : clamp(Math.round(Number(layer.yOff) || 0), -200, 200);
    const zoneStart = Number(layer.zoneStart);

    layer.zoneStart = clamp(Number.isFinite(zoneStart) ? zoneStart : 0, 0, 1);
    layer.zoneEnd = clamp(Number.isFinite(zoneEnd) && layer.zoneEnd !== null ? zoneEnd : 1, layer.zoneStart, 1);
    if(def.scroll){
      const density = Number(layer.density);
      layer.density = clamp(Number.isFinite(density) && layer.density !== null ? density : (def.defaults.density ?? 1), 0.05, 1);
      layer.jitter = clamp(Number(layer.jitter) || 0, 0, 1);
      const px = Number(layer.px);

      layer.gap = clamp(Math.round(Number(layer.gap) || def.defaults.gap || 100), 12, 900);
      const scale = Number(layer.scale);
      layer.scale = clamp(Number.isFinite(scale) && scale > 0 ? scale : 1, 0.25, 4);

    });
    layer.colors = isObject(layer.colors) ? layer.colors : {};
    Object.keys(def.colors || {}).forEach(key => {
      layer.colors[key] = safeHexColor(layer.colors[key], def.defaults.colors[key]);

function skyStopColorAt(list, t){
  if(!list.length) return [0, 0, 0];
  if(t <= list[0].p) return list[0].rgb;
  for(let i = 1; i < list.length; i++){
    if(t <= list[i].p){
      const a = list[i - 1];
      const b = list[i];
      const f = b.p > a.p ? (t - a.p) / (b.p - a.p) : 0;
      return [0, 1, 2].map(k => a.rgb[k] + (b.rgb[k] - a.rgb[k]) * f);
    }
  }

// Degradado pixel-art: bandas de 6 px cuyo borde se funde con trama Bayer,
// como los cielos pintados de los arcades de 16 bits.
function ditheredSkyCanvas(stops, gy){
  const height = Math.max(1, Math.round(gy));
  const key = `${height}|${JSON.stringify(stops)}`;
  let sky = DECOR_SKY_CACHE.get(key);
  if(sky) return sky;
  const list = (Array.isArray(stops) ? stops : [])
    .filter(Boolean)
    .map(stop => {
      const hex = shadeHex(safeHexColor(stop.c, '#000000'), 1);
      const num = parseInt(hex.slice(1), 16);
      return { p:clamp(Number(stop.p) || 0, 0, 1), rgb:[(num >> 16) & 255, (num >> 8) & 255, num & 255] };
    })
    .sort((a, b) => a.p - b.p);
  sky = document.createElement('canvas');
  sky.width = W;
  sky.height = height;
  const sctx = sky.getContext('2d');
  const image = sctx.createImageData(W, height);
  const data = new Uint32Array(image.data.buffer);
  const band = 6;
  for(let y = 0; y < height; y++){
    const y0 = Math.floor(y / band) * band;
    const top = skyStopColorAt(list, y0 / height);
    const bottom = skyStopColorAt(list, Math.min(1, (y0 + band) / height));
    const f = (y - y0) / band;
    const pack = rgb => 0xff000000 | (Math.round(rgb[2]) << 16) | (Math.round(rgb[1]) << 8) | Math.round(rgb[0]);
    const cTop = pack(top);
    const cBottom = pack(bottom);
    for(let x = 0; x < W; x++){
      data[y * W + x] = HD_BAYER4[(y & 3) * 4 + (x & 3)] / 16 < f ? cBottom : cTop;
    }

  sctx.putImageData(image, 0, 0);

  return sky;
}

    const top = Math.round(b * bandH);
    const bottom = Math.round((b + 1) * bandH);

    if(inner < 3) continue;
    const t = (b + 0.5) / GROUND_DETAIL_BANDS;
    const size = 1 + Math.round(t * 2);
    // Profundidad: bruma clara cerca del horizonte, sombra al frente.

    }

    for(let k = 0; k < features; k++){
      const p = pick();
      const roll = rnd();

        if(roll < 0.45){

          rect(p.x, p.y, len, 1, light);
          rect(p.x + 1, p.y + 1, len - 1, 1, dark);

          rect(p.x, p.y, size + 1, size, dark);

          }

          ctx.globalAlpha = 1;
        } else {
          rect(p.x, p.y, size, 1, light);
        }
      } else if(kind === 'neon'){
        if(roll < 0.25){
          ctx.globalAlpha = 0.5;
          px(p.x, p.y, rnd() < 0.5 ? (c.dashA || '#00f0ff') : (c.dashB || '#ff2e88'));
          ctx.globalAlpha = 1;
        } else {
          rect(p.x, p.y, 2 + size, 1, dark);
        }
      } else if(kind === 'grass'){
        const blade = rnd() < 0.5 ? (c.detail || light) : shadeHex(c.detail || base, 0.75);
        if(roll < 0.12){
          const bloom = ['#ffffff', '#ffe066', '#ff8fb1', '#b8a8ff'][Math.floor(rnd() * 4)];
          px(p.x, p.y, bloom);
          px(p.x + 1, p.y + 1, bloom);
          px(p.x - 1, p.y + 1, bloom);
          px(p.x, p.y + 1, '#ffd23a');
        } else if(roll < 0.2){
          ctx.globalAlpha = 0.4;
          rect(p.x, p.y, 4 + size * 2, size, shadeHex(base, 0.6));
          ctx.globalAlpha = 1;
        } else {
          for(let bl = 0; bl < 2 + size; bl++) rect(p.x + bl * 2, p.y - bl % 2, 1, 1 + size, blade);
        }
      } else if(kind === 'jungle'){
        if(roll < 0.5){
          const leaf = rnd() < 0.5 ? (c.leaf || light) : shadeHex(c.leaf || base, 0.7);
          rect(p.x, p.y, 2 + size, Math.max(1, size - 1) + 1, leaf);
          px(p.x + 1 + size, p.y, shadeHex(leaf, 0.6));
        } else if(roll < 0.7){
          rect(p.x, p.y, 5 + size * 2, 1, c.root || dark);
        } else {
          ctx.globalAlpha = 0.35;
          rect(p.x, p.y, 3 + size * 2, size, deep);
          ctx.globalAlpha = 1;
        }
      } else if(kind === 'metal'){
        if(roll < 0.45){
          px(p.x, p.y, light);
          px(p.x, p.y + 1, deep);
        } else if(roll < 0.7){
          for(let s = 0; s < 3 + size * 2; s++) px(p.x + s, p.y - Math.floor(s / 3), light);
        } else {

          rect(p.x, p.y, 4 + size * 2, size, deep);

}

// ---- Primitivas pixel-art de los elementos de mundo ----
// Disco por filas enteras (sin antialias). squash < 1 lo aplana en vertical.
function pixelDisc(cx, cy, r, color, squash = 1){
  const radius = Math.max(0, Math.round(r));
  const x0 = Math.round(cx);
  const y0 = Math.round(cy);
  ctx.fillStyle = color;
  if(radius <= 0){ fillPixels(x0, y0, 1, 1); return; }
  const rows = Math.max(1, Math.round(radius * squash));
  for(let dy = -rows; dy <= rows; dy++){
    const t = dy / rows;
    const half = Math.round(radius * Math.sqrt(Math.max(0, 1 - t * t)));
    fillPixels(x0 - half, y0 + dy, half * 2 + 1, 1);
  }
}
// Media cupula apoyada en baseY (mitad superior de un disco). squash = alto/radio.
function pixelDome(cx, baseY, r, color, squash = 1){
  const radius = Math.max(1, Math.round(r));
  const rows = Math.max(1, Math.round(radius * squash));
  const x0 = Math.round(cx);
  const y0 = Math.round(baseY);
  ctx.fillStyle = color;
  for(let dy = 0; dy < rows; dy++){
    const t = dy / rows;
    const half = Math.round(radius * Math.sqrt(Math.max(0, 1 - t * t)));
    fillPixels(x0 - half, y0 - dy - 1, half * 2 + 1, 1);
  }
}
// Triangulo por filas: mitad izquierda con luz, derecha con sombra (pinos, conos).

  const rows = Math.max(1, Math.round(height));
  const x0 = Math.round(cx);
  const y0 = Math.round(topY);
  for(let i = 0; i < rows; i++){
    const half = Math.max(0, Math.round(halfBase * (i + 1) / rows));
    ctx.fillStyle = color;
    fillPixels(x0 - half, y0 + i, half + 1, 1);
    if(half > 0){
      ctx.fillStyle = shade || color;
      fillPixels(x0 + 1, y0 + i, half, 1);
    }
  }

// Fronda (palmeras, helechos): arco que sube `rise` y cae `droop` a lo largo

function drawDecorFrond(x0, y0, dir, len, rise, droop, color, leafColor, leafLen){
  const steps = Math.max(3, Math.round(Math.max(len, rise)));

  let prevY = Math.round(y0);
  for(let k = 1; k <= steps; k++){
    const t = k / steps;
    const x = Math.round(x0 + dir * len * t);
    const y = Math.round(y0 - rise * t + droop * t * t);
    rect(Math.min(prevX, x), Math.min(prevY, y), Math.abs(x - prevX) + 1, Math.abs(y - prevY) + 1, color);
    if(leafLen > 0 && k % 2 === 0 && t > 0.15){
      rect(x, y + 1, 1, Math.max(1, Math.round(leafLen * (1 - t * 0.6))), leafColor);
    }
    prevX = x;
    prevY = y;
  }

// ---- Cache de sprites por elemento ----
// Los elementos de mundo (arboles, pinos, edificios...) cuestan cientos de

// de la capa (tipo, escala, variacion, fx, params y colores) con la seed de la

  const scratch = HD_SCENERY_SCRATCH.canvas;
  if(scratch.width < w || scratch.height < h){
    scratch.width = Math.max(scratch.width, w);
    scratch.height = Math.max(scratch.height, h);

function decorStyleKey(layer){

  if(!sprite){

    sprite.width = Math.max(1, Math.ceil(w));
    sprite.height = Math.max(1, Math.ceil(h));

  for(let lane = 0; lane < 2; lane++){
    const t = game.time + lane * Math.round(period * 0.5);
    const slot = Math.floor(t / period);
    const age = t - slot * period;

    if(age > life) continue;
    const seed = (Math.round(Number(layer.seed)) || 0) + slot * 97 + lane * 1013;
    if(hash01(seed) > 0.8) continue;
    const speed = 4 + hash01(seed + 7) * 3;
    const hx = Math.round(W * (0.3 + hash01(seed + 3) * 0.7) - age * speed);
    const hy = Math.round(6 + hash01(seed + 5) * skyH * 0.5 + age * speed * 0.45);

    rect(0, pathY, W, pathW, c.path);
    rect(0, pathY, W, 1, c.pathEdge);
    rect(0, pathY + pathW - 1, W, 1, c.pathEdge);
    forEachGroundCell(game.cameraX * 0.9, 23, (x, cell) => {
      if(hash01(cell * 71) > 0.6) return;
      px(x + Math.round(hash01(cell * 71 + 3) * 20), pathY + 2 + Math.round(hash01(cell * 71 + 5) * Math.max(1, pathW - 4)), c.pathEdge, 2, 1);
    });
  }
  forEachGroundRow(gy, 6, (y, t, r) => {
    if(pathW > 0 && y >= pathY - 1 && y <= pathY + pathW + 3) return;
    forEachGroundCell(game.cameraX * (0.55 + t * 0.55), 15 + r * 3, (x, cell) => {
      const seed = cell * 53 + r * 977;
      if(hash01(seed) > 0.5) return;
      const bx = x + Math.round(hash01(seed + 3) * 12);
      const hgt = 1 + Math.floor(hash01(seed + 5) * (2 + r * 0.6));
      rect(bx, y - hgt, 1, hgt, c.detail);
      px(bx - 1, y - 1, c.detail);
      if(hgt > 2) px(bx + 1, y - 2, c.detail);
    });
  });
}
function drawDecorGroundJungle(layer, gy){
  const c = layer.colors || {};
  const groundH = H - gy;
  rect(0, gy, W, groundH, c.base);
  rect(0, gy + Math.round(groundH * 0.6), W, groundH, c.low);
  drawDecorGroundDetail(layer, gy, 'jungle');
  rect(0, gy, W, 2, c.line);
  forEachGroundCell(game.cameraX, 9, (x, cell) => {
    const drip = 1 + Math.floor(hash01(cell * 29) * 4);
    rect(x, gy + 2, 2 + Math.floor(hash01(cell * 29 + 1) * 4), drip, c.line);
  });
  forEachGroundRow(gy, 6, (y, t, r) => {
    forEachGroundCell(game.cameraX * (0.55 + t * 0.55), 26 + r * 4, (x, cell) => {
      const seed = cell * 61 + r * 811;
      const roll = hash01(seed);
      const bx = x + Math.round(hash01(seed + 3) * 18);
      if(roll < 0.35){
        rect(bx, y, 3, 1, c.leaf);
        px(bx + 1, y - 1, c.leaf);
      } else if(roll < 0.5){
        const len = 8 + Math.round(hash01(seed + 5) * 14);
        rect(bx, y, len, 1, c.root);
        px(bx + len, y - 1, c.root);
        px(bx - 1, y + 1, c.root);
      } else if(roll < 0.58 && r > 1){
        const pw = 10 + Math.round(hash01(seed + 7) * 12);
        rect(bx, y - 1, pw, 3, c.puddle);
        rect(bx + 2, y, pw - 4, 1, c.base);
        px(bx + 2 + Math.floor(game.time / 20 + cell) % Math.max(1, pw - 4), y - 1, c.leaf);
      }
    });
  });
}
function drawDecorGroundMetal(layer, gy){
  const c = layer.colors || {};
  const groundH = H - gy;
  rect(0, gy, W, groundH, c.base);
  rect(0, gy + Math.round(groundH * 0.55), W, groundH, c.low);
  drawDecorGroundDetail(layer, gy, 'metal');
  rect(0, gy, W, 1, c.line);
  // Franja de peligro diagonal bajo el borde.
  const stripeH = Math.max(3, Math.min(6, Math.round(groundH * 0.06)));
  const scrollA = Math.round(game.cameraX * 0.9);
  for(let row = 0; row < stripeH; row++){
    const off = (((scrollA - row) % 12) + 12) % 12;
    for(let x = -off - 12; x < W + 12; x += 12){
      rect(x, gy + 1 + row, 6, 1, c.hazardA);
      rect(x + 6, gy + 1 + row, 6, 1, c.hazardB);
    }
  }
  // Placas: juntas horizontales por franja y verticales con parallax.
  forEachGroundRow(gy, 5, (y, t, r) => {
    rect(0, y + 2, W, 1, c.seam);
    forEachGroundCell(game.cameraX * (0.55 + t * 0.55), 34 + r * 6, (x, cell) => {
      rect(x, y + 3, 1, Math.max(4, Math.round((H - gy) / 5) - 2), c.seam);
      px(x + 2, y + 4, c.line);
      px(x - 3, y + 4, c.line);
      if(hash01(cell * 37 + r * 101) > 0.72){
        const on = Math.floor(game.time / 18 + cell + r) % 3 !== 0;
        rect(x + 8, y + 5, 4, 1, on ? c.light : c.seam);
      }
    });
  });
}

function drawStageBackground(){
  const stage = stageCfg();
  const gy = groundY();
  const scenery = stageSceneryData(stage);
  // Look del nivel (mañana/tarde/noche). null = escena base: mismo render de siempre.
  const look = stageLevelLook(stage, renderLevelIndex());
  if(!look){
    drawDecorSky(scenery.sky, gy);
    drawDecorBrushStrokes(scenery, 0);
    for(const layer of scenery.layers) drawDecorLayer(layer, gy);
    return;
  }
  drawDecorSky(look.sky || scenery.sky, gy);
  drawDecorBrushStrokes(scenery, 0, look.grade);
  // Capas extra del momento (estrellas, luna, nubes...) detras del escenario,
  // solo si el mundo no trae ya una capa visible de ese tipo.
  for(const extra of look.extras){
    if(scenery.layers.some(layer => layer.type === extra.type && layer.on !== false)) continue;
    drawDecorLayer(extra, gy);
  }
  for(const layer of scenery.layers){
    if(look.hide.has(layer.type)) continue;
    drawDecorLayer(lookDecorLayer(layer, look), gy, layer);
  }
}

  CONFIG.boss.colors = isObject(CONFIG.boss.colors) ? CONFIG.boss.colors : {};

  CONFIG.players.forEach((player, idx) => {
    player.sizeScale = playerScaleForChar(player);
    sanitizeMechaLook(player, idx);
  });
  // Colores de detalle de enemigos: completa claves faltantes con los
  // defaults del sprite y valida hex (configs viejas se ven identicas).
  Object.keys(CONFIG.enemies).forEach(key => {
    const enemyCfg = CONFIG.enemies[key];
    if(!enemyCfg) return;
    const spriteDef = ENEMY_SPRITE_COLORS[resolveEnemySprite(enemyCfg.sprite || key)] || ENEMY_SPRITE_COLORS.small;
    enemyCfg.color = safeHexColor(enemyCfg.color, '#ff5555');

    sanitizeStageLevels(stage);

    waveLists.forEach(list => {

        if(typeof wave.x === 'number' && wave.x > stage.length){

    sanitizeStageScenery(stage);

  if(clampedWaves > 0){

      const ratio = player.maxHp > 0 ? clamp(player.hp / player.maxHp, 0, 1) : 1;
      player.char = CONFIG.players[player.charIdx];
      player.maxHp = player.char.hp;
      player.hp = player.hp <= 0 ? 0 : clamp(Math.max(1, Math.round(player.maxHp * ratio)), 1, player.maxHp);

function makeSection(title){
  const section = document.createElement('div');
  section.className = 'cfg-section';
  const heading = document.createElement('h3');
  heading.textContent = title;
  section.appendChild(heading);
  return section;
}
function appendRow(section, row){
  section.appendChild(row);
  return row;
}
function rangeRow(section, labelText, object, key, min, max, step = 1){
  const row = document.createElement('div');
  row.className = 'cfg-row';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;
  input.value = object[key];
  const value = document.createElement('div');
  value.className = 'val';
  value.textContent = object[key];
  input.addEventListener('input', () => {
    object[key] = parseFloat(input.value);
    value.textContent = input.value;
    applyConfigToLiveGame();
  });
  row.append(label, input, value);
  appendRow(section, row);
}

function appendMechaPreview(card, idx){
  const canvasEl = document.createElement('canvas');
  canvasEl.width = 132;
  canvasEl.height = 66;
  canvasEl.style.cssText = 'width:264px;max-width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;background:#0a0f1c;border:1px solid #223;display:block;margin:4px 0 8px';
  card.appendChild(canvasEl);
  const pctx = canvasEl.getContext('2d', { willReadFrequently:true });
  const redraw = () => {
    const char = CONFIG.players[idx];
    if(!char) return;
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    const oldCtx = ctx;
    ctx = pctx;
    try {
      drawMechaHD(38, 62, char, 1, 0, 'idle', 0);
      drawMechaHDFront(98, 62, char, 0);
    } finally {
      ctx = oldCtx;
    }
    const image = pctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
    hdEnhanceSprite(image, MECHA_HD_PASS);
    pctx.putImageData(image, 0, 0);
  };
  redraw();
  card.addEventListener('input', () => requestAnimationFrame(redraw));
  card.addEventListener('change', () => requestAnimationFrame(redraw));
}

// Geometria jugable (horizonte y carriles) que heredan los niveles nuevos:
// la del primer nivel del pool, asi un mundo recien creado se juega igual que
// el resto del show aunque este tenga carriles propios. Sin pool, la plantilla.
function stageGeometryReference(tpl){
  const ref = CONFIG.stages && CONFIG.stages[0];
  if(ref && Number.isFinite(Number(ref.groundRatio)) && Number.isFinite(Number(ref.laneMinZ)) && Number.isFinite(Number(ref.laneMaxZ))){
    return { groundRatio:Number(ref.groundRatio), laneMinZ:Number(ref.laneMinZ), laneMaxZ:Number(ref.laneMaxZ) };
  }
  return { groundRatio:tpl.groundRatio, laneMinZ:tpl.lanes[0], laneMaxZ:tpl.lanes[1] };
}
// Crea un nivel nuevo del pool a partir de una plantilla de mundo.
function createStageFromTemplate(bg, name){
  const tpl = worldTemplate(bg);
  const idx = CONFIG.stages.length;
  const geometry = stageGeometryReference(tpl);
  return {
    name:String(name || '').trim().slice(0, 24) || `NIVEL ${idx + 1}`,
    tag:`STAGE ${idx + 1} - ${tpl.label}`,
    bg:tpl.id,
    length:1200,
    groundRatio:geometry.groundRatio,
    waves:[
      { x:150, enemies:[['small',3]] },
      { x:500, enemies:[['small',2],['thrower',1]] },
      { x:900, enemies:[['big',1],['small',2]] }
    ],
    waveEnemyBonus:0,
    laneMinZ:geometry.laneMinZ,
    laneMaxZ:geometry.laneMaxZ,
    spawnLimit:12,
    spawnWindowSeconds:18,
    scenery: defaultSceneryFor(tpl.id)
  };
}
// Agrega al pool, una sola vez por config, los mundos incluidos (bosque,
// jungla, base espacial). CONFIG.worldSeeds NO existe en DEFAULT_CONFIG a
// proposito: asi deepMerge no lo rellena y sirve de marca persistente; si el
// usuario borra uno de estos niveles, no vuelve a aparecer. Cuando los tres
// entran juntos se crea ademas un set con ellos (el Bake-Neko cierra en la base).
function seedBuiltinWorlds(){
  const seeded = Array.isArray(CONFIG.worldSeeds)
    ? CONFIG.worldSeeds.filter(id => typeof id === 'string').slice(0, 32)
    : [];
  const added = [];
  BUILTIN_WORLD_IDS.forEach(id => {
    if(seeded.includes(id)) return;
    seeded.push(id);
    if(CONFIG.stages.some(stage => stage && stage.worldId === id)) return;
    const stage = createBuiltinWorldStage(id);
    if(!stage) return;
    Object.assign(stage, stageGeometryReference(worldTemplate(id)));
    CONFIG.stages.push(stage);
    added.push(CONFIG.stages.length - 1);
  });
  CONFIG.worldSeeds = seeded;
  if(added.length === BUILTIN_WORLD_IDS.length){
    CONFIG.stageGroups = isObject(CONFIG.stageGroups) ? CONFIG.stageGroups : {};
    if(!Array.isArray(CONFIG.stageGroups.groups)) CONFIG.stageGroups.groups = [];
    const groups = CONFIG.stageGroups.groups;
    let letter = groups.length;
    const nameFor = n => `SET ${String.fromCharCode(65 + (n % 26))}`;
    for(let tries = 0; tries < 26 && groups.some(group => group && group.name === nameFor(letter)); tries++) letter++;
    groups.push({ name:nameFor(letter), stages:added.slice(0, 3) });
  }
  return added;
}

function enemyDisplayName(type){
  const cfg = CONFIG.enemies[type];
  return (cfg && cfg.name) || String(type || '').toUpperCase();
}
// Opciones de tipo de enemigo agrupadas: clasicos y bestiario de cada mundo.
function enemyTypeOptions(){
  const worldRank = {};
  WORLD_TEMPLATES.forEach((tpl, idx) => { worldRank[tpl.id] = { rank:idx + 1, label:tpl.label }; });
  return Object.keys(CONFIG.enemies).map((type, order) => {
    const cfg = CONFIG.enemies[type] || {};
    const world = cfg.world && worldRank[cfg.world];
    return {
      value:type,
      label:enemyDisplayName(type),
      group:world ? `BESTIARIO · ${world.label}` : 'CLASICOS / PROPIOS',
      rank:world ? world.rank : 0,
      order
    };
  }).sort((a, b) => a.rank - b.rank || a.order - b.order);
}

function levelMiniSelect(options, value, onChange){
  const select = document.createElement('select');
  select.style.background = '#000';
  select.style.color = '#00f0ff';
  select.style.border = '1px solid rgba(0,240,255,.5)';
  select.style.padding = '3px';
  let groupName = null;
  let groupEl = null;
  options.forEach(opt => {
    const optionEl = document.createElement('option');
    optionEl.value = opt.value;
    optionEl.textContent = opt.label;
    if(String(opt.value) === String(value)) optionEl.selected = true;
    if(opt.group){
      if(opt.group !== groupName){
        groupEl = document.createElement('optgroup');
        groupEl.label = opt.group;
        select.appendChild(groupEl);
        groupName = opt.group;
      }
      groupEl.appendChild(optionEl);
    } else {
      select.appendChild(optionEl);
    }
  });
  select.addEventListener('change', () => onChange(select.value));
  return select;
}
