<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechaKatz — CONFIG</title>
<!-- ============================================================
ARCHIVO GENERADO por build_config_editor.js a partir de
mechakatz_vs_kaiju_V9.html (bloques extraidos literalmente).
NO editar a mano: tras cambiar el panel CONFIG del juego, regenerar con
  node build_config_editor.js
La config se comparte con el juego via localStorage (mechakatz_config_v9);
el juego abierto en el mismo navegador aplica los cambios en vivo.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0014;
    --pink:#ff2e88;
    --cyan:#00f0ff;
    --yellow:#ffea00;
    --purple:#9b30ff;
    --green:#00ff7f;
    --red:#ff4040;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--cyan);
    font-family:'VT323',monospace;
  }
  #config-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(3px);
  }
  #config-modal.show{display:flex}
  #config-box{
    position:relative;
    width:min(980px,95vw);
    height:min(700px,92vh);
    display:grid;
    grid-template-rows:auto 1fr auto;
    background:linear-gradient(145deg,#0e0024 0%,#1a0040 100%);
    border:2px solid var(--pink);
    box-shadow:0 0 60px rgba(255,46,136,.55),inset 0 0 0 1px rgba(0,240,255,.12);
  }
  #config-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 22px;
    border-bottom:1px solid rgba(255,46,136,.4);
  }
  #config-head h2{
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:13px;
    text-shadow:2px 2px 0 var(--pink);
  }
  #config-head .sub{
    margin-left:auto;
    margin-right:34px;
    color:var(--cyan);
    opacity:.72;
    font-size:14px;
  }
  #config-body{
    display:grid;
    grid-template-columns:170px 1fr;
    overflow:hidden;
  }
  #config-tabs{
    overflow-y:auto;
    padding:10px 0;
    border-right:1px solid rgba(255,46,136,.3);
    background:rgba(0,0,0,.35);
  }
  #config-tabs button{
    display:block;
    width:100%;
    padding:10px 16px;
    border:none;
    border-left:3px solid transparent;
    background:none;
    color:var(--cyan);
    cursor:pointer;
    text-align:left;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    letter-spacing:.5px;
  }
  #config-tabs button:hover{background:rgba(255,46,136,.15);color:var(--yellow)}
  #config-tabs button.active{background:rgba(255,46,136,.24);color:var(--yellow);border-left-color:var(--pink)}
  #config-content{
    overflow-y:auto;
    padding:18px 24px;
    color:#dcdcff;
    font-size:16px;
  }
  #config-content::-webkit-scrollbar,
  #config-tabs::-webkit-scrollbar{width:8px}
  #config-content::-webkit-scrollbar-track,
  #config-tabs::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
  #config-content::-webkit-scrollbar-thumb,
  #config-tabs::-webkit-scrollbar-thumb{background:var(--pink);border:1px solid #000}
  #config-foot{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:10px;
    padding:12px 22px;
    border-top:1px solid rgba(255,46,136,.4);
    background:rgba(0,0,0,.35);
  }
  #config-foot button{
    padding:8px 14px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
  }
  #config-foot button:hover{background:var(--cyan);color:#000}
  #config-foot .danger{border-color:var(--red);color:var(--red)}
  #config-foot .danger:hover{background:var(--red);color:#000}
  #config-foot .primary{border-color:var(--green);color:var(--green)}
  #config-foot .primary:hover{background:var(--green);color:#000}

  .cfg-section{
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(0,240,255,.18);
  }
  .cfg-section:last-child{border-bottom:none}
  .cfg-section h3{
    margin-bottom:10px;
    color:var(--pink);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .cfg-section h4{
    margin:12px 0 6px;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    text-transform:uppercase;
  }
  .cfg-row{
    display:grid;
    grid-template-columns:200px 1fr 72px;
    gap:10px;
    align-items:center;
    padding:5px 0;
  }
  .cfg-row label{color:#bbe4ff;font-size:14px}
  .cfg-row input[type=range]{width:100%;accent-color:var(--pink)}
  .cfg-row input[type=number],
  .cfg-row input[type=text],
  .cfg-row select{
    width:100%;
    padding:4px 6px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:14px;
  }
  .cfg-row input[type=color]{
    width:44px;
    height:26px;
    padding:0;
    border:1px solid var(--cyan);
    background:#000;
    cursor:pointer;
  }
  .cfg-row .val{text-align:right;color:var(--yellow);font-size:14px}
  .cfg-row.bool{grid-template-columns:200px 1fr}
  .cfg-row.bool input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
  .cfg-row.text{grid-template-columns:200px 1fr}
  .cfg-row.color-row{grid-template-columns:200px auto 1fr}
  .cfg-row.color-row .hex{font-size:13px;color:#9aa1c1}
  .cfg-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
  }
  .cfg-card{
    padding:12px;
    border:1px solid rgba(0,240,255,.2);
    background:rgba(0,0,0,.35);
  }
  .cfg-note{color:#9aa1c1;font-size:14px;line-height:1.2}
  .cfg-button{
    background:rgba(0,240,255,.12);
    color:#00f0ff;
    border:1px solid rgba(0,240,255,.4);
    padding:6px 12px;
    font-family:Consolas,monospace;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.04em;
  }
  .cfg-button:hover{background:rgba(0,240,255,.22)}

  .paint-tool-panel{
    display:grid;
    gap:8px;
    margin:8px 0 12px;
    padding:10px;
    border:1px solid rgba(255,46,136,.35);
    background:rgba(0,0,0,.28);
  }
  .paint-tool-line{
    display:grid;
    grid-template-columns:150px minmax(0,1fr);
    gap:10px;
    align-items:center;
  }
  .paint-tool-label{color:#bbe4ff;font-size:14px}
  .paint-tool-actions,
  .paint-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:center;
  }
  .paint-tool-actions input[type=text],
  .paint-tool-actions select{
    min-width:130px;
    flex:1;
    padding:5px 7px;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:15px;
  }
  .paint-tool-btn{
    min-height:28px;
    padding:5px 9px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .paint-tool-btn:hover,
  .paint-tool-btn.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,234,0,.1)}
  .paint-color-swatch{
    position:relative;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid rgba(255,255,255,.5);
    outline:1px solid #000;
    cursor:pointer;
  }
  .paint-color-swatch.active{outline:2px solid var(--yellow);outline-offset:1px}
  .paint-swatch-item{position:relative;display:inline-flex}
  .paint-swatch-remove{
    position:absolute;
    top:-5px;
    right:-5px;
    width:13px;
    height:13px;
    padding:0;
    border:1px solid var(--pink);
    border-radius:50%;
    background:#000;
    color:var(--pink);
    cursor:pointer;
    font:10px/10px Arial,sans-serif;
  }
  .paint-world-count{color:#777d9b;font-size:12px}

  .decor-layer-viewer{
    position:fixed;
    inset:0;
    z-index:60;
    display:grid;
    place-items:center;
    padding:18px;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(4px);
  }
  .decor-layer-viewer-shell{
    width:min(1440px,98vw);
    height:min(900px,96vh);
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr) auto;
    overflow:hidden;
    border:2px solid var(--cyan);
    background:#080014;
    box-shadow:0 0 50px rgba(0,240,255,.32),inset 0 0 0 1px rgba(255,46,136,.25);
  }
  .decor-layer-viewer-head{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
    padding:12px 14px;
    border-bottom:1px solid rgba(0,240,255,.35);
    background:#110026;
  }
  .decor-layer-viewer-head h3{
    min-width:0;
    overflow:hidden;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .decor-layer-viewer-meta{
    margin-left:auto;
    color:#9aa1c1;
    font-size:14px;
    white-space:nowrap;
  }
  .decor-layer-viewer-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    align-items:center;
    padding:9px 12px;
    border-bottom:1px solid rgba(255,46,136,.35);
    background:#0c001d;
  }
  .decor-layer-toolgroup{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .decor-layer-toolgroup>span{
    margin-right:3px;
    color:#9aa1c1;
    font-size:12px;
    text-transform:uppercase;
  }
  .decor-layer-viewer button{
    min-height:30px;
    padding:5px 9px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .decor-layer-viewer button:hover,
  .decor-layer-viewer button.active{
    border-color:var(--yellow);
    color:var(--yellow);
    background:rgba(255,234,0,.1);
  }
  .decor-layer-viewer select{
    max-width:150px;
    min-height:30px;
    border:1px solid rgba(0,240,255,.55);
    background:#000;
    color:var(--cyan);
    font-family:'VT323',monospace;
    font-size:14px;
  }
  .decor-layer-viewer input[type=color]{
    width:32px;
    height:30px;
    padding:0;
    border:1px solid var(--cyan);
    background:#000;
    cursor:pointer;
  }
  .decor-layer-viewer .paint-color-swatch{
    width:24px;
    height:24px;
    min-height:24px;
    padding:0;
  }
  .decor-paint-readout{min-width:34px;color:var(--yellow);font-size:12px;text-align:center}
  .decor-viewer-palette-swatches{display:flex;gap:4px;align-items:center;max-width:220px;overflow-x:auto;padding:2px}
  .decor-layer-viewer-close{
    width:34px;
    padding:0!important;
    border-color:var(--pink)!important;
    color:var(--pink)!important;
    font-size:15px!important;
  }
  .decor-layer-viewer-viewport{
    position:relative;
    min-height:0;
    overflow:hidden;
    outline:none;
    background-color:#020107;
    background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.055) 1px,transparent 1px);
    background-size:24px 24px;
    cursor:crosshair;
    user-select:none;
  }
  .decor-layer-viewer-viewport[data-mode="move"]{cursor:grab}
  .decor-layer-viewer-viewport.dragging{cursor:grabbing}
  .decor-layer-viewer-canvas{
    position:absolute;
    left:0;
    top:0;
    display:block;
    width:480px;
    height:270px;
    max-width:none;
    border:1px solid rgba(0,240,255,.6);
    outline:1px solid rgba(255,46,136,.25);
    image-rendering:pixelated;
    transform-origin:0 0;
  }
  .decor-layer-viewer-foot{
    display:flex;
    gap:16px;
    align-items:center;
    min-height:38px;
    padding:8px 12px;
    border-top:1px solid rgba(0,240,255,.3);
    background:#0c001d;
    color:#bbe4ff;
    font-size:14px;
  }
  .decor-layer-viewer-foot .shortcuts{margin-left:auto;color:#777d9b;font-size:12px;text-align:right}
  .decor-layer-open{width:100%;margin:0 0 8px;border-color:var(--yellow);color:var(--yellow)}

  .midi-devices{display:grid;gap:6px;margin-bottom:18px}
  .midi-dev{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border:1px solid rgba(0,240,255,.2);
    background:rgba(0,0,0,.35);
  }
  .midi-dev input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
  .midi-dev .name{flex:1;font-size:15px}
  .midi-dev .dot{width:8px;height:8px;border-radius:50%;background:#444}
  .midi-dev.active .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .midi-mappings{display:grid;gap:4px;margin-top:14px}
  .midi-map-row{
    display:grid;
    grid-template-columns:1fr 70px 60px 70px 60px 80px 60px;
    gap:5px;
    align-items:center;
    padding:5px 8px;
    background:rgba(0,0,0,.25);
    font-size:14px;
  }
  .midi-map-row .ev{color:#bbe4ff}
  .midi-map-row .key-input{
    text-transform:uppercase;
    text-align:center;
    border:1px solid var(--cyan);
    background:#000;
    color:var(--cyan);
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    padding:4px 2px;
  }
  .midi-map-row button.key-learn{
    border-color:var(--cyan);
    color:var(--cyan);
  }
  .midi-map-row button.key-learn:hover{background:var(--cyan);color:#000}
  .midi-map-row button.key-learn.listening{background:var(--cyan);border-color:var(--cyan);color:#000;animation:pulse 1s infinite}
  .midi-map-row button{
    padding:3px 6px;
    border:1px solid var(--yellow);
    background:#000;
    color:var(--yellow);
    cursor:pointer;
    font-family:'Press Start 2P',monospace;
    font-size:8px;
  }
  .midi-map-row button:hover{background:var(--yellow);color:#000}
  .midi-map-row button.listening{background:var(--pink);border-color:var(--pink);color:#000;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .preset-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .preset-card{
    padding:14px;
    border:1px solid var(--cyan);
    background:rgba(0,0,0,.4);
    cursor:pointer;
    transition:all .15s;
  }
  .preset-card:hover{
    transform:translate(-2px,-2px);
    border-color:var(--pink);
    background:rgba(255,46,136,.15);
    box-shadow:3px 3px 0 var(--pink);
  }
  .preset-card h4{
    margin-bottom:6px;
    color:var(--yellow);
    font-family:'Press Start 2P',monospace;
    font-size:11px;
  }
  .preset-card p{color:#bbe4ff;font-size:14px;line-height:1.2}

  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:50;
    padding:10px 18px;
    border:1px solid var(--green);
    background:#000;
    color:var(--green);
    box-shadow:0 0 20px rgba(0,255,127,.45);
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    opacity:0;
    transition:opacity .2s;
  }
  .toast.show{opacity:1}

  /* ---- Overrides de la pagina dedicada ---- */
  #config-box{width:min(1240px,98vw);height:min(920px,96vh)}
  #midi-status{margin-left:16px;font-size:14px;color:#9aa1c1;border:1px solid rgba(0,240,255,.3);padding:3px 8px}
  #midi-status.on{color:var(--green);border-color:var(--green)}
  .sync-note{margin-right:auto;align-self:center;color:#9aa1c1;font-size:13px}
  @media (max-width:760px){
    .cfg-grid{grid-template-columns:1fr}
    .cfg-row{grid-template-columns:1fr}
    .cfg-row.bool,.cfg-row.text,.cfg-row.color-row{grid-template-columns:1fr}
    #config-body{grid-template-columns:110px 1fr}
  }
</style>
</head>
<body>
<div id="config-modal">
  <div id="config-box">
    <div id="config-head">
      <h2>MECHAKATZ CONFIG</h2>
      <span id="midi-status">MIDI ESPERANDO</span>
      <span class="sub">Editor dedicado — el juego aplica los cambios en vivo</span>
    </div>
    <div id="config-body">
      <div id="config-tabs"></div>
      <div id="config-content"></div>
    </div>
    <div id="config-foot">
      <span id="sync-note" class="sync-note"></span>
      <button id="cfg-export">EXPORTAR</button>
      <button id="cfg-import">IMPORTAR</button>
      <input type="file" id="cfg-file" accept=".json" style="display:none">
      <button id="cfg-reset" class="danger">RESET</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ==== BLOQUES EXTRAIDOS DEL JUEGO (no editar aqui) ====
const W = 480;
const H = 270;
const Z_MIN = 0;
const Z_MAX = 72;
const TAU = Math.PI * 2;
const MAX_PLAYERS = 4;
const PLAYER_BASE_WIDTH = 14;
const PLAYER_BASE_HEIGHT = 24;
const PLAYER_SCALE_MIN = 0.5;
const PLAYER_SCALE_MAX = 1.25;
const BOSS_INTRO_TOTAL_FRAMES = 8 * 60;
const LANE_EDIT_MIN = -220;
const LANE_EDIT_MAX = 180;
const LANE_MIN_SPAN = 8;
const MAX_SCORE_ENTRIES = 20;

const DECOR_TYPES = {
  sun: {
    label:'SOL',
    params:[
      { key:'x', label:'Pos X (0-1)', min:0, max:1, step:0.01 },
      { key:'y', label:'Pos Y', min:0, max:220, step:1 },
      { key:'r', label:'Radio', min:4, max:80, step:1 }
    ],
    colors:{ core:'Nucleo', lines:'Lineas' },
    defaults:{ x:0.7, y:50, r:22, colors:{ core:'#ffee44', lines:'#ff6633' } }
  },
  moon: {
    label:'LUNA',
    params:[
      { key:'x', label:'Pos X (0-1)', min:0, max:1, step:0.01 },
      { key:'y', label:'Pos Y', min:0, max:220, step:1 },
      { key:'r', label:'Radio', min:4, max:80, step:1 }
    ],
    colors:{ core:'Luna' },
    defaults:{ x:0.85, y:36, r:18, colors:{ core:'#ffeecc' } }
  },
  moon_shadow: {
    label:'SOMBRA DE LUNA',
    params:[
      { key:'x', label:'Pos X (0-1)', min:0, max:1, step:0.01 },
      { key:'y', label:'Pos Y', min:0, max:220, step:1 },
      { key:'r', label:'Radio', min:4, max:80, step:1 }
    ],
    colors:{ shadow:'Sombra' },
    defaults:{ x:0.82, y:32, r:14, colors:{ shadow:'#1a0044' } }
  },
  stars: {
    label:'ESTRELLAS',
    params:[],
    colors:{ a:'Tinte 1', b:'Tinte 2', c:'Tinte 3' },
    defaults:{ seed:9000, colors:{ a:'#ffffff', b:'#e6f7ff', c:'#ffe8b8' } }
  },
  mountains: {
    label:'MONTAÑAS', scroll:true,
    params:[
      { key:'w', label:'Ancho', min:20, max:400, step:2 },
      { key:'h', label:'Alto', min:8, max:200, step:1 }
    ],
    colors:{ main:'Montaña' },
    defaults:{ px:0.2, gap:180, scale:1, seed:0, w:120, h:50, colors:{ main:'#5a3070' } }
  },
  mesas: {
    label:'ROCAS / MESAS', scroll:true,
    params:[
      { key:'w', label:'Ancho', min:16, max:300, step:2 },
      { key:'h', label:'Alto', min:8, max:120, step:1 }
    ],
    colors:{ body:'Cuerpo', top:'Borde', hole:'Cueva' },
    defaults:{ px:0.4, gap:220, scale:1, seed:0, w:80, h:32, colors:{ body:'#7a3520', top:'#5a2510', hole:'#000000' } }
  },
  cacti: {
    label:'CACTUS', scroll:true,
    params:[
      { key:'h', label:'Alto', min:6, max:60, step:1 }
    ],
    colors:{ main:'Cactus', dark:'Punta', bones:'Huesos' },
    defaults:{ px:0.8, gap:70, scale:1, seed:0, h:14, colors:{ main:'#2a6a2a', dark:'#1a4a1a', bones:'#ffffff' } }
  },
  towers: {

function makeDecorLayer(type){
  const def = DECOR_TYPES[type];
  if(!def) return null;
  return deepClone(Object.assign({ type, on:true }, def.defaults));
}

// Escenario por defecto de cada plantilla de fondo. Devuelve objetos NUEVOS
// (se usa tanto para DEFAULT_CONFIG como para crear niveles en el editor).
function defaultSceneryFor(bg){
  if(bg === 'urban'){
    return {
      sky:[ { p:0, c:'#1a2050' }, { p:0.6, c:'#5a4080' }, { p:1, c:'#aa6080' } ],
      layers:[
        makeDecorLayer('towers'),
        makeDecorLayer('houses'),
        makeDecorLayer('ground_road'),
        makeDecorLayer('streetlights')
      ]
    };
  }
  if(bg === 'city'){
    return {
      sky:[ { p:0, c:'#08001a' }, { p:0.5, c:'#1a0044' }, { p:1, c:'#3a0066' } ],
      layers:[
        makeDecorLayer('moon'),
        makeDecorLayer('moon_shadow'),
        makeDecorLayer('stars'),
        makeDecorLayer('skyscrapers'),
        makeDecorLayer('billboards'),
        makeDecorLayer('neon'),
        makeDecorLayer('ground_neon')
      ]
    };
  }
  // desert (default)
  return {
    sky:[ { p:0, c:'#3a1858' }, { p:0.4, c:'#ff6633' }, { p:0.8, c:'#ffaa44' }, { p:1, c:'#dd9933' } ],
    layers:[
      makeDecorLayer('sun'),
      makeDecorLayer('mountains'),
      makeDecorLayer('mesas'),
      makeDecorLayer('ground_sand'),
      makeDecorLayer('cacti')
    ]
  };
}

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function isObject(value){ return value && typeof value === 'object' && !Array.isArray(value); }
function deepMerge(base, patch){
  if(Array.isArray(base) && Array.isArray(patch)){
    return patch.map((item, index) => {
      if(index < base.length) return deepMerge(base[index], item);
      return deepClone(item);
    });
  }
  if(isObject(base) && isObject(patch)){
    const out = deepClone(base);
    Object.keys(patch).forEach(key => {
      if(key in out) out[key] = deepMerge(out[key], patch[key]);
      else out[key] = deepClone(patch[key]);
    });
    return out;
  }
  return deepClone(patch);
}
function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function sign(value){ return value < 0 ? -1 : value > 0 ? 1 : 0; }

// ============================================================
// PERSISTENCIA DE CONFIG
// El juego se abre normalmente como archivo local (file://), donde fetch()
// suele estar bloqueado. Para que el tuneo del show sobreviva a un refresh
// usamos localStorage como almacen principal. Si ademas se sirve por HTTP,
// se intenta sembrar desde ./MECHAKATZ.json la primera vez (ver abajo).
// ============================================================
const CONFIG_STORAGE_KEY = 'mechakatz_config_v9';
let configPersistReady = false; // evita guardar durante el arranque inicial
// Ultimo JSON crudo escrito/aplicado por ESTA ventana. Sirve para que la
// sincronizacion con el editor externo (mechakatz_config.html) distinga
// escrituras propias de las ajenas y no re-aplique en bucle.
let lastSyncedConfigRaw = '';
function saveConfigToStorage(){
  if(!configPersistReady) return;
  try {
    const raw = JSON.stringify(CONFIG);
    localStorage.setItem(CONFIG_STORAGE_KEY, raw);
    lastSyncedConfigRaw = raw;
  }
  catch(error){ /* sin localStorage o cuota llena: ignorar */ }
}
function loadConfigFromStorage(){
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if(!raw) return false;
    CONFIG = deepMerge(DEFAULT_CONFIG, JSON.parse(raw));
    lastSyncedConfigRaw = raw;
    return true;
  } catch(error){ return false; }
}
// Aplica en caliente una config escrita por otra ventana (el editor dedicado).
// No re-guarda (configPersistReady off durante el apply) para no provocar un
// eco de eventos storage entre ventanas.
function applyExternalConfigRaw(raw){
  if(!raw || raw === lastSyncedConfigRaw) return;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(error){ return; }
  lastSyncedConfigRaw = raw;
  CONFIG = deepMerge(DEFAULT_CONFIG, parsed);
  const persistWas = configPersistReady;
  configPersistReady = false;
  applyConfigToLiveGame();
  configPersistReady = persistWas;
  if(isConfigOpen()){
    renderConfigTabs();
    refreshConfigContent();
  }
  showToast('Config actualizada desde el editor');
}

function normalizeRunName(value){
  return String(value ?? '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 15)
    .toUpperCase() || 'PARTIDA';
}
function normalizeHotkeyName(value){
  const original = String(value ?? '');
  if(original === ' ') return 'space';
  const raw = original.trim().toLowerCase();
  if(!raw) return '';
  if(raw === 'spacebar' || raw === 'space') return 'space';
  return raw.slice(0, 16);
}
function normalizeScoreEntry(entry){
  const safe = entry && typeof entry === 'object' ? entry : {};
  const players = Array.isArray(safe.players) ? safe.players : [];
  return {
    name: normalizeRunName(safe.name),
    total: Math.max(0, Math.round(Number(safe.total) || 0)),
    result: safe.result === 'victory' ? 'victory' : 'gameover',
    stage: clamp(Math.round(Number(safe.stage) || 1), 1, Math.max(3, CONFIG.stages ? CONFIG.stages.length : 3)),
    players: players.slice(0, MAX_PLAYERS).map(player => ({
      slot: String(player.slot || '').slice(0, 4) || 'P?',
      pilot: String(player.pilot || 'MECHA').slice(0, 16),
      score: Math.max(0, Math.round(Number(player.score) || 0))
    })),
    ts: typeof safe.ts === 'string' ? safe.ts : new Date().toISOString()
  };
}
function sanitizeScoreboardConfig(){
  if(!CONFIG.scoreboard || typeof CONFIG.scoreboard !== 'object'){
    CONFIG.scoreboard = deepClone(DEFAULT_CONFIG.scoreboard);
  }
  CONFIG.scoreboard.currentRunName = normalizeRunName(CONFIG.scoreboard.currentRunName);
  const sourceEntries = Array.isArray(CONFIG.scoreboard.entries) ? CONFIG.scoreboard.entries : [];
  CONFIG.scoreboard.entries = sourceEntries
    .map(normalizeScoreEntry)
    .sort((a, b) => b.total - a.total || String(b.ts).localeCompare(String(a.ts)))
    .slice(0, MAX_SCORE_ENTRIES);
}

function runStageCount(){
  if(game.stageOrder && game.stageOrder.length) return game.stageOrder.length;
  return CONFIG.stages.length;
}
function poolStageIndex(runIdx = game.stage){
  const poolLen = Math.max(1, CONFIG.stages.length);
  if(game.stageOrder && game.stageOrder.length){
    const pos = clamp(runIdx, 0, game.stageOrder.length - 1);
    return clamp(Math.round(game.stageOrder[pos] ?? 0), 0, poolLen - 1);
  }
  return clamp(runIdx, 0, poolLen - 1);
}
let lastStageGroupIdx = -1;
function pickStageGroup(){
  const sg = CONFIG.stageGroups || {};
  const groups = Array.isArray(sg.groups) && sg.groups.length
    ? sg.groups
    : [{ name:'SET A', stages:[0,1,2] }];
  const forced = Math.round(sg.forcedGroup ?? -1);
  let idx;
  if(forced >= 0 && forced < groups.length){
    idx = forced;
  } else {
    idx = Math.floor(Math.random() * groups.length);
    // Con 2+ grupos, evitar repetir el mismo set dos partidas seguidas
    if(groups.length > 1 && idx === lastStageGroupIdx){
      idx = (idx + 1 + Math.floor(Math.random() * (groups.length - 1))) % groups.length;
    }
  }
  lastStageGroupIdx = idx;
  const group = groups[idx];
  const poolLen = Math.max(1, CONFIG.stages.length);
  const stages = Array.isArray(group.stages) ? group.stages : [0,1,2];
  const order = [0,1,2].map(k => clamp(Math.round(Number(stages[k]) || 0), 0, poolLen - 1));
  return { name: String(group.name || `SET ${idx + 1}`), order };
}

// Las oleadas ahora viven dentro de cada stage en CONFIG.stages[i].waves,
// de modo que stage + oleadas viajan juntos (y se pueden agregar stages
// nuevos via config sin tocar codigo). stageWaves() es la unica via de
// acceso; devuelve [] si el stage no define oleadas. El indice recibido es
// la posicion de la partida (0..2) y se resuelve al nivel real del pool.
function stageWaves(stageIndex = game.stage){
  const stage = CONFIG.stages[poolStageIndex(stageIndex)];
  return stage && Array.isArray(stage.waves) ? stage.waves : [];
}

let decorPreviewStage = null;
function stageCfg(){
  if(decorPreviewStage) return decorPreviewStage;
  return CONFIG.stages[poolStageIndex()];
}
// Recorrido efectivo del stage: stage.length escalado por el multiplicador
// general. Las posiciones wave.x se escalan igual (waveTriggerX), asi las
// oleadas conservan su reparto relativo a lo largo del recorrido y el clamp
// anti-softlock (que compara wave.x contra stage.length en crudo) sigue valido.
function stageRunLength(){
  return Math.round(stageCfg().length * (CONFIG.general.stageLengthMul ?? 1));
}
function waveTriggerX(wave){

}

function playerScaleForChar(char){

function applyPlayerSize(player){

function setupMIDI(){
  if(!navigator.requestMIDIAccess){
    updateMidiStatus();
    return;
  }
  navigator.requestMIDIAccess().then(access => {
    midiAccess = access;
    refreshMidiDevices();
    access.onstatechange = refreshMidiDevices;
  }).catch(() => updateMidiStatus());
}
function refreshMidiDevices(){
  if(!midiAccess){
    updateMidiStatus();
    return;
  }
  midiDevices.forEach(input => { input.onmidimessage = null; });
  midiDevices.clear();
  for(const input of midiAccess.inputs.values()) midiDevices.set(input.id, input);
  CONFIG.midi.enabledDevices = CONFIG.midi.enabledDevices.filter(id => midiDevices.has(id)).slice(0, CONFIG.midi.maxDevices);
  if(CONFIG.midi.enabledDevices.length === 0 && midiDevices.size > 0){
    CONFIG.midi.enabledDevices.push(midiDevices.keys().next().value);
  }
  CONFIG.midi.enabledDevices.forEach(id => {
    const input = midiDevices.get(id);
    if(input) input.onmidimessage = msg => onMidiMessage(msg, id);
  });
  updateMidiStatus();
  if(currentConfigTab === 'midi') refreshConfigContent();
}
function updateMidiStatus(){
  if(!midiStatus) return;
  const enabled = CONFIG.midi.enabledDevices.length;
  const netOn = NET_MIDI_STATE.connected;
  if(enabled > 0 && netOn){
    midiStatus.textContent = `MIDI ${enabled}/${CONFIG.midi.maxDevices} + NET`;
    midiStatus.classList.add('on');
  } else if(enabled > 0){
    midiStatus.textContent = `MIDI ON ${enabled}/${CONFIG.midi.maxDevices}`;
    midiStatus.classList.add('on');
  } else if(netOn){
    midiStatus.textContent = `MIDI NET ${NET_MIDI_STATE.clients || 1}`;
    midiStatus.classList.add('on');
  } else if(midiDevices.size > 0){
    midiStatus.textContent = `MIDI DISP ${midiDevices.size}`;
    midiStatus.classList.remove('on');
  } else {
    midiStatus.textContent = 'MIDI ESPERANDO';
    midiStatus.classList.remove('on');
  }
  midiStatus.title = [
    enabled > 0 ? `Local: ${enabled}/${CONFIG.midi.maxDevices}` : 'Local: sin entrada activa',
    CONFIG.midi.network.enabled ? (netOn ? `Net: ${NET_MIDI_STATE.url || CONFIG.midi.network.wsUrl} · sala ${NET_MIDI_STATE.room || CONFIG.midi.network.room}` : `Net: esperando ${CONFIG.midi.network.wsUrl}`) : 'Net: off',
    NET_MIDI_STATE.lastMessage ? `Ultimo: ${NET_MIDI_STATE.lastMessage}` : ''
  ].filter(Boolean).join('\n');
}
function onMidiMessage(message){
  const [status, data1, data2] = message.data;
  const cmd = status & 0xf0;
  const ch = status & 0x0f;
  let type = null;
  if(cmd === 0x90 && data2 > 0) type = 'noteon';
  else if(cmd === 0xb0) type = 'cc';
  else if(cmd === 0xc0) type = 'pc';
  if(!type) return;

  if(midiLearnTarget){
    const learned = midiLearnTarget;
    CONFIG.midi.mappings[learned] = { type, note:data1, ch };
    midiLearnTarget = null;
    applyConfigToLiveGame();
    if(currentConfigTab === 'midi') refreshConfigContent();
    showToast(`Mapped: ${MIDI_EVENT_LABELS[learned] || learned}`);
    return;
  }

  for(const eventName of Object.keys(CONFIG.midi.mappings)){
    const map = CONFIG.midi.mappings[eventName];
    if(map.type === type && map.note === data1 && (map.ch === ch || map.ch === 16)){
      triggerMidiEvent(eventName, data2);
      return;
    }
  }
}
function closeNetMidiConnection(){
  clearTimeout(NET_MIDI_STATE.retryTimer);
  NET_MIDI_STATE.retryTimer = 0;
  if(NET_MIDI_STATE.ws){
    NET_MIDI_STATE.ws.onopen = null;
    NET_MIDI_STATE.ws.onmessage = null;
    NET_MIDI_STATE.ws.onerror = null;
    NET_MIDI_STATE.ws.onclose = null;
    try { NET_MIDI_STATE.ws.close(); } catch(error){}
  }
  NET_MIDI_STATE.ws = null;
  NET_MIDI_STATE.connected = false;
  NET_MIDI_STATE.clients = 0;
  updateMidiStatus();
}
function handleNetMidiMessage(raw){
  let payload = null;
  try {
    payload = JSON.parse(raw);
  } catch(error){
    return;
  }
  if(!payload || !payload.type) return;
  if(payload.type === 'joined'){
    NET_MIDI_STATE.room = payload.room || CONFIG.midi.network.room;
    NET_MIDI_STATE.clients = payload.clients || 0;
    updateMidiStatus();
    if(currentConfigTab === 'midi') refreshConfigContent();
    return;
  }
  if(payload.type === 'midi' && Array.isArray(payload.data)){
    NET_MIDI_STATE.lastMessage = payload.data.map(byte => `0x${Number(byte).toString(16).toUpperCase().padStart(2,'0')}`).join(' ');
    onMidiMessage({ data: payload.data });
    updateMidiStatus();
  }
}
function connectNetMidi(){
  if(!CONFIG.midi.network.enabled || !window.WebSocket){
    closeNetMidiConnection();
    return;
  }
  const url = (CONFIG.midi.network.wsUrl || '').trim();
  const room = (CONFIG.midi.network.room || 'midivj').trim() || 'midivj';
  if(
    NET_MIDI_STATE.ws &&
    (NET_MIDI_STATE.ws.readyState === WebSocket.OPEN || NET_MIDI_STATE.ws.readyState === WebSocket.CONNECTING)
  ){
    if(NET_MIDI_STATE.url === url && NET_MIDI_STATE.room === room) return;
    closeNetMidiConnection();
  }
  if(!url){
    updateMidiStatus();
    return;
  }
  clearTimeout(NET_MIDI_STATE.retryTimer);
  try {
    const ws = new WebSocket(url);
    NET_MIDI_STATE.ws = ws;
    NET_MIDI_STATE.url = url;
    ws.onopen = () => {
      NET_MIDI_STATE.connected = true;
      NET_MIDI_STATE.failCount = 0;
      NET_MIDI_STATE.room = room;
      NET_MIDI_STATE.lastMessage = '';
      ws.send(JSON.stringify({ type:'join', room }));
      updateMidiStatus();
      if(currentConfigTab === 'midi') refreshConfigContent();
      showToast('Net MIDI conectado');
    };
    ws.onmessage = event => handleNetMidiMessage(event.data);
    ws.onerror = () => {
      NET_MIDI_STATE.connected = false;
      updateMidiStatus();
    };
    ws.onclose = () => {
      NET_MIDI_STATE.ws = null;
      NET_MIDI_STATE.connected = false;
      NET_MIDI_STATE.clients = 0;
      updateMidiStatus();
      if(currentConfigTab === 'midi') refreshConfigContent();
      scheduleNetMidiRetry();
    };
  } catch(error){
    NET_MIDI_STATE.connected = false;
    updateMidiStatus();
    scheduleNetMidiRetry();
  }
}
// Backoff exponencial (tope 30s): sin relay corriendo, cada intento fallido
// imprime un error de consola imposible de suprimir desde JS; espaciar los
// reintentos corta el spam. onopen resetea el conteo, y el boton de reconexion
// manual del panel sigue intentando al instante.
function scheduleNetMidiRetry(){
  clearTimeout(NET_MIDI_STATE.retryTimer);
  if(!CONFIG.midi.network.enabled) return;
  NET_MIDI_STATE.failCount = Math.min((NET_MIDI_STATE.failCount || 0) + 1, 6);
  const base = Math.max(300, CONFIG.midi.network.retryMs || 1200);
  NET_MIDI_STATE.retryTimer = setTimeout(connectNetMidi, Math.min(base * Math.pow(2, NET_MIDI_STATE.failCount - 1), 30000));
}

    defaults: { line:'#000000', claws:'#ffffff', eyes:'#ffffff', pupils:'#ff3030', teeth:'#ffffff' }

function enemyColorsFor(enemy){
  const sprite = resolveEnemySprite(enemy.sprite || enemy.eType);
  const def = ENEMY_SPRITE_COLORS[sprite] || ENEMY_SPRITE_COLORS.small;
  const cfg = CONFIG.enemies[enemy.eType];
  const stored = cfg && isObject(cfg.colors) ? cfg.colors : {};
  const out = { body: enemy.color || (cfg && cfg.color) || '#ff5555' };
  for(const key of Object.keys(def.defaults)){
    out[key] = stored[key] || def.defaults[key];
  }
  return out;
}
function drawEnemy(enemy, x, y){
  const ox = Math.floor(x);
  const oy = Math.floor(y);
  const mx = enemy.facing < 0 ? -1 : 1;
  const celebrate = enemy.state === 'celebrate';
  const celebrateStyle = celebrate ? Math.abs(enemy.celebrateStyle || 0) % 3 : -1;
  const celebrateWave = celebrate ? Math.sin(enemy.anim * (celebrateStyle === 2 ? .55 : .35) + (enemy.celebratePhase || 0)) : 0;
  const bob = celebrate
    ? celebrateStyle === 0
      ? Math.floor(Math.max(0, celebrateWave) * 2)
      : celebrateStyle === 1
        ? Math.floor(Math.sin(enemy.anim * .3 + (enemy.celebratePhase || 0)) * 1.4)
        : Math.floor(Math.abs(Math.sin(enemy.anim * .42 + (enemy.celebratePhase || 0))) * 1.8)
    : enemy.state === 'walk'
      ? Math.floor(Math.sin(enemy.anim * 0.25) * 1)
      : 0;
  const emerging = enemy.state === 'emerge';
  const emergeP = emerging ? clamp(1 - enemy.emergeTimer / Math.max(1, enemy.emergeDur), 0, 1) : 1;
  const emergeOffset = emerging ? Math.round((1 - emergeP) * (enemy.height + 6)) : 0;
  const yy = oy + bob + emergeOffset;
  // colorMap: mapa inyectado por la preview/picking del editor; en el juego
  // se resuelve desde CONFIG (detalles) + enemy.color (cuerpo).
  const c = enemy.colorMap || enemyColorsFor(enemy);
  const color = c.body;

  if(emerging){
    drawEmergeGround(ox, oy, enemy.width, emergeP);
  } else if(!enemy.noShadow){
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(ox, oy + 1, enemy.width / 2 + 1, 3, 0, 0, TAU);
    ctx.fill();
  }

  if(enemy.knockedDown > 0){
    rect(ox - enemy.width / 2, yy - 4, enemy.width, 4, color);
    rect(ox - enemy.width / 2 - 2, yy - 2, 2, 2, color);
    px(ox - enemy.width / 2 + 3, yy - 3, c.line);
    px(ox - enemy.width / 2 + 5, yy - 3, c.line);
    return;
  }

  if(emerging){
    // Recorta todo lo que quede por debajo del suelo para simular el brote.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, oy + 2);
    ctx.clip();
  }

  if(enemy.sprite === 'small'){
    rect(ox - 4, yy - 5, 3, 5, color);
    rect(ox + 1, yy - 5, 3, 5, color);
    rect(ox - 5, yy - 13, 10, 8, color);
    rect(ox - 5, yy - 13, 10, 1, c.line);
    rect(ox - 7, yy - 10, 2, 4, c.claws);
    rect(ox + 5, yy - 10, 2, 4, c.claws);
    rect(ox - 5, yy - 19, 10, 6, color);
    rect(ox - 5, yy - 21, 2, 2, color);
    rect(ox + 3, yy - 21, 2, 2, color);
    px(ox - 4, yy - 22, color);
    px(ox + 4, yy - 22, color);
    rect(ox - 3, yy - 17, 2, 2, c.eyes);
    rect(ox + 1, yy - 17, 2, 2, c.eyes);
    px(ox - 3 + (mx > 0 ? 1 : 0), yy - 17, c.pupils);
    px(ox + 1 + (mx > 0 ? 1 : 0), yy - 17, c.pupils);
    px(ox - 1, yy - 14, c.teeth);

function drawRoadLaneMarks(scroll, y, color, dashWidth, dashGap, thickness = 2){
  const step = dashWidth + dashGap;
  const offset = ((scroll % step) + step) % step;
  const startX = -offset - dashWidth;
  for(let xx = startX; xx < W + dashWidth; xx += step){
    rect(Math.round(xx), Math.round(y), dashWidth, thickness, color);
  }
}
function hash01(seed){
  const value = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
  return value - Math.floor(value);
}
function drawCityStarField(gy, tints = ['#ffffff','#e6f7ff','#ffe8b8'], seedBase = 9000){
  const skyHeight = Math.max(26, Math.min(gy - 18, 96));
  const layers = [
    { factor:0.06, cell:74, tint:tints[0] },
    { factor:0.12, cell:56, tint:tints[1] },
    { factor:0.18, cell:44, tint:tints[2] }
  ];
  layers.forEach((layer, layerIdx) => {
    const parallax = game.cameraX * layer.factor;
    const startCell = Math.floor(parallax / layer.cell) - 3;
    const endCell = startCell + Math.ceil((W + layer.cell * 6) / layer.cell);
    for(let cell = startCell; cell <= endCell; cell++){
      const seed = seedBase + layerIdx * 997 + cell * 131;
      const sx = Math.floor(cell * layer.cell - parallax + hash01(seed) * layer.cell);
      const sy = 6 + Math.floor(hash01(seed + 19) * skyHeight);
      const size = 1 + Math.floor(hash01(seed + 37) * 3);
      const tintRoll = hash01(seed + 53);
      const color = tintRoll < 0.16 ? tints[2] : tintRoll < 0.32 ? tints[1] : layer.tint;
      rect(sx, sy, size, size, color);
      const twinkle = hash01(seed + (Math.floor(game.time / 10) % 23) * 17);
      if(size >= 2 && twinkle > 0.56){
        px(sx - 1, sy + Math.floor(size * 0.5), color);
        px(sx + size, sy + Math.floor(size * 0.5), color);
      }
      if(size >= 3 && twinkle > 0.72){
        px(sx + 1, sy - 1, color);
        px(sx + 1, sy + size, color);
      }
    }
  });
}
function drawPixelFlame(x, y, scale = 1, hot = '#ffea00', warm = '#ff7e1a', core = '#fff'){
  const s = Math.max(1, Math.round(scale));
  const flicker = Math.sin(game.time * 0.24 + x * 0.03 + y * 0.05);
  const lift = Math.round(Math.max(0, flicker) * s);
  const flare = Math.round(Math.abs(Math.sin(game.time * 0.18 + x * 0.05)) * s);
  rect(x - 3 * s, y - 1 * s - lift, 6 * s + flare, 4 * s + lift, warm);
  rect(x - 2 * s, y - 4 * s - lift, 4 * s, 4 * s + lift, hot);
  rect(x - 1 * s, y - 7 * s - lift, 2 * s, 3 * s + flare, core);
  px(x, y - 8 * s - lift, core, s, s);
  if((game.time + x + y) % 4 < 2){

  }

function drawMonsterShadow(x, y, phase = 0, color = '#120018', scale = 1){

  rect(x - 10 * s, y - 18 * s + bob, 20 * s, 16 * s, color);
  rect(x - 7 * s, y - 24 * s + bob, 14 * s, 8 * s, color);
  rect(x - 9 * s, y - 28 * s + bob, 4 * s, 4 * s, color);
  rect(x + 5 * s, y - 28 * s + bob, 4 * s, 4 * s, color);
  rect(x - 6 * s, y - 20 * s + bob, 3 * s, 2 * s, '#ff3030');

function drawWindowGrid(x, y, w, h, cols, rows, seedBase, colors = ['#ffea00','#00f0ff','#fff'], darkChance = 0.42){
  const insetX = 3;
  const insetY = 4;
  const stepX = Math.max(5, Math.floor((w - insetX * 2) / Math.max(1, cols)));
  const stepY = Math.max(6, Math.floor((h - insetY * 2) / Math.max(1, rows)));
  for(let row = 0; row < rows; row++){
    for(let col = 0; col < cols; col++){
      const seed = seedBase + row * 37 + col * 59;
      if(hash01(seed) < darkChance) continue;
      const ww = 2 + Math.floor(hash01(seed + 7) * 3);
      const hh = 3 + Math.floor(hash01(seed + 13) * 2);
      const wx = x + insetX + col * stepX + Math.floor(hash01(seed + 19) * 2);
      const wy = y + insetY + row * stepY + Math.floor(hash01(seed + 23) * 2);
      const tintRoll = hash01(seed + 29);
      const tint = tintRoll < 0.18 ? colors[2] : tintRoll < 0.48 ? colors[1] : colors[0];
      rect(wx, wy, ww, hh, tint);
      if(ww >= 3 && hh >= 4 && tintRoll > 0.72){
        rect(wx + 1, wy + 1, Math.max(1, ww - 2), Math.max(1, hh - 2), '#fff');
      }
    }
  }
}
function drawAttackAccent(x, y, seedBase, scale = 1){
  const phase = game.time * 0.055 + seedBase * 0.3;
  const flameShift = Math.sin(game.time * 0.12 + seedBase) * (1.5 * scale);
  const flameScale = scale * (0.9 + Math.abs(Math.sin(game.time * 0.19 + seedBase * 0.2)) * 0.45);
  if(hash01(seedBase + 1) > 0.28){
    drawPixelFlame(Math.round(x + flameShift), Math.round(y), flameScale, '#ffea00', '#ff6f1f', '#fff');
    if(hash01(seedBase + 2) > 0.64){
      drawPixelFlame(Math.round(x + 4 * scale - flameShift * 0.5), Math.round(y + 1), Math.max(1, flameScale - 1), '#ffea00', '#ff8a2a', '#fff');

  }
  if(hash01(seedBase + 3) > 0.54){
    drawMonsterShadow(Math.round(x + Math.sin(phase) * (4 + scale * 3)), Math.round(y + 1), phase, '#14001f', 0.5);
  }
}
// ============================================================
// RENDER DEL ESCENARIO POR CAPAS (data-driven, editable en la pestaña DECOR)
// Cada tipo de DECOR_TYPES tiene su renderer. Los loops usan los mismos

let FALLBACK_SCENERY = null;
function stageSceneryData(stage){
  const sc = stage && stage.scenery;
  if(sc && Array.isArray(sc.layers) && sc.layers.length) return sc;
  // Stage sin scenery propio (config viejo / nivel importado): usar la
  // plantilla de su bg, cacheada para no generar objetos cada frame.
  if(!FALLBACK_SCENERY) FALLBACK_SCENERY = {};
  const key = stage && stage.bg ? stage.bg : 'desert';
  if(!FALLBACK_SCENERY[key]) FALLBACK_SCENERY[key] = defaultSceneryFor(key);
  return FALLBACK_SCENERY[key];
}
function safeHexColor(value, fallback){

}
function sanitizeHexColorList(value, max = 48){
  const colors = [];
  const seen = new Set();
  (Array.isArray(value) ? value : []).forEach(raw => {
    const color = safeHexColor(raw, null);
    if(!color) return;
    const normalized = color.toLowerCase();
    if(seen.has(normalized) || colors.length >= max) return;
    seen.add(normalized);
    colors.push(normalized);
  });

}
function sanitizePaintToolsConfig(){
  const fallbackColors = ['#ff2e88','#00f0ff','#ffea00','#9b30ff','#00ff7f','#ffffff','#000000'];
  const source = isObject(CONFIG.paintTools) ? CONFIG.paintTools : {};
  const palettes = [];
  const seenIds = new Set();
  (Array.isArray(source.palettes) ? source.palettes : []).slice(0, 12).forEach((palette, idx) => {
    if(!isObject(palette)) return;
    let id = String(palette.id || `palette_${idx + 1}`).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 32) || `palette_${idx + 1}`;
    while(seenIds.has(id)) id = `${id}_${idx + 1}`.slice(0, 32);
    seenIds.add(id);
    palettes.push({
      id,
      name:String(palette.name || `PALETA ${idx + 1}`).trim().slice(0, 24) || `PALETA ${idx + 1}`,
      colors:sanitizeHexColorList(palette.colors, 32)
    });
  });
  if(!palettes.length){
    palettes.push({ id:'neon_base', name:'NEON BASE', colors:fallbackColors });
  }
  const activePaletteId = palettes.some(palette => palette.id === source.activePaletteId)
    ? source.activePaletteId
    : palettes[0].id;
  CONFIG.paintTools = {
    activeTool:source.activeTool === 'eyedropper' ? 'eyedropper' : 'brush',
    brushSize:clamp(Math.round(Number(source.brushSize) || 3), 1, 16),
    activeColor:safeHexColor(source.activeColor, '#ff2e88').toLowerCase(),
    activePaletteId,
    palettes

}
function sanitizeDecorBrushStrokes(value){
  if(!Array.isArray(value)) return [];
  return value.slice(-128).map(stroke => {
    if(!stroke || !Array.isArray(stroke.points)) return null;
    const points = [];
    const limit = Math.min(stroke.points.length - (stroke.points.length % 2), 40000);
    for(let i = 0; i < limit; i += 2){
      const x = Math.round(Number(stroke.points[i]));
      const y = Math.round(Number(stroke.points[i + 1]));
      if(!Number.isFinite(x) || !Number.isFinite(y)) continue;
      points.push(clamp(x, -100000, 100000), clamp(y, 0, H - 1));
    }
    if(!points.length) return null;
    return { color:safeHexColor(stroke.color, '#ff2e88'), points };
  }).filter(Boolean);
}
// Sanea stage.scenery: tipos desconocidos fuera, numeros dentro de rango y
// colores hex validos (un JSON importado a mano no puede romper el render).
function sanitizeStageScenery(stage){
  if(!stage || !isObject(stage.scenery)) return;
  const sc = stage.scenery;
  if(!Array.isArray(sc.sky) || !sc.sky.length){
    sc.sky = defaultSceneryFor(stage.bg).sky;
  }
  sc.sky = sc.sky.slice(0, 6).map(stop => ({
    p: clamp(Number(stop && stop.p) || 0, 0, 1),
    c: safeHexColor(stop && stop.c, '#000000')
  }));
  sc.brushStrokes = sanitizeDecorBrushStrokes(sc.brushStrokes);
  sc.savedColors = sanitizeHexColorList(sc.savedColors, 48);
  // Migracion transparente: las configs anteriores guardaban luna y sombra
  // dentro de una sola capa. Al detectar ese formato, se crean dos capas
  // independientes conservando exactamente la posicion y forma clasicas.
  const migratedLayers = [];
  (Array.isArray(sc.layers) ? sc.layers : []).forEach(layer => {
    if(layer && layer.type === 'moon' && isObject(layer.colors) && layer.colors.shadow){
      const core = deepClone(layer);
      const radius = Math.max(2, Number(core.r) || 18);
      const shadowColor = core.colors.shadow;
      delete core.colors.shadow;
      migratedLayers.push(core);
      migratedLayers.push({
        type:'moon_shadow',
        on:core.on !== false,
        x:clamp((Number(core.x) || 0.85) - (radius * 0.8 / W), 0, 1),
        y:clamp((Number(core.y) || 36) - radius * 0.22, 0, 220),
        r:clamp(radius * 0.78, 4, 80),
        colors:{ shadow:shadowColor }
      });
      return;
    }
    migratedLayers.push(layer);
  });
  sc.layers = migratedLayers.filter(layer => layer && DECOR_TYPES[layer.type]);
  sc.layers.forEach(layer => {
    const def = DECOR_TYPES[layer.type];
    layer.on = layer.on !== false;
    if(def.scroll){
      const px = Number(layer.px);
      layer.px = clamp(Number.isFinite(px) ? px : (def.defaults.px ?? 0.5), 0, 1);
      layer.gap = clamp(Math.round(Number(layer.gap) || def.defaults.gap || 100), 12, 900);
      const scale = Number(layer.scale);
      layer.scale = clamp(Number.isFinite(scale) && scale > 0 ? scale : 1, 0.25, 4);
      layer.seed = Math.round(Number(layer.seed) || 0);
      layer.growth = clamp(Math.round(Number(layer.growth) || 0), 0, 3);
      layer.procedural = layer.procedural !== false;
      layer.patternLength = clamp(Math.round(Number(layer.patternLength) || 32), 2, 256);
      layer.variation = clamp(Number.isFinite(Number(layer.variation)) ? Number(layer.variation) : 0.35, 0, 1);
    }
    (def.params || []).forEach(param => {
      const value = Number(layer[param.key]);
      layer[param.key] = clamp(Number.isFinite(value) ? value : def.defaults[param.key], param.min, param.max);
    });
    layer.colors = isObject(layer.colors) ? layer.colors : {};
    Object.keys(def.colors || {}).forEach(key => {
      layer.colors[key] = safeHexColor(layer.colors[key], def.defaults.colors[key]);
    });
    layer.brushStrokes = sanitizeDecorBrushStrokes(layer.brushStrokes);
  });
}

// Lo usan las pasadas extra de "crecimiento" para intercalar elementos entre

let decorPhaseShift = 0;

// En modo procedural cada indice obtiene una semilla unica y determinista. Si
// se desactiva, patternLength controla cuantos elementos forman el patron antes
// de volver a repetirse (hasta 256).
function decorPatternCell(layer, cell){
  if(layer.procedural !== false) return cell;
  const span = clamp(Math.round(Number(layer.patternLength) || 32), 2, 256);
  return ((cell % span) + span) % span;

function decorCellSeed(layer, cell, salt = 0){
  return (Math.round(Number(layer.seed)) || 0) + decorPatternCell(layer, cell) * 131 + salt;
}
function decorVary(layer, seed, range = 0.3){
  const amount = clamp(Number.isFinite(Number(layer.variation)) ? Number(layer.variation) : 0.35, 0, 1);
  return 1 + (hash01(seed) * 2 - 1) * range * amount;

function forEachDecorCell(layer, gap, margin, fn){
  const safeGap = Math.max(12, Number(gap) || 100);
  const scroll = -game.cameraX * (layer.px ?? 0.5) + decorPhaseShift;
  const start = Math.floor((-Math.max(0, margin) - scroll) / safeGap) - 1;
  const end = Math.ceil((W + Math.max(0, margin) - scroll) / safeGap) + 1;
  for(let cell = start; cell <= end; cell++){
    fn(Math.round(cell * safeGap + scroll), cell, decorPatternCell(layer, cell), decorCellSeed(layer, cell));
  }

function decorSceneProgress(){
  if(decorPreviewStage) return clamp(Number(DECOR_PREVIEW_OPTS.progress) || 0, 0, 1);
  const maxCam = Math.max(1, stageRunLength() - W);
  return clamp(game.cameraX / maxCam, 0, 1);
}
// Crecimiento progresivo: layer.growth (0-3) define cuantos elementos EXTRA

function drawDecorGrowthPasses(layer, renderer, gy){
  const def = DECOR_TYPES[layer.type];
  if(!def || !def.scroll) return;
  const growth = Math.max(0, Math.min(3, Math.round(Number(layer.growth) || 0)));
  if(!growth) return;
  const active = growth * decorSceneProgress();
  if(active <= 0) return;
  const gap = Math.max(12, Math.round(Number(layer.gap) || 100));
  const oldAlpha = ctx.globalAlpha;
  for(let k = 1; k <= growth; k++){
    const fade = clamp(active - (k - 1), 0, 1);
    if(fade <= 0) break;
    decorPhaseShift = Math.round(gap * k / (growth + 1));
    ctx.globalAlpha = oldAlpha * fade;
    renderer(Object.assign({}, layer, { seed: (Math.round(Number(layer.seed)) || 0) + k * 5077 }), gy);
  }

  for(const stroke of strokes){
    if(!stroke || !Array.isArray(stroke.points)) continue;
    ctx.fillStyle = safeHexColor(stroke.color, '#ff2e88');
    for(let i = 0; i + 1 < stroke.points.length; i += 2){

      const sy = Math.round(Number(stroke.points[i + 1]));

  CONFIG.remote.hostKey = String(CONFIG.remote.hostKey || '').trim();
  CONFIG.remote.sessionMode = ['controller','stream','mixed'].includes(CONFIG.remote.sessionMode) ? CONFIG.remote.sessionMode : 'mixed';
  CONFIG.remote.sessionMinutes = Math.max(5, Math.min(480, Math.round(Number(CONFIG.remote.sessionMinutes) || 60)));
  CONFIG.remote.streamFps = Math.max(10, Math.min(60, Math.round(Number(CONFIG.remote.streamFps) || 30)));
  CONFIG.remote.retryMs = Math.max(500, Math.round(Number(CONFIG.remote.retryMs) || 2000));
  CONFIG.remote.snapshotIntervalFrames = Math.max(1, Math.round(Number(CONFIG.remote.snapshotIntervalFrames) || 12));
  CONFIG.midi.network.retryMs = Math.max(300, parseInt(CONFIG.midi.network.retryMs || 1200, 10));
  updateMidiStatus();
  if(CONFIG.midi.network.enabled) connectNetMidi();
  else closeNetMidiConnection();
  updateRemoteStatus();
  if(CONFIG.remote.enabled) connectRemoteHost();
  else closeRemoteConnection();
  renderScoresPanel();
  saveConfigToStorage();
}

function makeSection(title){
  const section = document.createElement('div');
  section.className = 'cfg-section';
  const heading = document.createElement('h3');
  heading.textContent = title;
  section.appendChild(heading);
  return section;
}
function appendRow(section, row){
  section.appendChild(row);
  return row;
}
function rangeRow(section, labelText, object, key, min, max, step = 1){
  const row = document.createElement('div');
  row.className = 'cfg-row';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min;
  input.max = max;
  input.step = step;
  input.value = object[key];
  const value = document.createElement('div');
  value.className = 'val';
  value.textContent = object[key];
  input.addEventListener('input', () => {
    object[key] = parseFloat(input.value);
    value.textContent = input.value;
    applyConfigToLiveGame();
  });
  row.append(label, input, value);
  appendRow(section, row);
}
function numberRow(section, labelText, object, key, step = 1){
  const row = document.createElement('div');
  row.className = 'cfg-row';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'number';
  input.step = step;
  input.value = object[key];
  const value = document.createElement('div');
  value.className = 'val';
  value.textContent = object[key];
  input.addEventListener('input', () => {
    const parsed = parseFloat(input.value);
    if(Number.isNaN(parsed)) return;
    object[key] = parsed;
    value.textContent = parsed;
    applyConfigToLiveGame();
  });
  row.append(label, input, value);
  appendRow(section, row);
}
function checkboxRow(section, labelText, object, key){
  const row = document.createElement('div');

  label.textContent = labelText;
  const input = document.createElement('input');

  input.addEventListener('change', () => {
    object[key] = input.checked;

function createStageFromTemplate(bg){
  const idx = CONFIG.stages.length;
  const lanes = bg === 'city' ? [12, 52] : bg === 'urban' ? [10, 54] : [8, 56];
  return {
    name:`NIVEL ${idx + 1}`,
    tag:`STAGE ${idx + 1}`,
    bg,
    length:1200,
    groundRatio: bg === 'city' ? 0.34 : bg === 'urban' ? 0.32 : 0.30,
    waves:[
      { x:150, enemies:[['small',3]] },
      { x:500, enemies:[['small',2],['thrower',1]] },
      { x:900, enemies:[['big',1],['small',2]] }
    ],
    waveEnemyBonus:0,
    laneMinZ:lanes[0],
    laneMaxZ:lanes[1],
    spawnLimit:12,
    spawnWindowSeconds:18,
    scenery: defaultSceneryFor(bg)
  };
}

    card.appendChild(title);

      selectRow(card, `Nivel ${k + 1}`, stageOptions, group.stages[k], value => {

    });

      const row = document.createElement('div');
      row.className = 'cfg-row';
      row.appendChild(cfgMiniButton('✕ QUITAR SET', 'Eliminar este set', () => {
        if(!confirm(`Quitar el set "${group.name}"?`)) return;
        sg.groups.splice(gIdx, 1);

        refreshConfigContent();
      }));

    }

    const len = CONFIG.stages.length;
    sg.groups.push({
      name:`SET ${String.fromCharCode(65 + (sg.groups.length % 26))}`,
      stages:[0, Math.min(1, len - 1), Math.min(2, len - 1)]

    numberRow(card, 'MIDI spawn limit', stage, 'spawnLimit', 1);
    numberRow(card, 'MIDI spawn window (seg)', stage, 'spawnWindowSeconds', 1);
    rangeRow(card, 'Ground ratio', stage, 'groundRatio', 0.2, 0.7, 0.01);
    rangeRow(card, 'Lane near Z', stage, 'laneMinZ', LANE_EDIT_MIN, LANE_EDIT_MAX - LANE_MIN_SPAN, 1);
    rangeRow(card, 'Lane far Z', stage, 'laneMaxZ', LANE_EDIT_MIN + LANE_MIN_SPAN, LANE_EDIT_MAX, 1);

    // ---- Editor de oleadas ----
    if(!Array.isArray(stage.waves)) stage.waves = [];
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = `Oleadas (${stage.waves.length})`;
    summary.style.cursor = 'pointer';
    summary.style.color = '#ffea00';
    summary.style.margin = '8px 0';
    details.appendChild(summary);
    stage.waves.forEach((wave, wIdx) => {
      numberRow(details, `Oleada ${wIdx + 1} — X`, wave, 'x', 10);
      Object.keys(CONFIG.enemies).forEach(type => {
        const proxy = {
          get count(){
            const entry = (wave.enemies || []).find(en => en && en[0] === type);
            return entry ? entry[1] : 0;
          },
          set count(value){
            const val = Math.max(0, Math.round(value));
            wave.enemies = Array.isArray(wave.enemies) ? wave.enemies : [];
            const entry = wave.enemies.find(en => en && en[0] === type);
            if(entry){
              if(val <= 0) wave.enemies.splice(wave.enemies.indexOf(entry), 1);
              else entry[1] = val;
            } else if(val > 0){
              wave.enemies.push([type, val]);
            }
          }
        };
        numberRow(details, ` · ${type}`, proxy, 'count', 1);
      });
      const delRow = document.createElement('div');
      delRow.className = 'cfg-row';
      delRow.appendChild(cfgMiniButton(`✕ QUITAR OLEADA ${wIdx + 1}`, 'Eliminar esta oleada', () => {
        stage.waves.splice(wIdx, 1);

        refreshConfigContent();
      }));
      details.appendChild(delRow);
    });
    const addWave = document.createElement('button');
    addWave.className = 'cfg-button';
    addWave.textContent = 'AÑADIR OLEADA';
    addWave.addEventListener('click', () => {
      const lastWave = stage.waves[stage.waves.length - 1];
      stage.waves.push({
        x: Math.min(stage.length, (lastWave && typeof lastWave.x === 'number' ? lastWave.x : 0) + 250),
        enemies:[['small', 3]]
      });
      applyConfigToLiveGame();
      refreshConfigContent();

    details.appendChild(addWave);

        if(!confirm(`Eliminar el nivel "${stage.name}" del pool? Los sets que lo usaban se reasignan.`)) return;
        CONFIG.stages.splice(sIdx, 1);
        // Reasignar referencias de los sets: el nivel borrado pasa a 0 y los
        // indices superiores se corren uno hacia abajo.
        sg.groups.forEach(group => {
          group.stages = group.stages.map(i => i === sIdx ? 0 : (i > sIdx ? i - 1 : i));
        });
        if(decorSelectedStage >= sIdx) decorSelectedStage = Math.max(0, decorSelectedStage - 1);
        applyConfigToLiveGame();
        refreshConfigContent();
        showToast(`Nivel eliminado: ${stage.name}`);
      }));
    }
    card.appendChild(manageRow);
    grid.appendChild(card);
  });
  section.appendChild(grid);

  const addStageRow = document.createElement('div');
  addStageRow.className = 'cfg-row';

  addLabel.textContent = 'Crear nivel nuevo';
  addStageRow.appendChild(addLabel);

      showToast(`Nivel creado: ${stage.name} (${label})`);
    }));
  });
  section.appendChild(addStageRow);
  noteRow(section, 'El nivel nuevo trae 3 oleadas base y el escenario de su plantilla. Ajusta sus oleadas aqui y su decoracion en DECOR; luego asignalo a un set arriba para que entre en rotacion.');
  root.appendChild(section);

  select.style.border = '1px solid #00f0ff';
  select.style.padding = '6px';

    select.appendChild(optionEl);
  });
  select.addEventListener('change', () => onChange(select.value));
  row.append(label, select);
  appendRow(section, row);
  return select;
}

let decorSelectedStage = 0;
let decorAddType = 'mountains';
let decorPreviewCam = 0;
let decorPreviewTime = 0;
let decorPreviewRafId = 0;
const DECOR_PREVIEW_OPTS = { scroll:true, progress:0 };

// Materializa stage.scenery si el nivel todavia dibujaba con la plantilla
// implicita de su bg (configs viejos): a partir de aqui es editable.
function ensureStageScenery(stage){
  if(!isObject(stage.scenery) || !Array.isArray(stage.scenery.layers) || !stage.scenery.layers.length){
    stage.scenery = defaultSceneryFor(stage.bg);
    applyConfigToLiveGame();
  }
  return stage.scenery;
}

// Ejecuta fn con el render redirigido al canvas de la vista previa y el
// stage en edicion como stage activo (camara/tiempo de la preview).
function runInDecorPreviewContext(stage, pctx, fn){
  const oldCtx = ctx;
  const oldCam = game.cameraX;
  const oldTime = game.time;
  ctx = pctx;
  decorPreviewStage = stage;
  game.cameraX = decorPreviewCam;
  game.time = decorPreviewTime;
  try {
    fn();
  } finally {
    ctx = oldCtx;
    game.cameraX = oldCam;
    game.time = oldTime;
    decorPreviewStage = null;
  }
}
function renderDecorPreviewFrame(pctx){
  const stage = CONFIG.stages[clamp(decorSelectedStage, 0, CONFIG.stages.length - 1)];
  if(!stage) return;
  runInDecorPreviewContext(stage, pctx, drawStageBackground);
}

// ==== MODO PINTAR (estilo Paint) ====
// Estado del pincel + picking por colores-ID: para saber que elemento y que
// clave de color hay bajo el cursor, se re-dibuja cada capa (de adelante
// hacia atras) en un canvas oculto con cada clave de color reemplazada por
// un color-identificador rgb(40, 10+idx*24, 250); el pixel leido decodifica
// la clave. Colores hardcodeados del renderer (brillos, llamas) caen a la
// clave principal de la capa.
const DECOR_PAINT = { enabled:true, tool:'brush', color:'#ff2e88', size:3 };
const DECOR_PAINT_SWATCHES = ['#ff2e88','#00f0ff','#ffea00','#9b30ff','#00ff7f','#ff4040','#ff7e1a','#ffffff','#aaaaaa','#000000','#5a3070','#d4a76a'];
function paintToolsConfig(){
  sanitizePaintToolsConfig();
  return CONFIG.paintTools;
}
function collectDecorWorldColors(stage){
  const scenery = ensureStageScenery(stage);
  const colors = [];
  const add = value => {
    const color = safeHexColor(value, null);
    if(color) colors.push(color);
  };
  (scenery.savedColors || []).forEach(add);
  (scenery.sky || []).forEach(stop => add(stop && stop.c));
  (scenery.brushStrokes || []).forEach(stroke => add(stroke && stroke.color));
  (scenery.layers || []).forEach(layer => {
    Object.values(layer && layer.colors || {}).forEach(add);
    (layer && layer.brushStrokes || []).forEach(stroke => add(stroke && stroke.color));
  });
  return sanitizeHexColorList(colors, 48);
}
function rememberDecorWorldColor(stage, value, persist = true){
  const color = safeHexColor(value, null);
  if(!stage || !color) return null;
  const scenery = ensureStageScenery(stage);
  scenery.savedColors = sanitizeHexColorList([
    color,
    ...(Array.isArray(scenery.savedColors) ? scenery.savedColors : [])
  ], 48);
  if(persist) applyConfigToLiveGame();
  return color.toLowerCase();
}
let decorPickCtxCache = null;
function decorPickCtx(){
  if(!decorPickCtxCache){
    const pickCanvas = document.createElement('canvas');
    pickCanvas.width = W;
    pickCanvas.height = H;
    decorPickCtxCache = pickCanvas.getContext('2d', { willReadFrequently:true });
  }
  return decorPickCtxCache;
}
// Detecta la clave de color de UNA capa en (x,y). Requiere estar dentro de
// runInDecorPreviewContext con ctx = canvas de picking. null = pixel vacio.
function pickDecorLayerKeyInContext(layer, gy, x, y){
  if(!layer || layer.on === false) return null;
  const def = DECOR_TYPES[layer.type];
  const renderer = DECOR_RENDERERS[layer.type];
  if(!def || !renderer) return null;
  const keys = Object.keys(def.colors || {});
  if(!keys.length) return null;
  const idColors = {};
  keys.forEach((key, idx) => { idColors[key] = `rgb(40,${10 + idx * 24},250)`; });
  ctx.clearRect(0, 0, W, H);
  const proxy = Object.assign({}, layer, { colors:idColors, fx:false });
  renderer(proxy, gy);
  // Los elementos extra del crecimiento tambien deben ser pintables
  drawDecorGrowthPasses(proxy, renderer, gy);
  const data = ctx.getImageData(x, y, 1, 1).data;
  if(data[3] === 0) return null;
  if(Math.abs(data[0] - 40) <= 10 && data[2] >= 225){
    const idx = Math.round((data[1] - 10) / 24);
    if(idx >= 0 && idx < keys.length && Math.abs(data[1] - (10 + idx * 24)) <= 10){
      return { key: keys[idx] };
    }
  }
  // Pixel de un color fijo del renderer (destello/llama): clave principal
  return { key: keys[0], fallback:true };
}
// Elemento bajo el cursor en la escena completa: capas de adelante hacia
// atras; si ninguna pega, la parada del gradiente de cielo mas cercana.
function pickDecorElementAt(stage, x, y){
  const scenery = stageSceneryData(stage);
  let result = null;
  runInDecorPreviewContext(stage, decorPickCtx(), () => {
    const gy = groundY();
    for(let i = scenery.layers.length - 1; i >= 0; i--){
      const hit = pickDecorLayerKeyInContext(scenery.layers[i], gy, x, y);
      if(hit){
        result = { layerIdx:i, layer:scenery.layers[i], key:hit.key, fallback:!!hit.fallback };
        return;
      }
    }
    if(y < gy && Array.isArray(scenery.sky) && scenery.sky.length){
      const rel = gy > 0 ? y / gy : 0;
      let best = 0;
      scenery.sky.forEach((stop, idx) => {
        const cur = Math.abs((Number(stop.p) || 0) - rel);
        const bestDist = Math.abs((Number(scenery.sky[best].p) || 0) - rel);
        if(cur < bestDist) best = idx;
      });
      result = { skyStop: best };
    }
  });
  return result;
}
function renderDecorLayerMaskInContext(layer, gy){
  const def = DECOR_TYPES[layer && layer.type];
  const renderer = DECOR_RENDERERS[layer && layer.type];
  if(!def || !renderer) return false;
  const maskColors = {};
  Object.keys(def.colors || {}).forEach(key => { maskColors[key] = '#ffffff'; });
  ctx.clearRect(0, 0, W, H);
  const proxy = Object.assign({}, layer, { colors:maskColors, fx:false, brushStrokes:[] });
  renderer(proxy, gy);
  drawDecorGrowthPasses(proxy, renderer, gy);
  return true;
}
function pointSegmentDistanceSq(px, py, ax, ay, bx, by){
  const dx = bx - ax;
  const dy = by - ay;
  if(dx === 0 && dy === 0) return (px - ax) ** 2 + (py - ay) ** 2;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  const qx = ax + dx * t;
  const qy = ay + dy * t;
  return (px - qx) ** 2 + (py - qy) ** 2;
}
// Rasteriza un segmento del pincel, recortado por la silueta de la capa. Los
// pixeles se guardan en coordenadas de mundo/parallax, por lo que permanecen
// pegados al elemento mientras la camara avanza en el juego.
function addDecorBrushSegment(stage, target, from, to, stroke, seen){
  if(!target || !stroke || !from || !to) return 0;
  const size = clamp(Math.round(Number(DECOR_PAINT.size) || 1), 1, 16);
  const radius = Math.max(0.5, size * 0.5);
  const left = clamp(Math.floor(Math.min(from.x, to.x) - radius), 0, W - 1);
  const top = clamp(Math.floor(Math.min(from.y, to.y) - radius), 0, H - 1);
  const right = clamp(Math.ceil(Math.max(from.x, to.x) + radius), 0, W - 1);
  const bottom = clamp(Math.ceil(Math.max(from.y, to.y) + radius), 0, H - 1);
  const width = right - left + 1;
  const height = bottom - top + 1;
  let mask = null;
  if(target.layer){
    runInDecorPreviewContext(stage, decorPickCtx(), () => {
      if(renderDecorLayerMaskInContext(target.layer, groundY())){
        mask = ctx.getImageData(left, top, width, height).data;
      }
    });
    if(!mask) return 0;
  }
  const parallax = target.layer && DECOR_TYPES[target.layer.type].scroll ? (target.layer.px ?? 0.5) : 0;
  const worldOffset = decorPreviewCam * parallax;
  let added = 0;
  for(let y = top; y <= bottom; y++){
    for(let x = left; x <= right; x++){
      if(pointSegmentDistanceSq(x + 0.5, y + 0.5, from.x, from.y, to.x, to.y) > radius * radius) continue;
      if(mask){
        const alphaIndex = (((y - top) * width + (x - left)) * 4) + 3;
        if(mask[alphaIndex] === 0) continue;
      }
      const worldX = Math.round(x + worldOffset);
      const key = `${worldX},${y}`;
      if(seen.has(key)) continue;
      seen.add(key);
      stroke.points.push(worldX, y);
      added++;
    }
  }
  return added;
}
function refreshDecorTabPreservingScroll(){
  const scroll = configContent.scrollTop;
  refreshConfigContent();
  configContent.scrollTop = scroll;

// Mapa raton -> pixel logico de un canvas de edicion (caja de contenido,
// sin el borde de 1px que getBoundingClientRect si incluye).
function paintCanvasPos(canvasEl, event, logicalW, logicalH){
  const bounds = canvasEl.getBoundingClientRect();
  const innerW = canvasEl.clientWidth || bounds.width;
  const innerH = canvasEl.clientHeight || bounds.height;
  return {
    x: clamp(Math.floor((event.clientX - bounds.left - canvasEl.clientLeft) * (logicalW / innerW)), 0, logicalW - 1),
    y: clamp(Math.floor((event.clientY - bounds.top - canvasEl.clientTop) * (logicalH / innerH)), 0, logicalH - 1)
  };
}

// Lapiz generico sobre un canvas de edicion: mousedown pinta, arrastrar
// sigue pintando en tiempo real, y al soltar se guarda + refresca el panel
// (asi no se reconstruye el DOM en mitad del trazo). Click derecho toma el
// color de la parte bajo el cursor (cuentagotas).
function attachPaintPencil(canvasEl, handlers){
  let stroking = false;
  let lastPickTs = 0;
  const syncCursor = () => {
    canvasEl.style.cursor = handlers.cursor
      ? handlers.cursor()
      : (DECOR_PAINT.tool === 'eyedropper' ? 'copy' : 'crosshair');
  };
  syncCursor();
  canvasEl.addEventListener('mouseenter', syncCursor);
  canvasEl.addEventListener('mousedown', event => {
    if(event.button !== 0) return;
    syncCursor();
    if(DECOR_PAINT.tool === 'eyedropper'){
      if(handlers.canEyedrop && !handlers.canEyedrop(event)) return;
      event.preventDefault();
      const pick = handlers.pickAt(event);
      handlers.onHover(pick);
      handlers.eyedrop(pick);
      return;
    }
    if(!DECOR_PAINT.enabled || (handlers.canStart && !handlers.canStart(event))) return;
    event.preventDefault();
    stroking = true;
    const pick = handlers.pickAt(event);
    handlers.onHover(pick);
    if(handlers.begin) handlers.begin(pick);
    if(pick && handlers.mutate(pick)){
      handlers.dirty();
      if(handlers.afterMutate) handlers.afterMutate();
    }
  });
  canvasEl.addEventListener('mousemove', event => {
    syncCursor();
    if(!stroking && handlers.canHover && !handlers.canHover(event)) return;
    const now = performance.now();
    if(!stroking && now - lastPickTs < 40) return;
    lastPickTs = now;
    const pick = handlers.pickAt(event);
    handlers.onHover(pick);
    if(stroking && DECOR_PAINT.enabled && pick && handlers.mutate(pick)){
      handlers.dirty();
      if(handlers.afterMutate) handlers.afterMutate();
    }
  });
  const finish = () => {
    if(!stroking) return;
    stroking = false;
    if(handlers.end) handlers.end();
    handlers.commit();
  };
  canvasEl.addEventListener('mouseup', finish);
  canvasEl.addEventListener('mouseleave', finish);
  canvasEl.addEventListener('contextmenu', event => {
    event.preventDefault();

function startDecorPreviewLoop(canvasEl){
  if(decorPreviewRafId) cancelAnimationFrame(decorPreviewRafId);
  const pctx = canvasEl.getContext('2d');
  pctx.imageSmoothingEnabled = false;
  const step = () => {
    if(!canvasEl.isConnected){ decorPreviewRafId = 0; return; }
    decorPreviewTime += 1;
    if(DECOR_PREVIEW_OPTS.scroll){
      const stage = CONFIG.stages[clamp(decorSelectedStage, 0, CONFIG.stages.length - 1)];
      const maxCam = Math.max(1, (Number(stage && stage.length) || W * 2) * (Number(CONFIG.general.stageLengthMul) || 1) - W);
      decorPreviewCam = (decorPreviewCam + 0.6) % maxCam;
    }
    renderDecorPreviewFrame(pctx);
    // Miniaturas de capas: una por frame (round-robin) para mantenerlas
    // vivas (colores/seed/escala) sin costar 15 renders por frame.
    if(decorThumbQueue.length){
      decorThumbIdx = (decorThumbIdx + 1) % decorThumbQueue.length;
      const thumb = decorThumbQueue[decorThumbIdx];
      if(thumb.canvas.isConnected){
        renderDecorLayerThumb(thumb.stage, thumb.layer, thumb.ctx);
      }
    }
    decorPreviewRafId = requestAnimationFrame(step);
  };
  decorPreviewRafId = requestAnimationFrame(step);
}

function renderDecorTab(root){

  const scenery = ensureStageScenery(stage);

  const section = makeSection('Editor de escenario');
  noteRow(section, 'Editor visual del mundo: el pincel guarda pixeles locales con grosor real; los controles de color cambian la paleta completa de una parte. Cada capa conserva orden, transformacion, parallax y generacion procedural independientes.');

  checkboxRow(section, 'Animar scroll de la vista previa', DECOR_PREVIEW_OPTS, 'scroll');
  rangeRow(section, 'Avance del nivel (preview crecimiento)', DECOR_PREVIEW_OPTS, 'progress', 0, 1, 0.05);

  // ---- Lapiz (estilo Paint) ----
  const paintUI = appendPaintControls(section, 'Lapiz local: manten pulsado y ARRASTRA para pintar solo los pixeles recorridos con el grosor elegido. El trazo queda anclado al parallax de su capa. GOTERO o click derecho toman colores. Congela el scroll para apuntar mejor.', { stage });
  const paintStatus = paintUI.status;

  const describePick = pick => {

    if(pick.skyStop != null){

      return `CIELO · parada ${pick.skyStop + 1} (${stop ? stop.c : '?'})`;
    }
    if(!pick.layer) return 'Sin elemento bajo el cursor.';
    const def = DECOR_TYPES[pick.layer.type];
    const keyLabel = (def.colors && def.colors[pick.key]) || pick.key;

    const next = { x:pick.x, y:pick.y };

      addDecorBrushSegment(stage, activeBrush, activeBrush.last, next, activeBrush.stroke, activeBrush.seen)

      ? (scenery.sky[pick.skyStop] && scenery.sky[pick.skyStop].c)
