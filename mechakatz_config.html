  numberRow(section, 'Retry ms', CONFIG.remote, 'retryMs', 100);
  numberRow(section, 'Snapshot frames', CONFIG.remote, 'snapshotIntervalFrames', 1);
  noteRow(section, REMOTE_STATE.connected
    ? `${remoteMode() === 'online' ? 'Servicio online' : 'Hub LAN'} conectado.`
    : REMOTE_STATE.connecting
      ? 'Creando o conectando la sesion...'
    : REMOTE_STATE.superseded
      ? 'Otro host tomo el control del hub (otra pestana/ventana del juego). Esta instancia se pauso para no pelear. Cierra la otra o pulsa "Reconectar hub" para retomar.'
      : (REMOTE_STATE.lastMessage || 'Servicio remoto sin conectar.'));
  if(REMOTE_STATE.roomUrl) noteRow(section, `Panel QR: ${REMOTE_STATE.roomUrl}`);
  REMOTE_STATE.joinUrls.forEach((url, idx) => {
    if(url) noteRow(section, `${slotLabel(idx)} URL: ${url}`);
  });
  REMOTE_STATE.streamUrls.forEach((url, idx) => {
    if(url) noteRow(section, `${slotLabel(idx)} VIDEO URL: ${url}`);
  });

  const reconnect = document.createElement('button');
  reconnect.textContent = remoteMode() === 'online' ? 'Crear nueva sesion' : 'Reconectar hub';
  reconnect.style.marginTop = '14px';
  reconnect.style.padding = '10px 12px';
  reconnect.style.border = '1px solid var(--green)';
  reconnect.style.background = '#000';
  reconnect.style.color = 'var(--green)';
  reconnect.style.cursor = 'pointer';
  reconnect.addEventListener('click', () => {
    closeRemoteConnection(false, true);
    connectRemoteHost();
    refreshConfigContent();
  });
  section.appendChild(reconnect);
  root.appendChild(section);
}
function renderMidiTab(root){
  const section = makeSection('MIDI');
  noteRow(section, 'Activa hasta 2 dispositivos y mapea cada evento del show.');
  checkboxRow(section, 'Enable network relay MIDI', CONFIG.midi.network, 'enabled');
  textRow(section, 'Relay WS URL', CONFIG.midi.network, 'wsUrl');
  textRow(section, 'Relay room', CONFIG.midi.network, 'room');
  numberRow(section, 'Relay retry ms', CONFIG.midi.network, 'retryMs', 100);
  noteRow(section, NET_MIDI_STATE.connected
    ? `Relay MIDI conectado a ${NET_MIDI_STATE.url || CONFIG.midi.network.wsUrl} · sala ${NET_MIDI_STATE.room || CONFIG.midi.network.room}${NET_MIDI_STATE.clients ? ` · ${NET_MIDI_STATE.clients} cliente(s)` : ''}.`
    : (CONFIG.midi.network.enabled ? `Relay MIDI buscando ${CONFIG.midi.network.wsUrl} · sala ${CONFIG.midi.network.room || 'midivj'}.` : 'Relay MIDI apagado.')
  );
  if(NET_MIDI_STATE.lastMessage) noteRow(section, `Ultimo paquete: ${NET_MIDI_STATE.lastMessage}`);

  const relayReconnect = document.createElement('button');
  relayReconnect.textContent = 'Reconectar relay MIDI';
  relayReconnect.style.marginTop = '8px';
  relayReconnect.style.padding = '10px 12px';
  relayReconnect.style.border = '1px solid var(--yellow)';
  relayReconnect.style.background = '#000';
  relayReconnect.style.color = 'var(--yellow)';
  relayReconnect.style.cursor = 'pointer';
  relayReconnect.addEventListener('click', () => {
    closeNetMidiConnection();
    connectNetMidi();
    refreshConfigContent();
  });
  section.appendChild(relayReconnect);

  const devices = document.createElement('div');
  devices.className = 'midi-devices';
  if(midiDevices.size === 0){
    noteRow(section, 'No hay dispositivos MIDI detectados ahora mismo.');
  } else {
    midiDevices.forEach((input, id) => {
      const row = document.createElement('div');
      row.className = 'midi-dev';
      if(CONFIG.midi.enabledDevices.includes(id)) row.classList.add('active');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = CONFIG.midi.enabledDevices.includes(id);
      checkbox.addEventListener('change', () => {
        if(checkbox.checked){
          if(CONFIG.midi.enabledDevices.length >= CONFIG.midi.maxDevices){
            checkbox.checked = false;
            showToast(`Solo ${CONFIG.midi.maxDevices} dispositivos activos`);
            return;
          }
          CONFIG.midi.enabledDevices.push(id);
        } else {
          CONFIG.midi.enabledDevices = CONFIG.midi.enabledDevices.filter(deviceId => deviceId !== id);
        }
        refreshMidiDevices();
      });
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = input.name || id;
      const dot = document.createElement('div');
      dot.className = 'dot';
      row.append(checkbox, name, dot);
      devices.appendChild(row);
    });
  }
  section.appendChild(devices);

  noteRow(section, 'KEY: tecla del teclado para disparar el evento sin MIDI (util para testear). Usa LEARN KEY para asignar.');
  const mappings = document.createElement('div');
  mappings.className = 'midi-mappings';
  for(const eventName of Object.keys(CONFIG.midi.mappings)){
    const mapping = CONFIG.midi.mappings[eventName];
    const row = document.createElement('div');
    row.className = 'midi-map-row';

    const label = document.createElement('div');
    label.className = 'ev';
    label.textContent = MIDI_EVENT_LABELS[eventName] || eventName;

    const typeSelect = document.createElement('select');
    ['noteon','cc','pc'].forEach(type => {
      const option = document.createElement('option');
      option.value = type;
      option.textContent = type.toUpperCase();
      option.selected = mapping.type === type;
      typeSelect.appendChild(option);
    });
    typeSelect.addEventListener('change', () => {
      mapping.type = typeSelect.value;
      applyConfigToLiveGame();
    });

    const noteInput = document.createElement('input');
    noteInput.type = 'number';
    noteInput.min = 0;
    noteInput.max = 127;
    noteInput.value = mapping.note;
    noteInput.addEventListener('input', () => {
      mapping.note = clamp(parseInt(noteInput.value || '0', 10), 0, 127);
      noteInput.value = mapping.note;
      applyConfigToLiveGame();
    });

    const channelSelect = document.createElement('select');
    for(let ch = 0; ch <= 16; ch++){
      const option = document.createElement('option');
      option.value = ch;
      option.textContent = ch === 16 ? 'ANY' : `CH ${ch + 1}`;
      option.selected = mapping.ch === ch;
      channelSelect.appendChild(option);
    }
    channelSelect.addEventListener('change', () => {
      mapping.ch = parseInt(channelSelect.value, 10);
      applyConfigToLiveGame();
    });

    const learn = document.createElement('button');
    learn.textContent = 'LEARN';
    if(midiLearnTarget === eventName) learn.classList.add('listening');
    learn.addEventListener('click', () => {
      midiLearnTarget = midiLearnTarget === eventName ? null : eventName;
      keyLearnTarget = null;
      refreshConfigContent();
      if(midiLearnTarget) showToast('Esperando siguiente mensaje MIDI');
    });

    // === KEY columns: input editable + LEARN KEY ===
    const keyInput = document.createElement('input');
    keyInput.type = 'text';
    keyInput.className = 'key-input';
    keyInput.value = (mapping.key || '').toUpperCase();
    keyInput.placeholder = '-';
    keyInput.title = 'Tecla del teclado (vacio = sin tecla)';
    keyInput.maxLength = 16;
    keyInput.addEventListener('change', () => {
      const v = normalizeHotkeyName(keyInput.value);
      // Limpiar colisiones: si otro evento ya tenia esta tecla, vaciar el otro.
      if(v){
        for(const otherEv of Object.keys(CONFIG.midi.mappings)){
          if(otherEv !== eventName && CONFIG.midi.mappings[otherEv].key === v){
            CONFIG.midi.mappings[otherEv].key = '';
          }
        }
      }
      mapping.key = v;
      applyConfigToLiveGame();
      refreshConfigContent();
    });
    // Click en el input cuando esta vacio: tambien ofrece entrar a LEARN
    keyInput.addEventListener('focus', () => {
      // No auto-learn — el usuario puede teclear directamente. Si quiere
      // capturar, usa el boton LEARN KEY. Esto evita que tabular al input
      // arme un learn accidental.
    });

    const keyLearn = document.createElement('button');
    keyLearn.className = 'key-learn';
    keyLearn.textContent = 'LEARN KEY';
    if(keyLearnTarget === eventName) keyLearn.classList.add('listening');
    keyLearn.addEventListener('click', () => {
      keyLearnTarget = keyLearnTarget === eventName ? null : eventName;
      midiLearnTarget = null;
      refreshConfigContent();
      if(keyLearnTarget) showToast('Pulsa la tecla a asignar');
    });

    row.append(label, typeSelect, noteInput, channelSelect, learn, keyInput, keyLearn);
    mappings.appendChild(row);
  }
  section.appendChild(mappings);

  const resetBtn = document.createElement('button');
  resetBtn.textContent = 'Reset MIDI mappings';
  resetBtn.style.marginTop = '14px';
  resetBtn.style.padding = '10px 12px';
  resetBtn.style.border = '1px solid var(--cyan)';
  resetBtn.style.background = '#000';
  resetBtn.style.color = 'var(--cyan)';
  resetBtn.style.cursor = 'pointer';
  resetBtn.addEventListener('click', () => {
    CONFIG.midi.mappings = deepClone(DEFAULT_CONFIG.midi.mappings);
    midiLearnTarget = null;
    keyLearnTarget = null;
    applyConfigToLiveGame();
    refreshConfigContent();
    showToast('MIDI mappings reset');
  });
  section.appendChild(resetBtn);
  root.appendChild(section);
}
function renderPresetsTab(root){
  const section = makeSection('Presets');
  const grid = document.createElement('div');
  grid.className = 'preset-grid';
  for(const key of Object.keys(PRESETS)){
    const preset = PRESETS[key];
    const card = document.createElement('div');
    card.className = 'preset-card';
    card.innerHTML = `<h4>${preset.label}</h4><p>${preset.desc}</p>`;
    card.addEventListener('click', () => {
      const midiState = deepClone(CONFIG.midi);
      const scoreboardState = deepClone(CONFIG.scoreboard);
      CONFIG = preset.apply();
      CONFIG.midi = midiState;
      CONFIG.scoreboard = scoreboardState;
      applyConfigToLiveGame();
      refreshConfigContent();
      showToast(`Preset: ${preset.label}`);
    });
    grid.appendChild(card);
  }
  section.appendChild(grid);
  root.appendChild(section);
}

function renderConfigTabs(){
  configTabs.innerHTML = '';
  for(const tab of CONFIG_TABS){
    const button = document.createElement('button');
    button.textContent = tab.label;
    if(tab.id === currentConfigTab) button.classList.add('active');
    button.addEventListener('click', () => {
      currentConfigTab = tab.id;
      renderConfigTabs();
      refreshConfigContent();
    });
    configTabs.appendChild(button);
  }
}
function refreshConfigContent(){
  configContent.innerHTML = '';
  switch(currentConfigTab){
    case 'general': renderGeneralTab(configContent); break;
    case 'players': renderPlayersTab(configContent); break;
    case 'physics': renderPhysicsTab(configContent); break;
    case 'flight': renderFlightTab(configContent); break;
    case 'revive': renderReviveTab(configContent); break;
    case 'stages': renderStagesTab(configContent); break;
    case 'decor': renderDecorTab(configContent); break;
    case 'enemies': renderEnemiesTab(configContent); break;
    case 'boss': renderBossTab(configContent); break;
    case 'hud': renderHudTab(configContent); break;
    case 'text': renderTextTab(configContent); break;
    case 'remote': renderRemoteTab(configContent); break;
    case 'midi': renderMidiTab(configContent); break;
    case 'presets': renderPresetsTab(configContent); break;
  }
}

// Handle persistente del archivo JSON cargado (Chrome/Edge desktop con
// File System Access API). Si esta presente, exportConfig() puede sobre-
// escribir el mismo archivo en lugar de descargar uno nuevo.
let configFileHandle = null;

function slugifyForFilename(value){
  return String(value || '')
    .normalize('NFKD')
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '_')
    .toUpperCase()
    .slice(0, 24) || 'MECHAKATZ';
}
function buildExportFilename(){
  const runName = slugifyForFilename(CONFIG.scoreboard && CONFIG.scoreboard.currentRunName);
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
  return `MECHAKATZ_${runName}_${stamp}.json`;
}
async function writeConfigToHandle(handle){
  // Devuelve true si se pudo escribir al handle. False si fallo.
  try {
    if(!handle) return false;
    if(handle.queryPermission){
      const perm = await handle.queryPermission({ mode:'readwrite' });
      if(perm !== 'granted'){
        const req = await handle.requestPermission({ mode:'readwrite' });
        if(req !== 'granted') return false;
      }
    }
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(CONFIG, null, 2));
    await writable.close();
    return true;
  } catch(error){
    return false;
  }
}
function downloadConfigBlob(filename){
  const blob = new Blob([JSON.stringify(CONFIG, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename || buildExportFilename();
  link.click();
  URL.revokeObjectURL(url);
}
async function exportConfig(){
  // Si tenemos handle persistente, sobreescribir. Si no, descargar.
  if(configFileHandle){
    const ok = await writeConfigToHandle(configFileHandle);
    if(ok){
      showToast(`Guardado en ${configFileHandle.name || 'archivo'}`);
      return;
    }
    showToast('No se pudo escribir, descargando copia');
  }
  downloadConfigBlob(buildExportFilename());
}
async function autoExportOnGameEnd(){
  // Llamado al final de gameover/victory. Silencioso si todo va bien.
  if(!CONFIG.general || CONFIG.general.autoExportOnEnd === false) return;
  if(configFileHandle){
    const ok = await writeConfigToHandle(configFileHandle);
    if(ok){
      showToast(`Score guardado en ${configFileHandle.name || 'archivo'}`);
      return;
    }
    // Si fallo el handle (permisos revocados, archivo movido), caemos a download
  }
  // Fallback: descarga automatica con run name + timestamp en el filename
  downloadConfigBlob(buildExportFilename());
  showToast('Score exportado (descarga)');
}
// Permite al usuario "elegir" un archivo existente para que el auto-export
// sobreescriba ese mismo archivo en lugar de descargar copias nuevas.
async function pickConfigFileForPersistence(){
  if(!window.showOpenFilePicker){
    showToast('Tu navegador no soporta sobreescribir archivos');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description:'JSON config', accept:{ 'application/json':['.json'] } }],
      multiple: false
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    CONFIG = configFromSaved(parsed);
    configFileHandle = handle;
    applyConfigToLiveGame(false);
    refreshMidiDevices();
    renderConfigTabs();
    refreshConfigContent();
    showToast(`Archivo enlazado: ${handle.name}`);
  } catch(error){
    if(error && error.name !== 'AbortError'){
      showToast('No se pudo enlazar archivo');
    }
  }
}
// Siembra opcional desde ./MECHAKATZ.json. Solo aplica cuando el juego se
// sirve por HTTP (en file:// fetch falla y se ignora silenciosamente). Se
// llama unicamente si no habia config previa en localStorage.
async function tryAutoLoadConfigJson(){
  // En file:// el fetch esta prohibido (origenes file: unicos) y el navegador
  // loguea un aviso de seguridad aunque el catch lo trague; ni lo intentamos.
  if(location.protocol === 'file:') return;
  try {
    const res = await fetch('./MECHAKATZ.json', { cache:'no-store' });
    if(!res.ok) return;
    const parsed = await res.json();
    CONFIG = configFromSaved(parsed);
    applyConfigToLiveGame(false);
    refreshMidiDevices();
    renderConfigTabs();
    refreshConfigContent();
    showToast('Config cargada de MECHAKATZ.json');
  } catch(error){ /* file:// o archivo ausente: ignorar */ }
}
function importConfig(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      CONFIG = configFromSaved(parsed);
      applyConfigToLiveGame(false);
      refreshMidiDevices();
      renderConfigTabs();
      refreshConfigContent();
      showToast('Config importada');
    } catch(error){
      showToast('JSON invalido');
    }
  };
  reader.readAsText(file);
}

// ==== SINCRONIZACION CON EL JUEGO (localStorage compartido) ====
// El scoreboard lo escribe el JUEGO (scores al terminar partida). Antes de
// cada guardado re-adoptamos el scoreboard almacenado para no pisarlo.
saveConfigToStorage = function(){
  if(!configPersistReady) return;
  try {
    const stored = JSON.parse(localStorage.getItem(CONFIG_STORAGE_KEY) || "null");
    if(stored && stored.scoreboard) CONFIG.scoreboard = stored.scoreboard;
  } catch(error){ /* JSON corrupto: seguimos con el nuestro */ }
  try {
    const raw = JSON.stringify(CONFIG);
    localStorage.setItem(CONFIG_STORAGE_KEY, raw);
    lastSyncedConfigRaw = raw;
    if(syncNote) syncNote.textContent = 'Guardado ' + new Date().toLocaleTimeString() + ' — el juego lo aplica en vivo';
  } catch(error){
    if(syncNote) syncNote.textContent = 'SIN localStorage: los cambios no llegan al juego';
  }
};
// Cambios que llegan del juego (p. ej. scores nuevos). No re-renderizamos
// mientras se edita un campo para no robar el foco.
function adoptExternalConfig(raw){
  if(!raw || raw === lastSyncedConfigRaw) return;
  if(isTypingInField()) return;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(error){ return; }
  lastSyncedConfigRaw = raw;
  CONFIG = configFromSaved(parsed);
  renderConfigTabs();
  refreshConfigContent();
  showToast('Config sincronizada desde el juego');
}
window.addEventListener('storage', function(event){
  if(event.key !== CONFIG_STORAGE_KEY || event.newValue == null) return;
  adoptExternalConfig(event.newValue);
});
setInterval(function(){
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if(raw) adoptExternalConfig(raw);
  } catch(error){}
}, 5000);

// ==== TECLADO: LEARN KEY + Escape cancela learns ====
window.addEventListener('keydown', function(event){
  const key = normalizeHotkeyName(event.key);
  if(key === 'escape' && (midiLearnTarget || keyLearnTarget)){
    midiLearnTarget = null;
    keyLearnTarget = null;
    refreshConfigContent();
    return;
  }
  if(keyLearnTarget && !isTypingInField()){
    if(!['shift','control','alt','meta','tab','escape'].includes(key)){
      const target = keyLearnTarget;
      for(const otherEv of Object.keys(CONFIG.midi.mappings)){
        if(otherEv !== target && CONFIG.midi.mappings[otherEv].key === key){
          CONFIG.midi.mappings[otherEv].key = '';
        }
      }
      CONFIG.midi.mappings[target].key = key;
      keyLearnTarget = null;
      applyConfigToLiveGame();
      refreshConfigContent();
      showToast('Tecla ' + key.toUpperCase() + ' asignada');
      event.preventDefault();
    }
  }
});

// ==== BOTONES DE PIE ====
document.getElementById('cfg-export').addEventListener('click', exportConfig);
document.getElementById('cfg-import').addEventListener('click', function(){ configFileInput.click(); });
configFileInput.addEventListener('change', function(event){
  const file = event.target.files && event.target.files[0];
  if(file) importConfig(file);
  configFileInput.value = '';
});
document.getElementById('cfg-reset').addEventListener('click', function(){
  if(!confirm('Resetear TODA la config a los valores por defecto? (se conservan MIDI y scores)')) return;
  const midiState = deepClone(CONFIG.midi);
  const scoreboardState = deepClone(CONFIG.scoreboard);
  CONFIG = deepClone(DEFAULT_CONFIG);
  CONFIG.midi = midiState;
  CONFIG.scoreboard = scoreboardState;
  applyConfigToLiveGame();
  renderConfigTabs();
  refreshConfigContent();
  showToast('Config reseteada');
});

// ==== ARRANQUE ====
const hadStoredConfig = loadConfigFromStorage();
applyConfigToLiveGame();
renderConfigTabs();
refreshConfigContent();
setupMIDI();
configPersistReady = true;
if(!hadStoredConfig) tryAutoLoadConfigJson();
configModal.classList.add('show');
if(syncNote) syncNote.textContent = hadStoredConfig
  ? 'Config cargada del navegador — compartida en vivo con el juego'
  : 'Config nueva (defaults): se guardara al primer cambio';
</script>
