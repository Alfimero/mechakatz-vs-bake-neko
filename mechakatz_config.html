// Opciones con `group` se agrupan en <optgroup> consecutivos.
function selectRow(section, labelText, options, value, onChange){
  const row = document.createElement('div');
  row.className = 'cfg-row text';
  const label = document.createElement('label');
  label.textContent = labelText;
  const select = document.createElement('select');
  select.style.flex = '1';
  select.style.background = '#000';
  select.style.color = '#00f0ff';
  select.style.border = '1px solid #00f0ff';
  select.style.padding = '6px';
  let groupName = null;
  let groupEl = null;
  options.forEach(opt => {
    const optionEl = document.createElement('option');
    optionEl.value = opt.value;
    optionEl.textContent = opt.label;
    if(String(opt.value) === String(value)) optionEl.selected = true;
    if(opt.group){
      if(opt.group !== groupName){
        groupEl = document.createElement('optgroup');
        groupEl.label = opt.group;
        select.appendChild(groupEl);
        groupName = opt.group;
      }
      groupEl.appendChild(optionEl);
    } else {
      select.appendChild(optionEl);
    }
  });
  select.addEventListener('change', () => onChange(select.value));
  row.append(label, select);
  appendRow(section, row);
  return select;
}

let decorSelectedStage = 0;
let decorAddType = 'mountains';
let decorNewWorldTemplate = 'forest';
let decorPreviewCam = 0;
let decorPreviewTime = 0;
let decorPreviewRafId = 0;
// level: -1 = escena base (lo que se pinta); 0..2 = look del nivel MAÑANA/TARDE/NOCHE.
const DECOR_PREVIEW_OPTS = { scroll:true, progress:0, level:-1 };

// Materializa stage.scenery si el nivel todavia dibujaba con la plantilla
// implicita de su bg (configs viejos): a partir de aqui es editable.
function ensureStageScenery(stage){
  if(!isObject(stage.scenery) || !Array.isArray(stage.scenery.layers) || !stage.scenery.layers.length){
    stage.scenery = defaultSceneryFor(stage.bg);
    applyConfigToLiveGame();
  }
  return stage.scenery;
}

// Ejecuta fn con el render redirigido al canvas de la vista previa y el
// stage en edicion como stage activo (camara/tiempo de la preview).
function runInDecorPreviewContext(stage, pctx, fn){
  const oldCtx = ctx;
  const oldCam = game.cameraX;
  const oldTime = game.time;
  ctx = pctx;
  decorPreviewStage = stage;
  game.cameraX = decorPreviewCam;
  game.time = decorPreviewTime;
  try {
    fn();
  } finally {
    ctx = oldCtx;
    game.cameraX = oldCam;
    game.time = oldTime;
    decorPreviewStage = null;
  }
}
function renderDecorPreviewFrame(pctx){
  const stage = CONFIG.stages[clamp(decorSelectedStage, 0, CONFIG.stages.length - 1)];
  if(!stage) return;
  runInDecorPreviewContext(stage, pctx, drawStageBackground);
}

// ==== MODO PINTAR (estilo Paint) ====
// Estado del pincel + picking por colores-ID: para saber que elemento y que
// clave de color hay bajo el cursor, se re-dibuja cada capa (de adelante
// hacia atras) en un canvas oculto con cada clave de color reemplazada por
// un color-identificador rgb(40, 10+idx*24, 250); el pixel leido decodifica
// la clave. Colores hardcodeados del renderer (brillos, llamas) caen a la
// clave principal de la capa.
const DECOR_PAINT = { enabled:true, tool:'brush', color:'#ff2e88', size:3 };
const DECOR_PAINT_SWATCHES = ['#ff2e88','#00f0ff','#ffea00','#9b30ff','#00ff7f','#ff4040','#ff7e1a','#ffffff','#aaaaaa','#000000','#5a3070','#d4a76a'];
function paintToolsConfig(){
  sanitizePaintToolsConfig();
  return CONFIG.paintTools;
}
function collectDecorWorldColors(stage){
  const scenery = ensureStageScenery(stage);
  const colors = [];
  const add = value => {
    const color = safeHexColor(value, null);
    if(color) colors.push(color);
  };
  (scenery.savedColors || []).forEach(add);
  (scenery.sky || []).forEach(stop => add(stop && stop.c));
  (scenery.brushStrokes || []).forEach(stroke => add(stroke && stroke.color));
  (scenery.layers || []).forEach(layer => {
    Object.values(layer && layer.colors || {}).forEach(add);
    (layer && layer.brushStrokes || []).forEach(stroke => add(stroke && stroke.color));
  });
  return sanitizeHexColorList(colors, 48);
}
function rememberDecorWorldColor(stage, value, persist = true){
  const color = safeHexColor(value, null);
  if(!stage || !color) return null;
  const scenery = ensureStageScenery(stage);
  scenery.savedColors = sanitizeHexColorList([
    color,
    ...(Array.isArray(scenery.savedColors) ? scenery.savedColors : [])
  ], 48);
  if(persist) applyConfigToLiveGame();
  return color.toLowerCase();
}
let decorPickCtxCache = null;
function decorPickCtx(){
  if(!decorPickCtxCache){
    const pickCanvas = document.createElement('canvas');
    pickCanvas.width = W;
    pickCanvas.height = H;
    decorPickCtxCache = pickCanvas.getContext('2d', { willReadFrequently:true });
  }
  return decorPickCtxCache;
}
// Detecta la clave de color de UNA capa en (x,y). Requiere estar dentro de
// runInDecorPreviewContext con ctx = canvas de picking. null = pixel vacio.
function pickDecorLayerKeyInContext(layer, gy, x, y){
  if(!layer || layer.on === false) return null;
  const def = DECOR_TYPES[layer.type];
  const renderer = DECOR_RENDERERS[layer.type];
  if(!def || !renderer) return null;
  // Fuera de su zona del nivel la capa no se ve: tampoco se puede pintar.
  if(decorZoneAlpha(layer) < 0.05) return null;
  const keys = Object.keys(def.colors || {});
  if(!keys.length) return null;
  const idColors = {};
  keys.forEach((key, idx) => { idColors[key] = `rgb(40,${10 + idx * 24},250)`; });
  ctx.clearRect(0, 0, W, H);
  const proxy = Object.assign({}, layer, { colors:idColors, fx:false });
  const offsetY = decorLayerOffsetY(layer);
  if(offsetY) ctx.translate(0, offsetY);
  try {
    withDecorHDSuppressed(() => {
      renderer(proxy, gy);
      // Los elementos extra del crecimiento tambien deben ser pintables
      drawDecorGrowthPasses(proxy, renderer, gy);
    });
  } finally {
    if(offsetY) ctx.translate(0, -offsetY);
  }
  const data = ctx.getImageData(x, y, 1, 1).data;
  if(data[3] === 0) return null;
  if(Math.abs(data[0] - 40) <= 10 && data[2] >= 225){
    const idx = Math.round((data[1] - 10) / 24);
    if(idx >= 0 && idx < keys.length && Math.abs(data[1] - (10 + idx * 24)) <= 10){
      return { key: keys[idx] };
    }
  }
  // Pixel de un color fijo del renderer (destello/llama): clave principal
  return { key: keys[0], fallback:true };
}
// Elemento bajo el cursor en la escena completa: capas de adelante hacia
// atras; si ninguna pega, la parada del gradiente de cielo mas cercana.
function pickDecorElementAt(stage, x, y){
  const scenery = stageSceneryData(stage);
  let result = null;
  runInDecorPreviewContext(stage, decorPickCtx(), () => {
    const gy = groundY();
    for(let i = scenery.layers.length - 1; i >= 0; i--){
      const hit = pickDecorLayerKeyInContext(scenery.layers[i], gy, x, y);
      if(hit){
        result = { layerIdx:i, layer:scenery.layers[i], key:hit.key, fallback:!!hit.fallback };
        return;
      }
    }
    if(y < gy && Array.isArray(scenery.sky) && scenery.sky.length){
      const rel = gy > 0 ? y / gy : 0;
      let best = 0;
      scenery.sky.forEach((stop, idx) => {
        const cur = Math.abs((Number(stop.p) || 0) - rel);
        const bestDist = Math.abs((Number(scenery.sky[best].p) || 0) - rel);
        if(cur < bestDist) best = idx;
      });
      result = { skyStop: best };
    }
  });
  return result;
}
function renderDecorLayerMaskInContext(layer, gy){
  const def = DECOR_TYPES[layer && layer.type];
  const renderer = DECOR_RENDERERS[layer && layer.type];
  if(!def || !renderer) return false;
  const maskColors = {};
  Object.keys(def.colors || {}).forEach(key => { maskColors[key] = '#ffffff'; });
  ctx.clearRect(0, 0, W, H);
  const proxy = Object.assign({}, layer, { colors:maskColors, fx:false, brushStrokes:[] });
  const offsetY = decorLayerOffsetY(layer);
  if(offsetY) ctx.translate(0, offsetY);
  try {
    withDecorHDSuppressed(() => {
      renderer(proxy, gy);
      drawDecorGrowthPasses(proxy, renderer, gy);
    });
  } finally {
    if(offsetY) ctx.translate(0, -offsetY);
  }
  return true;
}
function pointSegmentDistanceSq(px, py, ax, ay, bx, by){
  const dx = bx - ax;
  const dy = by - ay;
  if(dx === 0 && dy === 0) return (px - ax) ** 2 + (py - ay) ** 2;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  const qx = ax + dx * t;
  const qy = ay + dy * t;
  return (px - qx) ** 2 + (py - qy) ** 2;
}
// Rasteriza un segmento del pincel, recortado por la silueta de la capa. Los
// pixeles se guardan en coordenadas de mundo/parallax, por lo que permanecen
// pegados al elemento mientras la camara avanza en el juego.
function addDecorBrushSegment(stage, target, from, to, stroke, seen){
  if(!target || !stroke || !from || !to) return 0;
  const size = clamp(Math.round(Number(DECOR_PAINT.size) || 1), 1, 16);
  const radius = Math.max(0.5, size * 0.5);
  const left = clamp(Math.floor(Math.min(from.x, to.x) - radius), 0, W - 1);
  const top = clamp(Math.floor(Math.min(from.y, to.y) - radius), 0, H - 1);
  const right = clamp(Math.ceil(Math.max(from.x, to.x) + radius), 0, W - 1);
  const bottom = clamp(Math.ceil(Math.max(from.y, to.y) + radius), 0, H - 1);
  const width = right - left + 1;
  const height = bottom - top + 1;
  let mask = null;
  if(target.layer){
    runInDecorPreviewContext(stage, decorPickCtx(), () => {
      if(renderDecorLayerMaskInContext(target.layer, groundY())){
        mask = ctx.getImageData(left, top, width, height).data;
      }
    });
    if(!mask) return 0;
  }
  const parallax = target.layer ? decorLayerParallax(target.layer) : 0;
  const worldOffset = decorPreviewCam * parallax;
  // Los puntos se guardan en Y local de la capa (sin su yOff).
  const localOffsetY = target.layer ? decorLayerOffsetY(target.layer) : 0;
  let added = 0;
  for(let y = top; y <= bottom; y++){
    for(let x = left; x <= right; x++){
      if(pointSegmentDistanceSq(x + 0.5, y + 0.5, from.x, from.y, to.x, to.y) > radius * radius) continue;
      if(mask){
        const alphaIndex = (((y - top) * width + (x - left)) * 4) + 3;
        if(mask[alphaIndex] === 0) continue;
      }
      const worldX = Math.round(x + worldOffset);
      const localY = y - localOffsetY;
      const key = `${worldX},${localY}`;
      if(seen.has(key)) continue;
      seen.add(key);
      stroke.points.push(worldX, localY);

// Mapa raton -> pixel logico de un canvas de edicion (caja de contenido,
// sin el borde de 1px que getBoundingClientRect si incluye).
function paintCanvasPos(canvasEl, event, logicalW, logicalH){
  const bounds = canvasEl.getBoundingClientRect();
  const innerW = canvasEl.clientWidth || bounds.width;
  const innerH = canvasEl.clientHeight || bounds.height;
  return {
    x: clamp(Math.floor((event.clientX - bounds.left - canvasEl.clientLeft) * (logicalW / innerW)), 0, logicalW - 1),
    y: clamp(Math.floor((event.clientY - bounds.top - canvasEl.clientTop) * (logicalH / innerH)), 0, logicalH - 1)
  };
}

// Lapiz generico sobre un canvas de edicion: mousedown pinta, arrastrar
// sigue pintando en tiempo real, y al soltar se guarda + refresca el panel
// (asi no se reconstruye el DOM en mitad del trazo). Click derecho toma el
// color de la parte bajo el cursor (cuentagotas).
function attachPaintPencil(canvasEl, handlers){
  let stroking = false;
  let lastPickTs = 0;
  const syncCursor = () => {
    canvasEl.style.cursor = handlers.cursor
      ? handlers.cursor()
      : (DECOR_PAINT.tool === 'eyedropper' ? 'copy' : 'crosshair');
  };
  syncCursor();
  canvasEl.addEventListener('mouseenter', syncCursor);
  canvasEl.addEventListener('mousedown', event => {
    if(event.button !== 0) return;
    syncCursor();
    if(DECOR_PAINT.tool === 'eyedropper'){
      if(handlers.canEyedrop && !handlers.canEyedrop(event)) return;
      event.preventDefault();
      const pick = handlers.pickAt(event);
      handlers.onHover(pick);
      handlers.eyedrop(pick);
      return;
    }
    if(!DECOR_PAINT.enabled || (handlers.canStart && !handlers.canStart(event))) return;
    event.preventDefault();
    stroking = true;
    const pick = handlers.pickAt(event);
    handlers.onHover(pick);
    if(handlers.begin) handlers.begin(pick);
    if(pick && handlers.mutate(pick)){
      handlers.dirty();
      if(handlers.afterMutate) handlers.afterMutate();
    }
  });
  canvasEl.addEventListener('mousemove', event => {
    syncCursor();
    if(!stroking && handlers.canHover && !handlers.canHover(event)) return;
    const now = performance.now();
    if(!stroking && now - lastPickTs < 40) return;
    lastPickTs = now;
    const pick = handlers.pickAt(event);
    handlers.onHover(pick);
    if(stroking && DECOR_PAINT.enabled && pick && handlers.mutate(pick)){
      handlers.dirty();
      if(handlers.afterMutate) handlers.afterMutate();
    }
  });
  const finish = () => {
    if(!stroking) return;
    stroking = false;
    if(handlers.end) handlers.end();
    handlers.commit();
  };
  canvasEl.addEventListener('mouseup', finish);
  canvasEl.addEventListener('mouseleave', finish);
  canvasEl.addEventListener('contextmenu', event => {
    event.preventDefault();
    if(handlers.canEyedrop && !handlers.canEyedrop(event)) return;
    handlers.eyedrop(handlers.pickAt(event));
  });
}
// Controlador del pincel local de UN nivel. Lo comparten la pestaña DECOR,
// el visor grande de capa y el MODO DIBUJO. options:
//   status           elemento donde se describe lo que hay bajo el cursor
//   setColor(color)  aplica el color tomado con el gotero
//   onCommit()       tras guardar un trazo (p. ej. refrescar el panel)
//   onStroke(owner, stroke)  trazo terminado con pixeles (historial deshacer)
function createDecorBrushController(stage, options = {}){
  const scenery = ensureStageScenery(stage);
  let paintDirty = false;
  let activeBrush = null;
  const describePick = pick => {
    if(!pick) return 'Sin elemento bajo el cursor.';
    if(pick.skyStop != null){
      const stop = scenery.sky[pick.skyStop];
      return `CIELO · parada ${pick.skyStop + 1} (${stop ? stop.c : '?'})`;
    }
    if(!pick.layer) return 'Sin elemento bajo el cursor.';
    const def = DECOR_TYPES[pick.layer.type];
    const keyLabel = (def.colors && def.colors[pick.key]) || pick.key;
    return `${def.label} · ${keyLabel} (${pick.layer.colors[pick.key]})`;
  };
  const beginPaint = pick => {
    activeBrush = null;
    if(!pick || !Number.isFinite(pick.x) || !Number.isFinite(pick.y)) return;
    const layer = pick.layer || null;
    const owner = layer || (pick.skyStop != null ? scenery : null);
    if(!owner) return;
    owner.brushStrokes = Array.isArray(owner.brushStrokes) ? owner.brushStrokes : [];
    const stroke = { color:safeHexColor(DECOR_PAINT.color, '#ff2e88'), points:[] };
    owner.brushStrokes.push(stroke);
    activeBrush = {
      owner,
      layer,
      stroke,
      seen:new Set(),
      last:{ x:pick.x, y:pick.y },
      cameraX:Number.isFinite(pick.cameraX) ? pick.cameraX : decorPreviewCam
    };
  };
  const mutatePick = pick => {
    if(!activeBrush || !pick || !Number.isFinite(pick.x) || !Number.isFinite(pick.y)) return false;
    const next = { x:pick.x, y:pick.y };
    const added = withDecorPreviewCamera(activeBrush.cameraX, () =>
      addDecorBrushSegment(stage, activeBrush, activeBrush.last, next, activeBrush.stroke, activeBrush.seen)
    );
    activeBrush.last = next;
    return added > 0;
  };
  const endPaint = () => {
    if(activeBrush){
      if(!activeBrush.stroke.points.length){
        const strokes = activeBrush.owner.brushStrokes;
        const idx = strokes.indexOf(activeBrush.stroke);
        if(idx >= 0) strokes.splice(idx, 1);
      } else if(options.onStroke){
        options.onStroke(activeBrush.owner, activeBrush.stroke);
      }
    }
    activeBrush = null;
  };
  const commitPaint = () => {
    if(!paintDirty) return;
    paintDirty = false;
    applyConfigToLiveGame();
    if(options.onCommit) options.onCommit();
  };
  const eyedropPick = (pick, statusTarget) => {
    if(!pick || (pick.skyStop == null && !pick.layer)) return;
    const color = pick.skyStop != null
      ? (scenery.sky[pick.skyStop] && scenery.sky[pick.skyStop].c)
      : pick.layer.colors[pick.key];
    if(!color) return;
    if(options.setColor) options.setColor(color);
    if(statusTarget) statusTarget.textContent = `Cuentagotas: ${DECOR_PAINT.color} - ${describePick(pick)}`;
  };
  const handlers = (pickAt, afterMutate, handlerOptions = {}) => {
    const statusTarget = handlerOptions.status || options.status || null;
    return {
      pickAt,
      onHover: pick => {
        if(!statusTarget) return;
        statusTarget.textContent = activeBrush
          ? `Pintando ${activeBrush.layer ? DECOR_TYPES[activeBrush.layer.type].label : 'CIELO'} · ${DECOR_PAINT.size}px`
          : describePick(pick);
      },
      begin: beginPaint,
      mutate: mutatePick,
      dirty: () => { paintDirty = true; },
      afterMutate,
      end: endPaint,
      commit: commitPaint,
      eyedrop: pick => {
        eyedropPick(pick, statusTarget);
        if(handlerOptions.afterEyedrop) handlerOptions.afterEyedrop(pick);
      },
      canStart: handlerOptions.canStart,
      canHover: handlerOptions.canHover,
      canEyedrop: handlerOptions.canEyedrop,
      cursor: handlerOptions.cursor
    };
  };
  return { handlers, describePick, isPainting:() => !!activeBrush };
}

function withDecorPreviewCamera(cameraX, fn){

// MODO DIBUJO — editor de mundo a pantalla completa
// Muestra TODO el largo del nivel en una tira panoramica (un fotograma por

// capa elegida) y una vista grande editable en la posicion actual, con
// recorrido animado. Pinta con el mismo pincel local que DECOR
// (createDecorBrushController) y edita capas, zonas y parametros desde su
// panel lateral. Su camara es propia: nunca toca la partida.

  return Math.max(0, Math.round(length) - W);
}

  // ---- Vista principal ----
  const updateView = () => {
    canvasEl.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  };
  const centerView = () => {
    state.panX = Math.round((viewport.clientWidth - W * state.zoom) * 0.5);
    state.panY = Math.round((viewport.clientHeight - H * state.zoom) * 0.5);
    updateView();
  };
  const fitView = () => {
    const availableW = Math.max(100, viewport.clientWidth - 20);
    const availableH = Math.max(100, viewport.clientHeight - 20);
    state.zoom = clamp(Math.min(availableW / W, availableH / H), 0.5, 12);
    state.fit = true;
    centerView();
    syncToolbar();
  };
  const zoomAt = (nextZoom, clientX, clientY) => {
    const oldZoom = state.zoom;
    const newZoom = clamp(nextZoom, 0.5, 12);
    if(newZoom === oldZoom) return;
    const bounds = viewport.getBoundingClientRect();
    const focusX = Number.isFinite(clientX) ? clientX - bounds.left : viewport.clientWidth * 0.5;
    const focusY = Number.isFinite(clientY) ? clientY - bounds.top : viewport.clientHeight * 0.5;
    const canvasX = (focusX - state.panX) / oldZoom;
    const canvasY = (focusY - state.panY) / oldZoom;
    state.zoom = newZoom;
    state.fit = false;
    state.panX = focusX - canvasX * newZoom;
    state.panY = focusY - canvasY * newZoom;
    updateView();
    syncToolbar();
  };
  const renderMain = () => {
    decorLayerHighlight = state.highlight ? selectedLayer() : null;
    try {
      withEditorView(state.cameraX, pctx, () => {
        drawStageBackground();
        if(state.lanes){
          const y1 = Math.round(projY(laneMaxZ()));
          const y2 = Math.round(projY(laneMinZ()));
          ctx.save();
          ctx.globalAlpha = 0.16;
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(0, Math.min(y1, y2), W, Math.abs(y2 - y1));
          ctx.globalAlpha = 0.9;
          for(let x = 0; x < W; x += 6){
            ctx.fillRect(x, y1, 3, 1);
            ctx.fillRect(x, y2, 3, 1);
          }
          ctx.restore();
        }
      });
    } finally {
      decorLayerHighlight = null;
    }
  };
  const canvasPos = event => {
    const bounds = canvasEl.getBoundingClientRect();
    const scaleX = bounds.width / Math.max(1, canvasEl.offsetWidth);
    const scaleY = bounds.height / Math.max(1, canvasEl.offsetHeight);
    const innerLeft = bounds.left + canvasEl.clientLeft * scaleX;
    const innerTop = bounds.top + canvasEl.clientTop * scaleY;
    const innerW = Math.max(1, canvasEl.clientWidth * scaleX);
    const innerH = Math.max(1, canvasEl.clientHeight * scaleY);
    return {
      x:clamp(Math.floor((event.clientX - innerLeft) * (W / innerW)), 0, W - 1),
      y:clamp(Math.floor((event.clientY - innerTop) * (H / innerH)), 0, H - 1)
    };
  };
  const skyStopAt = y => {
    const gy = Math.round(H * (1 - stage.groundRatio));
    if(y >= gy || !scenery.sky.length) return null;
    const rel = gy > 0 ? y / gy : 0;
    let best = 0;
    scenery.sky.forEach((stop, i) => {
      if(Math.abs((Number(stop.p) || 0) - rel) < Math.abs((Number(scenery.sky[best].p) || 0) - rel)) best = i;
    });
    return { skyStop:best };
  };

  // ---- Pincel ----
  const setPaintTool = tool => {
    DECOR_PAINT.tool = tool === 'eyedropper' ? 'eyedropper' : 'brush';
    paintToolsConfig().activeTool = DECOR_PAINT.tool;
    applyConfigToLiveGame();
    syncToolbar();
    status.textContent = DECOR_PAINT.tool === 'eyedropper'
      ? 'GOTERO: click sobre el mapa para tomar el color de esa parte.'
      : 'PINCEL: click y arrastra para pintar pixeles locales.';
  };
  const setBrushSize = value => {
    DECOR_PAINT.size = clamp(Math.round(Number(value) || 1), 1, 16);
    paintToolsConfig().brushSize = DECOR_PAINT.size;
    applyConfigToLiveGame();
    syncToolbar();
  };
  const setColor = value => {
    const color = safeHexColor(value, DECOR_PAINT.color).toLowerCase();
    DECOR_PAINT.color = color;
    paintToolsConfig().activeColor = color;
    rememberDecorWorldColor(stage, color);
    syncToolbar();
  };
  const brush = createDecorBrushController(stage, {
    status,
    setColor,
    onCommit:() => {
      schedulePanorama();
      renderSide();
    },
    onStroke:owner => {
      state.history.push(owner);
      if(state.history.length > 120) state.history.shift();
      syncToolbar();
    }
  });
  const pickInEditor = event => {
    const pos = Object.assign(canvasPos(event), { cameraX:state.cameraX });
    if(brush.isPainting()) return pos;
    let hit = null;
    if(state.target === 'layer'){
      const layer = selectedLayer();
      if(layer){
        withEditorView(state.cameraX, decorPickCtx(), () => {
          const found = pickDecorLayerKeyInContext(layer, groundY(), pos.x, pos.y);
          if(found) hit = { layerIdx:state.selected, layer, key:found.key, fallback:!!found.fallback };
        });
      } else {
        hit = skyStopAt(pos.y);
      }
    } else {
      hit = withDecorPreviewCamera(state.cameraX, () => {
        setProgressFor(state.cameraX);
        return pickDecorElementAt(stage, pos.x, pos.y);
      });
    }
    return Object.assign(pos, hit || {});
  };
  const undo = () => {
    const owner = state.history.pop();
    if(!owner){
      status.textContent = 'No hay trazos de esta sesion para deshacer.';
      return;
    }
    // Los trazos se agregan al final de su capa: deshacer = quitar el ultimo
    // del mismo dueño (sanitize recrea los objetos, no sirven como referencia).
    if(Array.isArray(owner.brushStrokes) && owner.brushStrokes.length) owner.brushStrokes.pop();
    applyConfigToLiveGame();
    schedulePanorama();
    renderSide();
    syncToolbar();
    status.textContent = 'Trazo deshecho.';
  };

  // ---- Barra de herramientas ----
  const makeTool = (label, title, action, onClick) => {
    const button = make('button', '', label);
    button.title = title;
    button.dataset.action = action;
    button.addEventListener('click', event => {
      event.preventDefault();
      onClick();
      viewport.focus();
    });
    return button;
  };
  const addGroup = (label, controls) => {
    const group = make('div', 'decor-layer-toolgroup');
    group.append(make('span', '', label), ...controls);
    toolbar.appendChild(group);
  };
  const setMode = mode => {
    state.mode = mode === 'move' ? 'move' : 'paint';
    syncToolbar();
    status.textContent = state.mode === 'paint'
      ? 'PINTAR: arrastra sobre el mapa. Shift+arrastrar o Espacio mueve el lienzo.'
      : 'NAVEGAR: arrastra a los lados para recorrer el mapa. Shift+arrastrar mueve el lienzo.';
  };
  const setTarget = target => {
    state.target = target === 'layer' ? 'layer' : 'auto';
    syncToolbar();
    const layer = selectedLayer();
    status.textContent = state.target === 'layer'
      ? `Objetivo: solo ${layer ? DECOR_TYPES[layer.type].label : 'CIELO'} (elige otra capa en el panel).`
      : 'Objetivo AUTO: se pinta el elemento que este bajo el cursor.';
  };
  const modePaint = makeTool('PINTAR', 'Pintar sobre el mapa (P)', 'mode-paint', () => setMode('paint'));
  const modeMove = makeTool('NAVEGAR', 'Arrastrar para recorrer el mapa (M)', 'mode-move', () => setMode('move'));
  addGroup('Modo', [modePaint, modeMove]);
  const targetAuto = makeTool('AUTO', 'Pintar el elemento bajo el cursor', 'target-auto', () => setTarget('auto'));
  const targetLayer = makeTool('CAPA ELEGIDA', 'Pintar solo la capa seleccionada en el panel (T)', 'target-layer', () => setTarget('layer'));
  addGroup('Objetivo', [targetAuto, targetLayer]);
  const brushButton = makeTool('PINCEL', 'Pintar con el color y grosor activos (B)', 'brush', () => setPaintTool('brush'));
  const eyedropperButton = makeTool('GOTERO', 'Tomar el color bajo el cursor (I)', 'eyedropper', () => setPaintTool('eyedropper'));
  const sizeReadout = make('span', 'decor-paint-readout');
  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.title = 'Color activo';
  colorInput.dataset.action = 'world-color';
  colorInput.addEventListener('change', () => setColor(colorInput.value));
  addGroup('Pintura', [
    brushButton,
    eyedropperButton,
    makeTool('-', 'Pincel mas fino ([)', 'size-down', () => setBrushSize(DECOR_PAINT.size - 1)),
    sizeReadout,
    makeTool('+', 'Pincel mas grueso (])', 'size-up', () => setBrushSize(DECOR_PAINT.size + 1)),
    colorInput
  ]);
  const paletteSelect = document.createElement('select');
  paletteSelect.dataset.action = 'world-palette';
  const paletteSwatches = make('div', 'decor-viewer-palette-swatches');
  paletteSelect.addEventListener('change', () => {
    paintToolsConfig().activePaletteId = paletteSelect.value;
    applyConfigToLiveGame();
    renderPalette();
    viewport.focus();
  });
  addGroup('Paleta', [paletteSelect, paletteSwatches]);
  const undoButton = makeTool('↶ DESHACER', 'Deshacer el ultimo trazo de esta sesion (Ctrl+Z)', 'undo', undo);
  const highlightButton = makeTool('RESALTAR CAPA', 'Atenuar las demas capas para ubicar la elegida (H)', 'highlight', () => {
    state.highlight = !state.highlight;
    syncToolbar();
  });
  const lanesButton = makeTool('CARRILES', 'Mostrar la franja donde caminan los personajes (L)', 'lanes', () => {
    state.lanes = !state.lanes;
    syncToolbar();
  });
  addGroup('Vista', [
    undoButton,
    highlightButton,
    lanesButton,
    makeTool('-', 'Alejar', 'zoom-out', () => zoomAt(state.zoom / 1.25)),
    makeTool('AJUSTAR', 'Ajustar la vista a la ventana (0)', 'fit', fitView),
    makeTool('+', 'Acercar', 'zoom-in', () => zoomAt(state.zoom * 1.25))
  ]);
  function renderPalette(){
    const tools = paintToolsConfig();
    paletteSelect.innerHTML = '';
    tools.palettes.forEach(palette => {
      const option = document.createElement('option');
      option.value = palette.id;
      option.textContent = palette.name;
      option.selected = palette.id === tools.activePaletteId;
      paletteSelect.appendChild(option);
    });
    paletteSwatches.innerHTML = '';
    const palette = tools.palettes.find(item => item.id === tools.activePaletteId);
    const worldColors = collectDecorWorldColors(stage).slice(0, 8);
    sanitizeHexColorList([...(palette && palette.colors || []), ...worldColors], 24).forEach(color => {
      const swatch = make('button', 'paint-color-swatch');
      swatch.style.background = color;
      swatch.title = color;
      swatch.dataset.paintColor = color;
      swatch.addEventListener('click', () => {
        setColor(color);
        viewport.focus();
      });
      paletteSwatches.appendChild(swatch);
    });
    syncToolbar();
  }
  function syncToolbar(){
    modePaint.classList.toggle('active', state.mode === 'paint');
    modeMove.classList.toggle('active', state.mode === 'move');
    targetAuto.classList.toggle('active', state.target === 'auto');
    targetLayer.classList.toggle('active', state.target === 'layer');
    brushButton.classList.toggle('active', DECOR_PAINT.tool === 'brush');
    eyedropperButton.classList.toggle('active', DECOR_PAINT.tool === 'eyedropper');
    sizeReadout.textContent = `${DECOR_PAINT.size}px`;
    colorInput.value = safeHexColor(DECOR_PAINT.color, '#ff2e88');
    paletteSwatches.querySelectorAll('[data-paint-color]').forEach(swatch => {
      swatch.classList.toggle('active', swatch.dataset.paintColor.toLowerCase() === String(DECOR_PAINT.color).toLowerCase());
    });
    undoButton.textContent = `↶ DESHACER (${state.history.length})`;
    highlightButton.classList.toggle('active', state.highlight);
    lanesButton.classList.toggle('active', state.lanes);
    viewport.dataset.mode = state.mode;
    canvasEl.style.cursor = state.mode === 'move'
      ? 'grab'
      : (DECOR_PAINT.tool === 'eyedropper' ? 'copy' : 'crosshair');
  }

  // ---- Recorrido (transporte) ----
  const togglePlay = () => {
    if(!state.playing && state.cameraX >= maxCam()) setCamera(0);
    state.playing = !state.playing;
    playButton.textContent = state.playing ? '❚❚ PAUSA' : '▶ RECORRER';
    playButton.classList.toggle('active', state.playing);
  };
  const stopPlay = () => {
    if(!state.playing) return;
    state.playing = false;
    playButton.textContent = '▶ RECORRER';
    playButton.classList.remove('active');
  };
  const playButton = makeTool('▶ RECORRER', 'Recorrer el nivel como en la partida (R)', 'play', togglePlay);
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = '0';
  slider.step = '1';
  slider.dataset.action = 'world-camera';
  slider.title = 'Posicion en el mapa';
  slider.addEventListener('input', () => {
    stopPlay();
    setCamera(Number(slider.value));
  });
  const speedSelect = document.createElement('select');
  speedSelect.dataset.action = 'world-speed';
  speedSelect.title = 'Velocidad del recorrido';
  [0.5, 1, 2, 4].forEach(speed => {
    const option = document.createElement('option');
    option.value = String(speed);
    option.textContent = `x${speed}`;
    option.selected = speed === state.speed;
    speedSelect.appendChild(option);
  });
  speedSelect.addEventListener('change', () => { state.speed = Number(speedSelect.value) || 1; });
  // Momento del dia que se ve: escena base (lo que se pinta) o el look de
  // cada nivel; la tira se vuelve a generar con ese look.
  const timeSelect = document.createElement('select');
  timeSelect.dataset.action = 'world-time';
  timeSelect.title = 'Ver la escena base o el look de cada nivel (mañana, tarde, noche)';
  [{ value:-1, label:'ESCENA BASE' }].concat(stage.levels.map((level, lIdx) => ({
    value:lIdx,
    label:`N${lIdx + 1} ${LEVEL_TIME_LABELS[level.time]}`
  }))).forEach(opt => {
    const option = document.createElement('option');
    option.value = String(opt.value);
    option.textContent = opt.label;
    option.selected = Number(DECOR_PREVIEW_OPTS.level) === opt.value;
    timeSelect.appendChild(option);
  });
  timeSelect.addEventListener('change', () => {
    DECOR_PREVIEW_OPTS.level = clamp(parseInt(timeSelect.value, 10), -1, 2);
    invalidatePanorama();
  });
  const readout = make('div', 'world-editor-readout');
  transport.append(
    makeTool('|◀', 'Inicio del nivel (Inicio)', 'cam-start', () => { stopPlay(); setCamera(0); }),
    makeTool('◀◀', 'Una pantalla atras (Shift+←)', 'cam-prev-screen', () => { stopPlay(); setCamera(state.cameraX - W); }),
    makeTool('◀', 'Un tramo atras (←)', 'cam-prev', () => { stopPlay(); setCamera(state.cameraX - 48); }),
    playButton,
    makeTool('▶', 'Un tramo adelante (→)', 'cam-next', () => { stopPlay(); setCamera(state.cameraX + 48); }),
    makeTool('▶▶', 'Una pantalla adelante (Shift+→)', 'cam-next-screen', () => { stopPlay(); setCamera(state.cameraX + W); }),
    makeTool('▶|', 'Final del nivel (Fin)', 'cam-end', () => { stopPlay(); setCamera(maxCam()); }),
    slider,
    speedSelect,
    timeSelect,
    readout
  );
  const updateReadout = () => {
    const top = maxCam();
    const cam = Math.round(state.cameraX);
    const pct = top > 0 ? Math.round(cam / top * 100) : 0;
    let nextWave = null;
    editorLevelWaves().forEach((wave, i) => {
      const tx = Math.round(waveTriggerX(wave));
      if(tx > cam && (!nextWave || tx < nextWave.x)) nextWave = { i, x:tx };
    });
    const text = `X ${cam} / ${top} · ${pct}% · ${nextWave ? `proxima oleada O${nextWave.i + 1} en X ${nextWave.x}` : 'sin oleadas pendientes'}`;
    const metaText = `ZOOM ${Math.round(state.zoom * 100)}%`;
    const headingText = `MODO DIBUJO · #${idx + 1} ${stage.name}`;
    const signature = `${text}|${metaText}|${headingText}`;
    if(signature !== state.lastReadout){
      state.lastReadout = signature;
      readout.textContent = text;
      slider.max = String(top);
      if(document.activeElement !== slider) slider.value = String(cam);
      meta.textContent = metaText;
      heading.textContent = headingText;
    }
  };

  // ---- Panel lateral: capas y propiedades ----
  const makeMini = (label, title, onClick) => {
    const button = make('button', 'world-editor-mini', label);
    button.title = title;
    button.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      onClick();
    });
    return button;
  };
  const applyAndRefresh = () => {
    applyConfigToLiveGame();
    schedulePanorama();
    renderSide();
  };
  const selectLayer = layerIdx => {
    state.selected = layerIdx >= 0 && scenery.layers[layerIdx] ? layerIdx : -1;
    renderSide();
    const layer = selectedLayer();
    status.textContent = layer
      ? `Capa elegida: ${DECOR_TYPES[layer.type].label}. ${state.target === 'layer' ? 'Solo esta capa recibe pintura.' : 'Usa CAPA ELEGIDA (T) para pintar solo sobre ella.'}`
      : 'CIELO Y NIVEL: nombre, largo, horizonte y gradiente del cielo.';
  };
  const moveLayer = (layerIdx, dir) => {
    const target = layerIdx + dir;
    if(target < 0 || target >= scenery.layers.length) return;
    const tmp = scenery.layers[target];
    scenery.layers[target] = scenery.layers[layerIdx];
    scenery.layers[layerIdx] = tmp;
    if(state.selected === layerIdx) state.selected = target;
    else if(state.selected === target) state.selected = layerIdx;
    applyAndRefresh();
  };
  const setZone = kind => {
    const layer = selectedLayer();
    if(!layer) return;
    const top = maxCam();
    const here = top > 0 ? Math.round(clamp(state.cameraX / top, 0, 1) * 100) / 100 : 0;
    if(kind === 'start'){
      layer.zoneStart = here;
      if(!(Number(layer.zoneEnd) > here)) layer.zoneEnd = 1;
    } else if(kind === 'end'){
      layer.zoneEnd = here;
      if(Number(layer.zoneStart) > here) layer.zoneStart = 0;
    } else {
      layer.zoneStart = 0;
      layer.zoneEnd = 1;
    }
    applyAndRefresh();
    status.textContent = `Zona de ${DECOR_TYPES[layer.type].label}: ${Math.round(layer.zoneStart * 100)}% - ${Math.round(layer.zoneEnd * 100)}% del nivel (referencia: centro de la vista).`;
  };
  const renderLayerProps = props => {
    const layer = selectedLayer();
    const def = DECOR_TYPES[layer.type];
    props.appendChild(make('h4', 'world-editor-side-title', `${state.selected + 1}. ${def.label}`));
    const actions = make('div', 'cfg-button-strip world-editor-actions');
    actions.append(
      makeMini('ZONA DESDE AQUI', 'La capa empieza donde esta el centro de la vista', () => setZone('start')),
      makeMini('ZONA HASTA AQUI', 'La capa termina donde esta el centro de la vista', () => setZone('end')),
      makeMini('ZONA COMPLETA', 'La capa ocupa todo el nivel', () => setZone('all')),
      makeMini('⧉ DUPLICAR', 'Copiar la capa justo delante con otra seed', () => {
        scenery.layers.splice(state.selected + 1, 0, duplicateDecorLayer(layer));
        state.selected += 1;
        applyAndRefresh();
      }),
      makeMini('✕ QUITAR', 'Eliminar esta capa', () => {
        if(!confirm(`Quitar la capa ${def.label} de "${stage.name}"?`)) return;
        scenery.layers.splice(state.selected, 1);
        state.selected = Math.min(state.selected, scenery.layers.length - 1);
        applyAndRefresh();
      })
    );
    if(Array.isArray(layer.brushStrokes) && layer.brushStrokes.length){
      actions.append(
        makeMini('↶ TRAZO', 'Quitar el ultimo trazo local de esta capa', () => {
          layer.brushStrokes.pop();
          applyAndRefresh();
        }),
        makeMini('LIMPIAR PINTURA', 'Quitar todos los trazos locales de esta capa', () => {
          if(!confirm(`Quitar toda la pintura local de ${def.label}?`)) return;
          layer.brushStrokes = [];
          applyAndRefresh();
        })
      );
    }
    props.appendChild(actions);
    appendDecorLayerRows(props, stage, layer, () => renderPalette());
  };
  const renderSkyProps = props => {
    props.appendChild(make('h4', 'world-editor-side-title', 'NIVEL'));
    textRow(props, 'Nombre', stage, 'name');
    textRow(props, 'Tag', stage, 'tag');
    numberRow(props, 'Largo (length)', stage, 'length', 10);
    rangeRow(props, 'Horizonte (ground ratio)', stage, 'groundRatio', 0.2, 0.7, 0.01);
    props.appendChild(make('h4', 'world-editor-side-title', 'CIELO (gradiente)'));
    scenery.sky.forEach((stop, i) => {
      const row = make('div', 'world-editor-sky-row');
      const label = make('label', '', `Parada ${i + 1}`);
      const color = document.createElement('input');
      color.type = 'color';
      color.value = safeHexColor(stop.c, '#000000');
      color.addEventListener('input', () => {
        stop.c = color.value;
        rememberDecorWorldColor(stage, color.value);
      });
      const pos = document.createElement('input');
      pos.type = 'range';
      pos.min = '0';
      pos.max = '1';
      pos.step = '0.01';
      pos.value = String(stop.p);
      pos.addEventListener('input', () => {
        stop.p = parseFloat(pos.value);
        applyConfigToLiveGame();
      });
      row.append(label, color, pos, makeMini('✕', 'Quitar parada', () => {
        if(scenery.sky.length <= 2){ showToast('El cielo necesita al menos 2 paradas'); return; }
        scenery.sky.splice(i, 1);
        applyAndRefresh();
      }));
      props.appendChild(row);
    });
    const skyActions = make('div', 'cfg-button-strip world-editor-actions');
    if(scenery.sky.length < 6){
      skyActions.appendChild(makeMini('+ PARADA', 'Agregar una parada de color al cielo', () => {
        const last = scenery.sky[scenery.sky.length - 1];
        scenery.sky.push({ p:1, c:last ? last.c : '#000000' });
        applyAndRefresh();
      }));
    }
    if(Array.isArray(scenery.brushStrokes) && scenery.brushStrokes.length){
      skyActions.append(
        makeMini('↶ TRAZO', 'Quitar el ultimo trazo local del cielo', () => {
          scenery.brushStrokes.pop();
          applyAndRefresh();
        }),
        makeMini('LIMPIAR PINTURA', 'Quitar todos los trazos locales del cielo', () => {
          if(!confirm('Quitar toda la pintura local del cielo?')) return;
          scenery.brushStrokes = [];
          applyAndRefresh();
        })
      );
    }
    props.appendChild(skyActions);
  };
  function renderSide(){
    const scroll = side.scrollTop;
    side.innerHTML = '';
    side.appendChild(make('h4', 'world-editor-side-title', 'CAPAS (fondo → frente)'));
    const list = make('div', 'world-editor-layer-list');
    const skyRow = make('div', `world-editor-layer${state.selected === -1 ? ' active' : ''}`);
    skyRow.dataset.layerIndex = '-1';
    skyRow.append(make('span', 'world-editor-layer-dot', '◐'), make('span', 'world-editor-layer-name', 'CIELO Y NIVEL'));
    skyRow.addEventListener('click', () => selectLayer(-1));
    list.appendChild(skyRow);
    scenery.layers.forEach((layer, i) => {
      const def = DECOR_TYPES[layer.type];
      if(!def) return;
      const row = make('div', `world-editor-layer${i === state.selected ? ' active' : ''}${layer.on === false ? ' off' : ''}`);
      row.dataset.layerIndex = String(i);
      const visible = document.createElement('input');
      visible.type = 'checkbox';
      visible.checked = layer.on !== false;
      visible.title = 'Visible';
      visible.addEventListener('click', event => event.stopPropagation());
      visible.addEventListener('change', () => {
        layer.on = visible.checked;
        applyAndRefresh();
      });
      const name = make('span', 'world-editor-layer-name', `${i + 1}. ${def.label}`);
      const zone = decorLayerZone(layer);
      if(zone) name.appendChild(make('span', 'zone-tag', ` ${Math.round(zone.start * 100)}-${Math.round(zone.end * 100)}%`));
      row.append(
        visible,
        name,
        makeMini('▲', 'Mas al fondo', () => moveLayer(i, -1)),
        makeMini('▼', 'Mas al frente', () => moveLayer(i, 1))
      );
      row.addEventListener('click', () => selectLayer(i));
      list.appendChild(row);
    });
    side.appendChild(list);
    const addWrap = make('div', 'world-editor-add');
    const addSelect = document.createElement('select');
    addSelect.dataset.action = 'world-add-type';
    let groupName = null;
    let groupEl = null;
    decorTypeOptions().forEach(opt => {
      if(opt.group !== groupName){
        groupEl = document.createElement('optgroup');
        groupEl.label = opt.group;
        addSelect.appendChild(groupEl);
        groupName = opt.group;
      }
      const option = document.createElement('option');
      option.value = opt.value;
      option.textContent = opt.label;
      option.selected = opt.value === decorAddType;
      groupEl.appendChild(option);
    });
    addWrap.append(addSelect, makeMini('+ AÑADIR', 'Agregar la capa elegida delante de la seleccionada', () => {
      const layer = makeDecorLayer(addSelect.value);
      if(!layer) return;
      decorAddType = addSelect.value;
      const at = state.selected >= 0 ? state.selected + 1 : scenery.layers.length;
      scenery.layers.splice(at, 0, layer);
      state.selected = at;
      applyAndRefresh();
      status.textContent = `Capa añadida: ${DECOR_TYPES[layer.type].label}. Ajusta su zona para ubicarla en un tramo del mapa.`;
    }));
    side.appendChild(addWrap);
    const props = make('div', 'world-editor-props');
    if(selectedLayer()) renderLayerProps(props);
    else {
      state.selected = -1;
      renderSkyProps(props);
    }
    side.appendChild(props);
    side.scrollTop = scroll;
  }
  // Cualquier edicion del panel refresca la tira del mapa completo.
  side.addEventListener('input', schedulePanorama);
  side.addEventListener('change', schedulePanorama);

  // ---- Raton y teclado ----
  attachPaintPencil(canvasEl, brush.handlers(pickInEditor, null, {
    status,
    canStart:event => state.mode === 'paint' && !state.spaceHeld && !(event && event.shiftKey),
    canHover:() => state.mode === 'paint' && !state.spaceHeld && !state.dragging,
    canEyedrop:event => state.mode === 'paint' && !state.spaceHeld && !(event && event.shiftKey),
    afterEyedrop:() => syncToolbar(),
    cursor:() => state.mode === 'move' || state.spaceHeld
      ? 'grab'
      : (DECOR_PAINT.tool === 'eyedropper' ? 'copy' : 'crosshair')
  }));
  const onViewportDown = event => {
    const wantsPan = event.button === 1 || (event.button === 0 && (state.spaceHeld || event.shiftKey));
    const wantsWorld = event.button === 0 && state.mode === 'move';
    if(!wantsPan && !wantsWorld) return;
    event.preventDefault();
    stopPlay();
    state.dragging = true;
    state.dragMode = wantsPan ? 'pan' : 'world';
    state.dragX = event.clientX;
    state.dragY = event.clientY;
    viewport.classList.add('dragging');
  };
  const onMouseMove = event => {
    if(state.stripDragging){
      setCamera(stripToCamera(event));
      return;
    }
    if(!state.dragging) return;
    const dx = event.clientX - state.dragX;
    const dy = event.clientY - state.dragY;
    state.dragX = event.clientX;
    state.dragY = event.clientY;
    if(state.dragMode === 'pan'){
      state.panX += dx;
      state.panY += dy;
      state.fit = false;
      updateView();
    } else {
      setCamera(state.cameraX - dx / Math.max(0.1, state.zoom));
    }
  };
  const onMouseUp = () => {
    state.stripDragging = false;
    if(!state.dragging) return;
    state.dragging = false;
    viewport.classList.remove('dragging');
  };
  const onWheel = event => {
    event.preventDefault();
    if(event.ctrlKey || event.metaKey){
      zoomAt(state.zoom * (event.deltaY < 0 ? 1.2 : 1 / 1.2), event.clientX, event.clientY);
      return;
    }
    stopPlay();
    const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
    setCamera(state.cameraX + delta * 0.8);
  };
  const onStripDown = event => {
    if(event.button !== 0) return;
    event.preventDefault();
    stopPlay();
    state.stripDragging = true;
    setCamera(stripToCamera(event));
  };
  const typingInEditor = () => {
    const active = document.activeElement;
    return !!active && overlay.contains(active) && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName) && active.type !== 'range' && active.type !== 'checkbox' && active.type !== 'color';
  };
  const onKeyDown = event => {
    if(event.key === 'Escape'){
      event.preventDefault();
      event.stopImmediatePropagation();
      closeWorldEditor();
      return;
    }
    if(typingInEditor()) return;
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    const step = event.shiftKey ? W : 48;
    const actions = {
      ' ':() => { state.spaceHeld = true; },
      p:() => setMode('paint'),
      m:() => setMode('move'),
      b:() => setPaintTool('brush'),
      i:() => setPaintTool('eyedropper'),
      '[':() => setBrushSize(DECOR_PAINT.size - 1),
      ']':() => setBrushSize(DECOR_PAINT.size + 1),
      r:togglePlay,
      t:() => setTarget(state.target === 'layer' ? 'auto' : 'layer'),
      h:() => { state.highlight = !state.highlight; syncToolbar(); },
      l:() => { state.lanes = !state.lanes; syncToolbar(); },
      '0':fitView,
      '+':() => zoomAt(state.zoom * 1.25),
      '=':() => zoomAt(state.zoom * 1.25),
      '-':() => zoomAt(state.zoom / 1.25),
      ArrowLeft:() => { stopPlay(); setCamera(state.cameraX - step); },
      ArrowRight:() => { stopPlay(); setCamera(state.cameraX + step); },
      a:() => { stopPlay(); setCamera(state.cameraX - step); },
      d:() => { stopPlay(); setCamera(state.cameraX + step); },
      Home:() => { stopPlay(); setCamera(0); },
      End:() => { stopPlay(); setCamera(maxCam()); }
    };
    let action = actions[key];
    if(key === 'z' && (event.ctrlKey || event.metaKey)) action = undo;
    else if(event.ctrlKey || event.metaKey || event.altKey) action = null;
    if(!action) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    action();
  };
  const onKeyUp = event => {
    if(event.key === ' ') state.spaceHeld = false;
  };
  const onResize = () => {
    layoutStrip();
    if(state.fit) fitView();
  };
  const destroy = () => {
    if(state.rafId) cancelAnimationFrame(state.rafId);
    clearTimeout(state.panoTimer);
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    window.removeEventListener('keydown', onKeyDown, true);
    window.removeEventListener('keyup', onKeyUp, true);
    window.removeEventListener('resize', onResize);
    decorProgressOverride = null;
    decorLayerHighlight = null;
    overlay.remove();
    // El panel refleja lo editado (capas, zonas, trazos, nombre...).
    refreshDecorTabPreservingScroll();
  };
  worldEditorSession = { destroy, stageIdx:idx };
  closeButton.addEventListener('click', closeWorldEditor);
  overlay.addEventListener('mousedown', event => {
    if(event.target === overlay) closeWorldEditor();
  });
  stageSelect.addEventListener('change', () => {
    const next = clamp(parseInt(stageSelect.value, 10) || 0, 0, CONFIG.stages.length - 1);
    decorSelectedStage = next;
    openWorldEditor(next);
  });
  viewport.addEventListener('mousedown', onViewportDown);
  viewport.addEventListener('wheel', onWheel, { passive:false });
  strip.addEventListener('wheel', onWheel, { passive:false });
  stripCanvas.addEventListener('mousedown', onStripDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  window.addEventListener('keydown', onKeyDown, true);
  window.addEventListener('keyup', onKeyUp, true);
  window.addEventListener('resize', onResize);

  const loop = () => {
    if(!overlay.isConnected) return;
    // Config reemplazada por completo (sincronizacion con la otra ventana o
    // preset): los objetos del editor quedaron viejos, se reabre sobre la nueva.
    if(CONFIG !== configRef){
      const cameraX = state.cameraX;
      const layerIdx = state.selected >= 0 ? state.selected : undefined;
      closeWorldEditor();
      if(CONFIG.stages.length) openWorldEditor(Math.min(idx, CONFIG.stages.length - 1), { cameraX, layerIdx });
      return;
    }
    state.time += 1;
    decorPreviewTime = state.time;
    if(state.playing){
      const next = state.cameraX + 1.2 * state.speed;
      if(next >= maxCam()){
        setCamera(maxCam());
        stopPlay();
      } else {
        setCamera(next);
      }
    }
    if(state.panoFrames !== panoFrameCount()) invalidatePanorama();
    renderPanoramaStep();
    renderMain();
    drawStrip();
    updateReadout();
    state.rafId = requestAnimationFrame(loop);
  };
  renderPalette();
  renderSide();
  syncToolbar();
  setCamera(state.cameraX);
  invalidatePanorama();
  requestAnimationFrame(() => {
    layoutStrip();
    fitView();
    viewport.focus();
  });
  state.rafId = requestAnimationFrame(loop);
}
function startDecorPreviewLoop(canvasEl){
  if(decorPreviewRafId) cancelAnimationFrame(decorPreviewRafId);
  const pctx = canvasEl.getContext('2d');
  pctx.imageSmoothingEnabled = false;
  const step = () => {
    if(!canvasEl.isConnected){ decorPreviewRafId = 0; return; }
    // Con el MODO DIBUJO abierto la vista previa queda tapada: no gastar renders.
    if(worldEditorSession){ decorPreviewRafId = requestAnimationFrame(step); return; }
    decorPreviewTime += 1;
    if(DECOR_PREVIEW_OPTS.scroll){
      const stage = CONFIG.stages[clamp(decorSelectedStage, 0, CONFIG.stages.length - 1)];
      const maxCam = Math.max(1, (Number(stage && stage.length) || W * 2) * (Number(CONFIG.general.stageLengthMul) || 1) - W);
      decorPreviewCam = (decorPreviewCam + 0.6) % maxCam;
    }
    renderDecorPreviewFrame(pctx);
    // Miniaturas de capas: una por frame (round-robin) para mantenerlas
    // vivas (colores/seed/escala) sin costar 15 renders por frame.
    if(decorThumbQueue.length){
      decorThumbIdx = (decorThumbIdx + 1) % decorThumbQueue.length;
      const thumb = decorThumbQueue[decorThumbIdx];
      if(thumb.canvas.isConnected){
        renderDecorLayerThumb(thumb.stage, thumb.layer, thumb.ctx);
      }
    }
    decorPreviewRafId = requestAnimationFrame(step);
  };
  decorPreviewRafId = requestAnimationFrame(step);
}

  const previewCanvas = document.createElement('canvas');

  }))), DECOR_PREVIEW_OPTS.level, value => {

// ==== PREVIEW PINTABLE DE ENEMIGOS ====
// Cada tarjeta de la pestaña ENEMIES tiene un canvas con el sprite animado
// (camina y, ciclicamente, ataca — asi el thrower muestra sus proyectiles).
// Se pinta con el mismo lapiz del DECOR: el picking re-dibuja el sprite con
// colores-ID por parte (cuerpo, ojos, pupilas, garras, metal, orbes...).
const ENEMY_PREVIEW_W = 96;
const ENEMY_PREVIEW_H = 64;
let enemyPreviewItems = [];
let enemyPreviewRafId = 0;
let enemyPreviewTime = 0;
let enemyPickCtxCache = null;
function enemyPickCtx(){
  if(!enemyPickCtxCache){
    const pickCanvas = document.createElement('canvas');
    pickCanvas.width = ENEMY_PREVIEW_W;
    pickCanvas.height = ENEMY_PREVIEW_H;
    enemyPickCtxCache = pickCanvas.getContext('2d', { willReadFrequently:true });
  }
  return enemyPickCtxCache;
}
function enemyPaintKeys(typeKey){
  const cfg = CONFIG.enemies[typeKey] || {};
  const def = ENEMY_SPRITE_COLORS[resolveEnemySprite(cfg.sprite || typeKey)] || ENEMY_SPRITE_COLORS.small;
  return { def, keys: ['body'].concat(Object.keys(def.defaults)) };
}
// Descripcion de cada habilidad del bestiario (pestaña ENEMIES).
const ENEMY_ABILITY_INFO = {
  burrow:'Se entierra, viaja bajo la arena asomando el aguijon y brota bajo el jugador tras un anillo de aviso.',
  lash:'Lanza una venda por su carril y jala al jugador hacia ella.',
  kamikaze:'No golpea: al llegar enciende la mecha y explota (tambien daña a otros enemigos). De noche explota al morir.',
  charge:'Se alinea con tu carril, acelera el motor y embiste de lado a lado. Cambia de carril para esquivarlo.',
  hover:'Vuela a media distancia y dispara por su carril tras una mira laser. De noche, rafaga doble.',
  blink:'Se desvanece en holograma, reaparece a tu espalda y corta con la katana.',
  spores:'Suelta nubes de esporas que envenenan y frenan. Al morir deja una nube mas chica.',
  pounce:'Merodea en circulos, se agazapa y salta sobre ti.',
  spit:'Avanza a saltos y escupe veneno en arco que deja un charco toxico.',
  stealth:'Camina casi invisible; se revela para lanzar la lengua, que roba energia del especial.',
  split:'Al reventar se divide en dos mas chicos (de noche, dos veces).',
  shield:'Escudo frontal que bloquea golpes ligeros y disparos. Flanquealo o rompe su guardia con golpe fuerte, especial, patada en picada o lanzandole algo.'
};
// Poses de la vista previa: cada monstruo muestra su habilidad en bucle.
const ENEMY_PREVIEW_POSES = {
  scorpion: t => t < 30 ? { abil:'under' } : { abil:'warn', abilT:60 - t },
  mummy: t => ({ abil:'lash', abilLen:Math.min(30, t * 2) }),
  gnome: t => ({ abil:'fuse', abilT:60 - t }),
  mower: t => ({ abil:t < 30 ? 'rev' : 'dash' }),
  drone: t => ({ abil:'aim' }),
  ninja: t => t < 16 ? { abil:'fade', abilT:16 - t } : t < 26 ? { abil:'appear', abilT:26 - t } : { abil:'slash', abilT:Math.max(0, 12 - Math.floor((t - 26) / 2)) },
  shroom: t => ({ abil:'puff', abilT:24 - (t % 24) }),
  wolf: t => t < 20 ? { abil:'crouch' } : { abil:'leap', y:Math.max(0, Math.round(Math.sin((t - 20) / 40 * Math.PI) * 12)) },
  frog: t => t < 30 ? { abil:'spit', abilT:Math.max(0, 24 - Math.floor(t * 0.8)) } : { abil:'hop', y:Math.max(0, Math.round(Math.sin((t - 30) / 30 * Math.PI) * 10)) },
  chameleon: t => t < 30 ? { previewReveal:false } : { abil:'tongue', abilLen:Math.min(28, (t - 30) * 2) },
  sentinel: t => t < 30 ? { abil:'cannon', abilT:28 - t } : { guardDown:40 }
};
function makePreviewEnemy(typeKey){
  const cfg = CONFIG.enemies[typeKey] || {};
  const t = enemyPreviewTime % 180;
  const attacking = t > 130;
  const enemy = {
    id: 1,
    eType: typeKey,
    sprite: resolveEnemySprite(cfg.sprite || typeKey),
    color: cfg.color,
    width: cfg.width ?? 16,
    height: cfg.height ?? 22,
    facing: 1,
    anim: enemyPreviewTime,
    state: attacking ? 'attack' : 'walk',
    stateTimer: attacking ? 17 : 0,
    knockedDown: 0,
    flash: 0,
    hp: 1,
    y: 0,
    tier: 3,
    abil: '',
    abilT: 0,
    abilLen: 0,
    revealT: 0,
    guardDown: 0,
    previewReveal: true
  };
  // El dron siempre flota; el resto muestra su habilidad entre el paso y el ataque.
  if(cfg.ability === 'hover') enemy.y = 14;
  const pose = ENEMY_PREVIEW_POSES[enemy.sprite];
  if(pose && t > 70 && t <= 130) Object.assign(enemy, pose(t - 70, enemy));
  return enemy;
}
function renderEnemyPreviewFrame(item){
  const oldCtx = ctx;
  const oldTime = game.time;
  ctx = item.ctx;
  game.time = enemyPreviewTime;
  try {
    ctx.fillStyle = '#0a0020';
    ctx.fillRect(0, 0, ENEMY_PREVIEW_W, ENEMY_PREVIEW_H);
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fillRect(0, ENEMY_PREVIEW_H - 11, ENEMY_PREVIEW_W, 1);
    const fake = makePreviewEnemy(item.type);
    drawEnemy(fake, ENEMY_PREVIEW_W / 2 - 4, ENEMY_PREVIEW_H - 12 - (fake.y || 0));
  } finally {
    ctx = oldCtx;
    game.time = oldTime;
  }
}
function startEnemyPreviewLoop(){
  if(enemyPreviewRafId) cancelAnimationFrame(enemyPreviewRafId);
  const step = () => {
    enemyPreviewItems = enemyPreviewItems.filter(item => item.canvas.isConnected);
    if(!enemyPreviewItems.length){ enemyPreviewRafId = 0; return; }
    enemyPreviewTime += 1;
    for(const item of enemyPreviewItems) renderEnemyPreviewFrame(item);
    enemyPreviewRafId = requestAnimationFrame(step);
  };
  enemyPreviewRafId = requestAnimationFrame(step);
}
// Parte del sprite bajo (x,y): re-dibuja con colores-ID y decodifica la clave.
function pickEnemyColorKey(typeKey, x, y){
  const { keys } = enemyPaintKeys(typeKey);
  const idMap = {};
  keys.forEach((key, idx) => { idMap[key] = `rgb(40,${10 + idx * 24},250)`; });
  const pctx = enemyPickCtx();
  const oldCtx = ctx;
  const oldTime = game.time;
  ctx = pctx;
  game.time = enemyPreviewTime;
  try {
    ctx.clearRect(0, 0, ENEMY_PREVIEW_W, ENEMY_PREVIEW_H);
    const fake = makePreviewEnemy(typeKey);
    fake.colorMap = idMap;
    fake.noShadow = true;
    // Mismo fotograma que se ve: los efectos de habilidad (lengua, laser,
    // esporas...) tambien se pintan cuando aparecen en la vista previa.
    drawEnemy(fake, ENEMY_PREVIEW_W / 2 - 4, ENEMY_PREVIEW_H - 12 - (fake.y || 0));
  } finally {
    ctx = oldCtx;
    game.time = oldTime;
  }
  const data = pctx.getImageData(x, y, 1, 1).data;
  if(data[3] === 0) return null;
  if(Math.abs(data[0] - 40) <= 10 && data[2] >= 225){
    const idx = Math.round((data[1] - 10) / 24);
    if(idx >= 0 && idx < keys.length && Math.abs(data[1] - (10 + idx * 24)) <= 10) return keys[idx];
  }
  return keys[0];
}
function enemyColorValue(typeKey, colorKey){
  const cfg = CONFIG.enemies[typeKey];
  if(!cfg) return null;
  if(colorKey === 'body') return cfg.color;
  return cfg.colors && cfg.colors[colorKey];
}
function renderEnemiesTab(root){
  enemyPreviewItems = [];
  const section = makeSection('Enemies');
  noteRow(section, 'Cada enemigo tiene su preview animada y pintable: manten pulsado y arrastra el lapiz sobre el sprite para pintar cada parte (cuerpo, ojos, garras...). Click derecho = cuentagotas. El thrower muestra su proyectil al atacar.');
  const paintUI = appendPaintControls(section);
  const paintStatus = paintUI.status;
  const grid = document.createElement('div');
  grid.className = 'cfg-grid';
  let enemyPaintDirty = false;
  const commitEnemyPaint = () => {
    if(!enemyPaintDirty) return;
    enemyPaintDirty = false;
    applyConfigToLiveGame();
    refreshDecorTabPreservingScroll();
  };
  // Una tarjeta por tipo definido en CONFIG.enemies (data-driven: un tipo nuevo aparece solo).
  Object.keys(CONFIG.enemies).forEach(key => {
    const data = CONFIG.enemies[key];
    const { def } = enemyPaintKeys(key);
    const card = document.createElement('div');
    card.className = 'cfg-card';
    const title = document.createElement('h4');
    title.textContent = data.name ? `${data.name} (${key})` : key.charAt(0).toUpperCase() + key.slice(1);
    card.appendChild(title);
    if(data.ability && ENEMY_ABILITY_INFO[data.ability]){
      const worldTpl = WORLD_TEMPLATES.find(tpl => tpl.id === data.world);
      const beasts = worldBestiary(data.world);
      const when = beasts && beasts.noche === key ? 'NOCHE (nivel 3)' : 'TARDE y NOCHE (niveles 2 y 3)';
      noteRow(card, `${worldTpl ? worldTpl.label : 'MUNDO'} · aparece en ${when}. ${ENEMY_ABILITY_INFO[data.ability]}`);
    }

    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = ENEMY_PREVIEW_W;
    previewCanvas.height = ENEMY_PREVIEW_H;
    previewCanvas.style.width = '100%';
    previewCanvas.style.imageRendering = 'pixelated';
    previewCanvas.style.border = '1px solid rgba(0,240,255,.35)';
    previewCanvas.style.display = 'block';
    previewCanvas.style.margin = '4px 0 8px';
    const previewCtx = previewCanvas.getContext('2d');
    previewCtx.imageSmoothingEnabled = false;
    const item = { canvas: previewCanvas, ctx: previewCtx, type: key };
    enemyPreviewItems.push(item);
    renderEnemyPreviewFrame(item);

    const pickAt = event => {
      const pos = paintCanvasPos(previewCanvas, event, ENEMY_PREVIEW_W, ENEMY_PREVIEW_H);
      const colorKey = pickEnemyColorKey(key, pos.x, pos.y);
      return colorKey ? { type: key, key: colorKey } : null;
    };
    attachPaintPencil(previewCanvas, {
      pickAt,
      onHover: pick => {
        paintStatus.textContent = pick
          ? `${key.toUpperCase()} · ${def.labels[pick.key] || pick.key} (${enemyColorValue(key, pick.key)})`
          : 'Sin parte del sprite bajo el cursor.';
      },
      mutate: pick => {
        if(!pick) return false;
        if(pick.key === 'body'){
          if(data.color === DECOR_PAINT.color) return false;
          data.color = DECOR_PAINT.color;
          return true;
        }
        data.colors = isObject(data.colors) ? data.colors : {};
        if(data.colors[pick.key] === DECOR_PAINT.color) return false;
        data.colors[pick.key] = DECOR_PAINT.color;
        return true;
      },
      dirty: () => { enemyPaintDirty = true; },
      commit: commitEnemyPaint,
      eyedrop: pick => {
        if(!pick) return;
        const color = enemyColorValue(key, pick.key);
        if(!color) return;
        paintUI.setColor(color);
        paintStatus.textContent = `Cuentagotas: ${DECOR_PAINT.color} — ${key.toUpperCase()} · ${def.labels[pick.key] || pick.key}`;
      }
    });
    card.appendChild(previewCanvas);

    numberRow(card, 'HP', data, 'hp', 1);
    numberRow(card, 'ATK', data, 'atk', 1);
    rangeRow(card, 'Speed', data, 'spd', 0.1, 3, 0.05);
    numberRow(card, 'Attack range', data, 'atkRange', 1);
    rangeRow(card, 'Drop chance', data, 'dropChance', 0, 1, 0.05);
    numberRow(card, 'Width', data, 'width', 1);
    numberRow(card, 'Height', data, 'height', 1);
    numberRow(card, 'Score', data, 'score', 1);
    checkboxRow(card, 'Ranged', data, 'ranged');
    colorRow(card, def.labels.body || 'Color', data, 'color');
    Object.keys(def.defaults).forEach(colorKey => {
      colorRow(card, def.labels[colorKey] || colorKey, data.colors, colorKey);
    });
    grid.appendChild(card);
  });
  section.appendChild(grid);
  root.appendChild(section);
  startEnemyPreviewLoop();
}
// ==== VISTA PREVIA DE JEFES (pestaña BOSS) ====
// Cada tarjeta anima al jefe en reposo y recorre sus 3 ataques en bucle, en
// la fase elegida con "Ver fase 2". Usa los mismos drawBoss/efectos del juego.
const BOSS_PREVIEW_W = 220;
const BOSS_PREVIEW_H = 132;
const BOSS_PREVIEW_CYCLE = 240;
const BOSS_PREVIEW_PHASE2 = {};
let bossPreviewItems = [];
let bossPreviewRafId = 0;
let bossPreviewTime = 0;
function makePreviewBoss(kind){
  const def = BOSS_TYPES[kind] || BOSS_TYPES.bakeneko;
  const phase2 = !!BOSS_PREVIEW_PHASE2[kind];
  const t = bossPreviewTime % (BOSS_PREVIEW_CYCLE * def.attacks.length);
  const attack = def.attacks[Math.floor(t / BOSS_PREVIEW_CYCLE)];
  const local = t % BOSS_PREVIEW_CYCLE;
  const attacking = local >= 100 && local < 190;
  const frame = attacking ? local - 100 : 0;
  const hover = phase2 && (def.move || {}).hover2 !== false;
  return {
    kind,
    facing:-1,
    head2Active:phase2,
    hp1:1,
    hp2:1,
    maxHp:1,
    flash:0,
    state:'idle',
    dead:false,
    victoryTimer:0,
    y:hover ? ((def.move || {}).hoverBase ?? 16) + Math.sin(bossPreviewTime * 0.06) * 6 : 0,
    hoverPhase:bossPreviewTime * (phase2 ? 0.09 : 0.03),
    currentAttack:attacking ? attack.id : null,
    attackFrame:frame,
    fireAimDir:-1,
    chargeState:attacking && attack.kind === 'charge' ? (frame < 24 ? 'windup' : 'dash') : '',
    rainSpots:[],
    label:`${def.attacks.indexOf(attack) + 1}. ${attack.label}`,
    attacking
  };
}
function renderBossPreviewFrame(item){
  const oldCtx = ctx;
  const oldTime = game.time;
  ctx = item.ctx;
  game.time = bossPreviewTime;
  try {
    ctx.fillStyle = '#0a0020';
    ctx.fillRect(0, 0, BOSS_PREVIEW_W, BOSS_PREVIEW_H);
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fillRect(0, BOSS_PREVIEW_H - 14, BOSS_PREVIEW_W, 1);
    const boss = makePreviewBoss(item.kind);
    drawBoss(boss, Math.round(BOSS_PREVIEW_W * 0.58), Math.round(BOSS_PREVIEW_H - 14 - boss.y));
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'left';
    ctx.fillStyle = boss.attacking ? '#ffea00' : '#777d9b';
    ctx.fillText(boss.attacking ? boss.label : 'ESPERA', 6, 12);
    ctx.fillStyle = '#9aa1c1';
    ctx.fillText(bossTypeDef(boss).phases[boss.head2Active ? 1 : 0], 6, 22);
  } finally {
    ctx = oldCtx;
    game.time = oldTime;
  }
}
function startBossPreviewLoop(){
  if(bossPreviewRafId) cancelAnimationFrame(bossPreviewRafId);
  const step = () => {
    bossPreviewItems = bossPreviewItems.filter(item => item.canvas.isConnected);
    if(!bossPreviewItems.length){ bossPreviewRafId = 0; return; }
    bossPreviewTime += 1;
    for(const item of bossPreviewItems) renderBossPreviewFrame(item);
    bossPreviewRafId = requestAnimationFrame(step);
  };
  bossPreviewRafId = requestAnimationFrame(step);
}
